<!DOCTYPE html>
<!-- МЛП · nomenklatura.html v1 · 12.11.2026 — перевірка номенклатури: три рівні назв, масштаб залишків, перенесення технічних назв,
     перейменування й додавання рівнів 2 і 3, підтвердження бухгалтером і зав. складу, журнал змін (сервер — Nomen.gs v1, Code.gs v101).
     Даних у файлі немає: залишки віддає сервер лише зареєстрованим у МЛП (бухгалтер, зав. складу, адміністратор; перегляд — керівництво). -->
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Номенклатура · перевірка</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#EEF2F5;color:#1D2B33;font-size:15px;-webkit-text-size-adjust:100%}
  button{font:inherit;cursor:pointer}
  .hdr{background:#2F4858;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
  .hdr .ttl{font-size:17px;font-weight:700;flex:1;min-width:0}

  .hdr .who{font-size:12px;opacity:.9;text-align:right;line-height:1.35}
  .sync{font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
  .sync.bad{background:#B3261E}
  .main{max-width:1280px;margin:0 auto;padding:12px 14px 80px}
  .card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .intro{font-size:14px;line-height:1.5;color:#3C4C55}
  .intro b{color:#1D2B33}
  .intro details summary{cursor:pointer;color:#2F6F9F;font-weight:600;margin-top:6px}
  .intro ul{margin:6px 0 0;padding-left:20px}
  .prog{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px;color:#66767F}
  .prog .pb{flex:1;min-width:180px;height:8px;border-radius:99px;background:#E3E9ED;overflow:hidden;display:flex}
  .prog .pb i{display:block;height:100%}
  .tools{position:sticky;top:52px;z-index:15;background:#EEF2F5;padding:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tools input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid #C9D3D9;border-radius:10px;font:inherit;background:#fff}
  select{padding:8px 10px;border:1px solid #C9D3D9;border-radius:10px;font:inherit;background:#fff;max-width:100%}
  .btn{padding:8px 12px;border-radius:10px;border:1px solid #C9D3D9;background:#fff;color:#1D2B33;white-space:nowrap}
  .btn:hover{background:#F4F7F9}

  .grp{background:#fff;border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .gh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#DCE4E9;cursor:pointer;user-select:none}

  .thead,.urow{display:grid;grid-template-columns:28px minmax(220px,1fr) 150px 150px 210px 40px;gap:10px;align-items:center;padding:8px 14px}

  .pill{font-size:12px;padding:2px 8px;border-radius:99px;background:#F0F2F4;color:#8896A0;white-space:nowrap}

  .sheet label{display:block;font-size:13px;color:#4F5F68;margin:10px 0 4px}
  .sheet input[type=text],.sheet input[type=search],.sheet textarea{width:100%;padding:10px 12px;border:1px solid #C9D3D9;border-radius:10px;font:inherit}

  .sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .plist{max-height:50vh;overflow:auto;border:1px solid #E3E9ED;border-radius:10px;margin-top:10px}
  .plist .pg{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#66767F;background:#F4F7F9;padding:6px 10px;position:sticky;top:0}
  .plist .pi{padding:8px 10px;border-top:1px solid #EEF2F5;cursor:pointer;display:flex;gap:8px;align-items:baseline}

  .jr.off .jt{text-decoration:line-through}
  .toast{position:fixed;left:50%;transform:translateX(-50%);top:70px;background:#1F7A4D;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;display:none;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}

  .gate p{color:#4F5F68;line-height:1.5}
  .gate a{color:#2F6F9F}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#66767F;margin-top:8px}

  @media (max-width:860px){

    .urow>.tgc{grid-area:tg}.urow>.un{grid-area:un}.urow>.qb{grid-area:qb}.urow>.qv{grid-area:qv}.urow>.ok{grid-area:ok}.urow>.mn{grid-area:mn}
    .urow .q{text-align:left;display:flex;gap:8px;align-items:center}
    .urow .q::before{content:attr(data-l);font-size:12px;color:#66767F;min-width:90px}
    .urow .q .bar{margin:0;width:60px!important;max-width:60px}
    .tl{padding-left:14px}
    .trow{grid-template-columns:24px 1fr 40px;grid-template-areas:"ck tn mn" ". qb qb" ". qv qv" ". lc lc"}
    .trow>.ck{grid-area:ck}.trow>.tn{grid-area:tn}.trow>.qb{grid-area:qb}.trow>.qv{grid-area:qv}.trow>.locs{grid-area:lc}.trow>.mn{grid-area:mn}
    .trow .q{text-align:left;display:flex;gap:8px}
    .trow .q::before{content:attr(data-l);font-size:12px;color:#66767F;min-width:90px}
    .trow .q .bar{display:none}
    .tools{position:static}
    .gh{flex-wrap:wrap;row-gap:2px}
    .gh .gc{order:5;width:100%;padding-left:24px}
    .hdr .ttl{font-size:15px}
  }
</style>
</head>
<body>
<div class="hdr">
  <div class="ttl"><small>МЛП · номенклатура</small>Перевірка назв і груп запасів</div>
  <span class="sync" id="sync">…</span>
  <div class="who" id="who"></div>
</div>
<div class="main" id="app"><div class="gate"><p>Відкриваю…</p></div></div>
<div class="bulk" id="bulk"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="menu" id="menu"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ======================================================================= зв'язок із сервером (той самий, що й МЛП) */
const PAGE_VERSION = 'nomenklatura.html v1 · 12.11.2026';
const API = 'https://script.google.com/macros/s/AKfycbx-JUajnAtVsxaLHDgwRpfzE12g4LUtlf6JnWYAQScAVZ5FCpxzGHSrA5PDESqP80KD/exec';
const MLP_URL = location.origin + location.pathname.replace(/[^/]*$/, '');
const ROLE_ACC = 'бухгалтер', ROLE_WH = 'зав. складу', ROLE_ADMIN = 'адміністратор';
const CONFIRMERS = [[ROLE_ACC, 'Бухгалтерія'], [ROLE_WH, 'Склад']];
function store(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
const CODE = store('mlp_code');

function apiGet(api, q) {
  return fetch(API + '?api=' + api + '&q=' + encodeURIComponent(JSON.stringify(Object.assign({ code: CODE }, q))), { credentials: 'omit', redirect: 'follow' })
    .then(r => r.json(), () => { throw netErr(); }).then(j => { if (!j.ok) throw new Error(j.error); return j.data; });
}
function apiPost(api, q) {
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: api, q: Object.assign({ code: CODE }, q) }), credentials: 'omit', redirect: 'follow' })
    .then(r => r.json(), () => { throw netErr(); }).then(j => { if (!j.ok) throw new Error(j.error); return j.data; });
}
function netErr() { const e = new Error('Немає зв\'язку з сервером. Перевірте інтернет'); e.net = true; return e; }

/* ======================================================================= стан */
let SEED = null, ME = null, CAN = false;
let OPS = [];          // операції з сервера {n, at, who, em, role, op}
let PEND = [];         // ще не записані {op, act, txt}
let SENDING = false;
let ST = null;         // поточний стан після replay
const UI = { q: '', f: 'all', sort: 'scale', open: new Set(), closed: new Set(), sel: new Set() };
const $ = id => document.getElementById(id);
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = new Intl.NumberFormat('uk-UA', { maximumFractionDigits: 3 });
const lastN = () => OPS.length ? OPS[OPS.length - 1].n : 0;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/** Старт + операції журналу по черзі → поточний стан. Операцію, яку скасовано (undo), пропускаємо. */
function replay() {
  const G = new Map(), U = new Map(), T = new Map();
  SEED.g.forEach((g, i) => G.set(g.id, { id: g.id, n: g.n, o: i, seed: g.n }));
  SEED.u.forEach((u, i) => U.set(u.id, Object.assign({}, u, { o: i, seed: { n: u.n, g: u.g, e: u.e, k: u.k, c: u.c }, ok: {}, chg: 0, note: null })));
  SEED.t.forEach((t, i) => T.set(t.id, Object.assign({}, t, { o: i, u0: t.u, note: null })));
  const all = OPS.map(o => Object.assign({}, o, { pend: false })).concat(PEND.map((p, i) => ({ n: 1e9 + i, at: Date.now(), who: ME.name, em: ME.email, role: ME.role, op: p.op, pend: true })));
  const undone = new Set(all.filter(o => o.op.t === 'undo').map(o => Number(o.op.n)));
  const res = new Map();   // n → '' (застосовано) | причина, чому ні
  const touch = (id, n) => { const u = U.get(id); if (u) u.chg = Math.max(u.chg, n); };
  const live = (m, id) => { const x = m.get(id); return x && !x.del ? x : null; };
  let order = 1e6;
  all.forEach(o => {
    const op = o.op, n = o.n;
    if (op.t === 'undo') { res.set(n, ''); return; }
    if (undone.has(n)) { res.set(n, 'скасовано'); return; }
    let why = '';
    const u = live(U, op.id), g = live(G, op.id), t = T.get(op.id);
    switch (op.t) {
      case 'mv': { const to = live(U, op.to); if (!t || !to) { why = 'позиції вже немає'; break; } if (t.u === op.to) { why = 'вже там'; break; } touch(t.u, n); t.u = op.to; touch(op.to, n); break; }
      case 'mvu': { if (!u || !live(G, op.to)) { why = 'позиції вже немає'; break; } u.g = op.to; touch(u.id, n); break; }
      case 'ren': { const x = op.id[0] === 'g' ? g : u; if (!x) { why = 'позиції вже немає'; break; } x.n = op.n; if (op.id[0] === 'u') touch(u.id, n); break; }
      case 'addg': G.set(op.id, { id: op.id, n: op.n, o: order++, added: true }); break;
      case 'addu': { if (!live(G, op.g)) { why = 'групи вже немає'; break; } U.set(op.id, { id: op.id, g: op.g, n: op.n, c: op.c || '', e: op.e || 'шт', k: op.k || '', o: order++, added: true, ok: {}, chg: n, note: null }); break; }
      case 'set': { if (!u) { why = 'позиції вже немає'; break; } u[op.f] = op.v; touch(u.id, n); break; }
      case 'del': {
        if (op.id[0] === 'u') { if (!u) { why = 'вже видалено'; break; } if ([...T.values()].some(x => x.u === u.id)) { why = 'у позиції є технічні назви'; break; } u.del = true; }
        else { if (!g) { why = 'вже видалено'; break; } if ([...U.values()].some(x => !x.del && x.g === g.id)) { why = 'у групі є позиції'; break; } g.del = true; }
        break; }
      case 'merge': { const to = live(U, op.to); if (!u || !to || u.id === to.id) { why = 'позиції вже немає'; break; } T.forEach(x => { if (x.u === u.id) x.u = to.id; }); u.del = true; u.mergedTo = to.id; touch(to.id, n); break; }
      case 'ok': { if (!u) { why = 'позиції вже немає'; break; } u.ok[o.role] = { n: n, who: o.who, at: o.at }; break; }
      case 'unok': { if (!u) { why = 'позиції вже немає'; break; } delete u.ok[o.role]; break; }
      case 'note': { const x = op.id[0] === 't' ? t : u; if (!x) { why = 'позиції вже немає'; break; } x.note = op.v ? { v: op.v, who: o.who, at: o.at } : null; break; }
      default: why = 'невідома зміна';
    }
    res.set(n, why);
  });
  // суми рівня 2 — лише рядки в тій самій одиниці
  U.forEach(u => { u.ts = []; u.b = null; u.v = null; u.lq = SEED.locs.map(() => 0); u.hasV = false; });
  T.forEach(t => {
    const u = U.get(t.u); if (!u || u.del) return;
    u.ts.push(t);
    if (t.e !== u.e) return;
    if (t.b !== undefined) u.b = (u.b || 0) + t.b;
    if (t.q) { u.hasV = true; t.q.forEach((x, i) => u.lq[i] += x); u.v = (u.v || 0) + t.q.reduce((a, b) => a + b, 0); }
  });
  ST = { G, U, T, res, undone, all };
}
function vulyk(t) { return t.q ? t.q.reduce((a, b) => a + b, 0) : null; }
function scale(u) { return Math.max(Math.abs(u.b || 0), Math.abs(u.v || 0)); }
/** Підтвердження дійсне, якщо після нього позицію не змінювали */
function okState(u, role) { const k = u.ok[role]; if (!k) return null; return k.n > u.chg ? 'y' : 's'; }
function changed(u) {
  if (u.added) return true;
  const s = u.seed; if (u.n !== s.n || u.g !== s.g || u.e !== s.e || u.k !== s.k || u.c !== s.c) return true;
  return u.ts.some(t => t.u !== t.u0) || [...ST.T.values()].some(t => t.u0 === u.id && t.u !== u.id);
}

/* ======================================================================= відкриття */
function boot() {
  if (!CODE) return gate('Цей браузер ще не зареєстровано в МЛП.', 'Відкрийте <a href="' + esc(MLP_URL) + '">сторінку МЛП</a> у цьому самому браузері, зареєструйтесь (як на телефоні) і поверніться за цим посиланням.');
  setSync('Відкриваю…');
  apiGet('nomen', {}).then(d => {
    SEED = d.seed; ME = d.me; CAN = !!d.canEdit; OPS = d.ops || [];
    $('who').innerHTML = esc(ME.name) + '<br>' + esc(ME.role) + (CAN ? '' : ' · лише перегляд');
    replay(); render(); setSync('Збережено');
    setInterval(poll, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
  }, e => gate(e.net ? 'Немає зв\'язку з сервером.' : 'Не вдалося відкрити.', esc(e.message) + (e.net ? '<br><br><a href="" onclick="location.reload();return false">Спробувати ще раз</a>' : '')));
}

  ask('Уніфікована назва', 'Одна назва для однієї речі: як буде в Odoo, у журналі складу й на наліпках. Без постачальника й без складу.', u.n, v => {
    if (v === u.n) return;
    const d = dupName(v, id); if (d) return toast('Така назва вже є в групі «' + gn(d) + '». Щоб звести разом — ⋯ → «Обʼєднати з іншою позицією»', true);
    commit([{ op: { t: 'ren', id: id, n: v }, act: 'Перейменовано позицію', txt: '«' + u.n + '» → «' + v + '»' }]);
  });
}
function setU(id, f, title, sub) {
  const u = ST.U.get(id);
  ask(title + ' — «' + u.n + '»', sub, u[f], v => { if (v === u[f]) return; commit([{ op: { t: 'set', id: id, f: f, v: v }, act: 'Змінено: ' + title.toLowerCase(), txt: '«' + u.n + '»: ' + (u[f] || '—') + ' → ' + (v || '—') }]); }, f === 'k' || f === 'c');
}
function noteX(id) {
  const x = ST.U.get(id) || ST.T.get(id);
  ask('Коментар', '«' + esc(x.n) + '». Що не так: інша назва, інша група, правильна кількість… Порожньо — прибрати коментар.', x.note ? x.note.v : '', v => {
    if ((x.note ? x.note.v : '') === v) return;
    commit([{ op: { t: 'note', id: id, v: v }, act: v ? 'Коментар' : 'Прибрано коментар', txt: '«' + x.n + '»' + (v ? ': ' + v : '') }]);
  }, true);
}
function delU(id) {
  const u = ST.U.get(id);
  confirmBox('Видалити позицію «' + u.n + '»?', 'Технічних назв у ній немає. Видалення буде в журналі — його можна скасувати.', 'Видалити', () =>
    commit([{ op: { t: 'del', id: id }, act: 'Видалено позицію', txt: '«' + u.n + '» (' + gn(u) + ')' }]));
}
function delG(id) {
  confirmBox('Видалити групу «' + nm(id) + '»?', 'Група порожня. Видалення буде в журналі — його можна скасувати.', 'Видалити', () =>
    commit([{ op: { t: 'del', id: id }, act: 'Видалено групу', txt: '«' + nm(id) + '»' }]));
}
function confirmBox(h, sub, btn, go) {
  openModal('<h3>' + esc(h) + '</h3><div class="sub">' + esc(sub) + '</div><div class="acts"><button class="btn" onclick="closeModal()">Скасувати</button><button class="btn pri" id="mok">' + esc(btn) + '</button></div>');
  $('mok').onclick = () => { closeModal(); go(); };
}
function addGroup() {
  ask('Нова група (рівень 3)', 'Група — що це за річ, не модель і не склад. Спершу перевірте, чи не підходить наявна.', '', v => {
    if ([...ST.G.values()].some(g => !g.del && g.n.toLowerCase() === v.toLowerCase())) return toast('Така група вже є', true);
    commit([{ op: { t: 'addg', id: uid('g'), n: v }, act: 'Додано групу', txt: '«' + v + '»' }]);
  });
}
function renGroup(id) {
  ask('Назва групи (рівень 3)', '', nm(id), v => { if (v === nm(id)) return; commit([{ op: { t: 'ren', id: id, n: v }, act: 'Перейменовано групу', txt: '«' + nm(id) + '» → «' + v + '»' }]); });
}
/** Нова уніфікована назва в групі; after — що зробити з її id одразу (перенести технічні назви) */
function addU(gid, after, preset) {
  openModal('<h3>Нова уніфікована назва</h3><div class="sub">Група «' + esc(nm(gid)) + '». Одна назва для однієї речі — без постачальника й складу.</div>' +
    '<label>Назва</label><input type="text" id="an" value="' + esc(preset || '') + '"><label>Одиниця</label><input type="text" id="ae" value="шт"><label>Вид (ознака), якщо потрібно</label><input type="text" id="ak" placeholder="магніти, кріплення, провід…">' +
    '<div class="acts"><button class="btn" onclick="closeModal()">Скасувати</button><button class="btn pri" id="mok">Додати</button></div>');
  $('mok').onclick = () => {
    const n = $('an').value.trim(), e = $('ae').value.trim() || 'шт', k = $('ak').value.trim();
    if (!n) return $('an').focus();
    const d = dupName(n); if (d) return toast('Така назва вже є в групі «' + gn(d) + '» — виберіть її', true);
    closeModal();
    const id = uid('u');
    const list = [{ op: { t: 'addu', id: id, g: gid, n: n, e: e, k: k }, act: 'Додано позицію', txt: '«' + n + '» у групу «' + nm(gid) + '»' }];
    UI.open.add(id); UI.closed.delete(gid);
    commit(after ? list.concat(after(id, n)) : list);
  };
}
function moveU(id) {
  const u = ST.U.get(id);
  const gs = [...ST.G.values()].filter(g => !g.del).sort((a, b) => a.o - b.o);
  openModal('<h3>Перенести в іншу групу</h3><div class="sub">«' + esc(u.n) + '» зараз у групі «' + esc(gn(u)) + '».</div><div class="plist">' +
    gs.map(g => '<div class="pi' + (g.id === u.g ? ' cur' : '') + '" data-g="' + g.id + '">' + esc(g.n) + (g.id === u.g ? '<small>зараз тут</small>' : '') + '</div>').join('') + '</div>' +
    '<div class="acts"><button class="btn" onclick="closeModal()">Скасувати</button></div>');
  $('sheet').querySelectorAll('.pi:not(.cur)').forEach(el => el.onclick = () => { closeModal(); commit([{ op: { t: 'mvu', id: id, to: el.dataset.g }, act: 'Позицію перенесено в іншу групу', txt: '«' + u.n + '»: «' + gn(u) + '» → «' + nm(el.dataset.g) + '»' }]); });
}
function mergeU(id) {
  const u = ST.U.get(id);
  picker('Обʼєднати «' + u.n + '» з…', 'Усі технічні назви цієї позиції перейдуть до вибраної, а сама позиція зникне. Для двох назв однієї речі.', [id], to =>
    confirmBox('Обʼєднати?', '«' + u.n + '» → «' + nm(to) + '». Технічних назв: ' + u.ts.length + '.', 'Обʼєднати', () =>
      commit([{ op: { t: 'merge', id: id, to: to }, act: 'Обʼєднано позиції', txt: '«' + u.n + '» (' + gn(u) + ') → «' + nm(to) + '» (' + gn(ST.U.get(to)) + ')' }])), false);
}
/** Перенесення технічних назв (рівень 1) до іншої уніфікованої (рівень 2) — у будь-якій групі */
function pickTarget(tids) {
  const ts = tids.map(id => ST.T.get(id));
  const cur = [...new Set(ts.map(t => t.u))];
  const what = ts.length === 1 ? '«' + ts[0].n + '»' : ts.length + ' технічних назв';
  picker('Куди перенести ' + what + '?', 'Виберіть уніфіковану назву, до якої це належить, — у будь-якій групі. Немає потрібної — створіть нову внизу.', cur, to => {
    UI.sel.clear(); UI.open.add(to);
    commit(mvOps(ts, to, nm(to)));
  }, true, ts);
}
function mvOps(ts, to, toName) {
  return ts.filter(t => t.u !== to).map(t => ({ op: { t: 'mv', id: t.id, to: to }, act: 'Перенесено технічну назву', txt: '«' + t.n + '» (' + t.s + '): «' + nm(t.u) + '» → «' + toName + '»' }));
}
function picker(title, sub, exclude, onPick, allowNew, ts) {
  const gs = [...ST.G.values()].filter(g => !g.del).sort((a, b) => a.o - b.o);
  openModal('<h3>' + esc(title) + '</h3><div class="sub">' + esc(sub) + '</div><input type="search" id="pq" placeholder="Пошук назви або коду"><div class="plist" id="pl"></div>' +
    (allowNew ? '<label>Або нова уніфікована назва в групі</label><div style="display:flex;gap:8px"><select id="pg" style="flex:1">' + gs.map(g => '<option value="' + g.id + '">' + esc(g.n) + '</option>').join('') + '</select><button class="btn" id="pn">+ Створити й перенести</button></div>' : '') +
    '<div class="acts"><button class="btn" onclick="closeModal()">Скасувати</button></div>');
  const draw = () => {
    const q = $('pq').value.trim().toLowerCase().split(/\s+/).filter(x => x);
    let h = '';
    gs.forEach(g => {
      const us = [...ST.U.values()].filter(u => !u.del && u.g === g.id && q.every(w => (u.n + ' ' + u.c + ' ' + u.k + ' ' + g.n).toLowerCase().indexOf(w) >= 0)).sort((a, b) => a.n.localeCompare(b.n, 'uk'));
      if (!us.length) return;
      h += '<div class="pg">' + esc(g.n) + '</div>' + us.map(u => '<div class="pi' + (exclude.indexOf(u.id) >= 0 ? ' cur' : '') + '" data-u="' + u.id + '">' + esc(u.n) + '<small>' + (exclude.indexOf(u.id) >= 0 ? 'зараз тут' : esc(u.c || u.e)) + '</small></div>').join('');
    });
    $('pl').innerHTML = h || '<div class="empty">Нічого не знайдено</div>';
    $('pl').querySelectorAll('.pi:not(.cur)').forEach(el => el.onclick = () => { closeModal(); onPick(el.dataset.u); });
  };
  $('pq').oninput = draw; draw();
  if (allowNew) {
    const g0 = ts && ts[0] ? (ST.U.get(ts[0].u) || {}).g : null; if (g0) $('pg').value = g0;
    $('pn').onclick = () => { const gid = $('pg').value; closeModal(); addU(gid, (nid, nname) => { UI.sel.clear(); return mvOps(ts, nid, nname); }, $('pq').value.trim()); };
  }
}
function sel(id, on) { on ? UI.sel.add(id) : UI.sel.delete(id); drawBulk(); }
function drawBulk() {
  const b = $('bulk'); const n = UI.sel.size;
  b.className = 'bulk' + (n ? ' on' : '');
  b.innerHTML = n ? 'Позначено технічних назв: <b>' + n + '</b><button class="btn pri" onclick="pickTarget([...UI.sel])">→ Перенести</button><button class="btn" onclick="UI.sel.clear();render()">Зняти позначки</button>' : '';
}

/* ======================================================================= журнал */
function journal() {
  const all = OPS.slice().reverse();
  const isUndone = n => ST.undone.has(n);
  let h = '<h3>Журнал змін</h3><div class="sub">Кожна зміна — хто, коли, що. Свою зміну можна скасувати (скасування теж записується). Копія журналу — аркуш «Номенклатура_Журнал» у MLP_Дані.</div>';
  if (!all.length) h += '<div class="empty">Змін ще немає.</div>';
  h += '<div style="max-height:60vh;overflow:auto">' + all.map(o => {
    const why = ST.res.get(o.n) || '';
    const mine = o.em === ME.email || ME.role === ROLE_ADMIN;
    const canUndo = CAN && mine && o.op.t !== 'undo' && !isUndone(o.n);
    return '<div class="jr' + (why ? ' off' : '') + '"><span class="jn">№' + o.n + '</span><div><div class="jt">' + esc(jText(o)) + '</div><div class="jw">' + esc(o.who) + ' · ' + esc(o.role) + ' · ' + dt(o.at) + (why ? ' · <b>' + esc(why) + '</b>' : '') + '</div></div>' +
      (canUndo ? '<button class="btn sm" onclick="undo(' + o.n + ')">Скасувати</button>' : '<span></span>') + '</div>';
  }).join('') + '</div><div class="acts"><button class="btn" onclick="exportLog()">⬇ Журнал (Excel)</button><button class="btn pri" onclick="closeModal()">Закрити</button></div>';
  openModal(h);
}
/** Текст запису: як зберіг сервер, а якщо немає — зі стану */
function jText(o) {
  const op = o.op;
  if (op.t === 'undo') return 'Скасовано зміну №' + op.n;
  const m = { mv: 'Перенесено технічну назву', mvu: 'Позицію перенесено в іншу групу', ren: 'Перейменовано', addg: 'Додано групу', addu: 'Додано позицію', set: 'Змінено поле', del: 'Видалено', merge: 'Обʼєднано', ok: 'Підтверджено', unok: 'Знято підтвердження', note: 'Коментар' }[op.t] || op.t;
  const x = op.id ? nm(op.id) : '';
  return m + (op.t === 'addg' || op.t === 'addu' ? ' «' + op.n + '»' : x !== '?' ? ' «' + x + '»' : '') + (op.t === 'ren' ? ' → «' + op.n + '»' : '') + (op.to ? ' → «' + nm(op.to) + '»' : '') + (op.t === 'set' ? ': ' + ({ e: 'одиниця', k: 'вид', c: 'код' }[op.f]) + ' = ' + (op.v || '—') : '') + (op.t === 'note' && op.v ? ': ' + op.v : '');
}
function undo(n) {
  confirmBox('Скасувати зміну №' + n + '?', jText(OPS.find(o => o.n === n)), 'Скасувати зміну', () => { closeModal(); commit([{ op: { t: 'undo', n: n }, act: 'Скасовано зміну', txt: '№' + n }]); setTimeout(journal, 50); });
}

/* ======================================================================= вивантаження (CSV для Excel) */
function csv(rows) { return '﻿' + rows.map(r => r.map(v => { v = v === null || v === undefined ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';')).join('\r\n'); }
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
const stamp = () => new Date().toISOString().slice(0, 16).replace(/[-:]/g, '').replace('T', '_');
function exportCsv() {
  const rows = [['Група (рівень 3)', 'Уніфікована назва (рівень 2)', 'Код', 'Од.', 'Вид', 'Технічна назва (рівень 1)', 'Джерело', 'Од. рядка', 'Бухгалтерія', 'Вулик разом'].concat(SEED.locs.map(l => l[0])).concat(['Підтв. бухгалтерія', 'Підтв. склад', 'Змінено', 'Коментар', 'Було: уніфікована', 'Було: група'])];
  const Gs = [...ST.G.values()].filter(g => !g.del).sort((a, b) => a.o - b.o);
  Gs.forEach(g => [...ST.U.values()].filter(u => !u.del && u.g === g.id).sort((a, b) => a.o - b.o).forEach(u => {
    const okc = r => { const s = okState(u, r); return s === 'y' ? 'так · ' + u.ok[r].who : s === 's' ? 'змінено після підтвердження' : ''; };
    const base = [g.n, u.n, u.c, u.e, u.k];
    rows.push(base.concat(['', 'разом', u.e, u.b, u.hasV ? u.v : '']).concat(u.lq.map(x => x || '')).concat([okc(ROLE_ACC), okc(ROLE_WH), changed(u) ? 'так' : '', u.note ? u.note.v : '', u.added ? 'нова' : u.seed.n !== u.n ? u.seed.n : '', u.added ? '' : u.seed.g !== u.g ? nm(u.seed.g) : '']));
    u.ts.forEach(t => rows.push(base.concat([t.n, t.s, t.e, t.b, vulyk(t)]).concat(t.q ? t.q.map(x => x || '') : SEED.locs.map(() => '')).concat(['', '', t.u !== t.u0 ? 'перенесено' : '', t.note ? t.note.v : '', t.u !== t.u0 ? nm(t.u0) : '', ''])));
  }));
  download('ENEY_ODOO_Nomenklatura-perevirka_rezultat_' + stamp() + '.csv', csv(rows));
}
function exportLog() {
  const rows = [['№', 'Час', 'Хто', 'Роль', 'Зміна', 'Стан']].concat(OPS.map(o => [o.n, dt(o.at), o.who, o.role, jText(o), ST.res.get(o.n) || 'застосовано']));
  download('ENEY_ODOO_Nomenklatura-perevirka_zhurnal_' + stamp() + '.csv', csv(rows));
}

window.addEventListener('beforeunload', e => { if (PEND.length || SENDING) { e.preventDefault(); e.returnValue = ''; } });
boot();
</script>
