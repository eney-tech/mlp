<!DOCTYPE html>
<!-- МЛП · index.html v10 · 13.10.2026 — кнопка «Видача зі складу» лише тімлідам і вище (perms.sklad). v9: екран «Видача зі складу» (?s=КОД локації): фото етикетки з розпізнаванням, калькулятор кількості, «Мої видачі». v8: змішане походження -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>МЛП</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#EEF2F5;color:#1D2B33;font-size:16px;-webkit-text-size-adjust:100%}
  .hdr{background:#2F4858;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .hdr .who{font-size:13px;opacity:.85;text-align:right}
  .card{background:#fff;margin:12px;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .big{font-size:34px;font-weight:700;letter-spacing:.5px;line-height:1.1}
  .mid{font-size:18px;font-weight:600}
  .muted{color:#66767F;font-size:14px}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:#E7EDF1;margin:6px 6px 0 0}
  .ok{background:#DFF3E7;color:#17643D}.warn{background:#FFF1D6;color:#8A5A00}.bad{background:#FDE3E1;color:#9B231A}
  label{display:block;font-size:14px;color:#55656E;margin:14px 0 6px}
  select,input[type=text],input[type=number],textarea{width:100%;font-size:19px;padding:12px;border:1px solid #C5D0D7;border-radius:10px;background:#fff;color:#1D2B33;font-family:inherit}
  textarea{font-size:16px;min-height:60px}
  .num{display:flex;gap:8px}.num input{flex:1;text-align:center;font-size:26px;font-weight:600}
  .num button{width:58px;font-size:28px;border:1px solid #C5D0D7;background:#F4F7F9;border-radius:10px;color:#1D2B33}
  .btn{display:block;width:100%;padding:17px;font-size:20px;border:0;border-radius:12px;background:#1F7A4D;color:#fff;font-weight:700;margin-top:18px;font-family:inherit}
  .btn:disabled{opacity:.5}
  .btn2{background:#E3EAEF;color:#1D2B33;font-weight:600;font-size:17px;padding:14px;margin-top:10px}
  .btnr{background:#B3261E}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .btn{margin-top:0}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .seg{display:flex;gap:6px}.seg label{flex:1;margin:0}.seg input{display:none}
  .seg span{display:block;text-align:center;padding:13px 4px;border:1px solid #C5D0D7;border-radius:10px;font-size:17px;font-weight:600;background:#fff}
  .seg input:checked+span{background:#2F4858;color:#fff;border-color:#2F4858}
  details{margin:12px;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  summary{padding:16px;font-weight:600;font-size:17px;cursor:pointer}
  .list{padding:0 16px 12px}
  .li{padding:10px 0;border-top:1px solid #EEF2F5;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .li .r{text-align:right;white-space:nowrap}
  .x{text-decoration:line-through;opacity:.5}
  .lnk{color:#1A5FB4;text-decoration:none;font-weight:600}
  .ic{border:0;background:#E3EAEF;border-radius:8px;padding:6px 10px;font-size:15px;margin-left:4px}
  .toast{position:fixed;left:12px;right:12px;bottom:16px;padding:16px;border-radius:12px;color:#fff;font-size:17px;font-weight:600;display:none;z-index:9;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .modal{position:fixed;inset:0;background:rgba(20,30,36,.55);display:none;align-items:flex-end;z-index:8}
  .sheet{background:#EEF2F5;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding-bottom:20px}
  .err{color:#9B231A;font-weight:600;margin-top:10px;font-size:16px}
  .center{text-align:center;padding:40px 16px}
  .stepbar{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
  .stepbar span{font-size:12px;padding:3px 6px;border-radius:6px;background:#E7EDF1}
  .stepbar .d{background:#DFF3E7;color:#17643D}.stepbar .n{background:#2F4858;color:#fff}.stepbar .w{background:#FFF1D6;color:#8A5A00}
  .now{margin-top:12px;border-top:1px solid #EEF2F5;padding-top:10px}
  .now .li{border-top:0;padding:4px 0}
  .tail{background:#FFF1D6;color:#5C3D00;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
  .opt{display:block;border:1px solid #C5D0D7;border-radius:10px;padding:10px 12px;margin:6px 0;font-size:16px;background:#fff}
  .opt input{margin-right:8px;transform:scale(1.3)}
  .seg.wrap{flex-wrap:wrap}.seg.wrap label{flex:1 1 30%}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .kpi .v{font-size:26px;font-weight:700;line-height:1.15}.kpi .v small{font-size:14px;font-weight:500;color:#66767F;margin-left:3px}
  .kpi .l{font-size:12px;color:#66767F;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .hb{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
  .hb .bar{height:14px;border-radius:0 4px 4px 0;background:#2F4858;min-width:2px}
  .hb .click{cursor:pointer}.hb .on{font-weight:700;color:#1A5FB4}.hb .dim{opacity:.35}
  .hb .bx{border-left:1px solid #C5D0D7;height:16px;display:flex;align-items:center}
  table.t{border-collapse:collapse;width:100%;font-size:14px}
  .t th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#66767F;text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid #C5D0D7;white-space:nowrap}
  .t td{padding:7px 8px 7px 0;border-bottom:1px solid #EEF2F5;vertical-align:top}
  .t .r{text-align:right}.tw{overflow-x:auto}
  .tabs{display:flex;gap:6px;margin:12px 12px 0;overflow-x:auto}
  .tabs a{flex:none;padding:9px 14px;border-radius:99px;background:#fff;color:#1D2B33;text-decoration:none;font-weight:600;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .tabs a.on{background:#2F4858;color:#fff}
  .fl{display:flex;flex-wrap:wrap;gap:8px;margin:12px}
  .fl select{width:auto;font-size:15px;padding:8px 10px}
  .chips{display:flex;gap:4px;flex-wrap:wrap}.chips button{border:1px solid #C5D0D7;background:#fff;border-radius:99px;padding:7px 12px;font-size:14px;font-family:inherit;color:#1D2B33}
  .chips button.on{background:#2F4858;color:#fff;border-color:#2F4858}
  .sp{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;min-width:90px}
  .cols{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid #C5D0D7;margin-top:8px}
  .cols div{flex:1;background:#2F4858;border-radius:4px 4px 0 0;min-height:1px;position:relative}
  .cols span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;color:#55656E}
  .xl{display:flex;gap:4px}.xl span{flex:1;text-align:center;font-size:11px;color:#66767F}
</style>
</head>
<body>
<div class="hdr"><div><a href="./" style="color:#fff;text-decoration:none"><b>МЛП</b></a> <span id="hdrTitle" class="muted" style="color:#cfe0ea"></span></div><div class="who" id="who"></div></div>
<div id="app"><div class="center muted">Завантаження…</div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const PAGE_VERSION = 'index.html v10 · 13.10.2026';
const API = 'https://script.google.com/macros/s/AKfycbx-JUajnAtVsxaLHDgwRpfzE12g4LUtlf6JnWYAQScAVZ5FCpxzGHSrA5PDESqP80KD/exec';
window.STATIC_SELF = location.origin + location.pathname;
const PARAMS = Object.fromEntries(new URLSearchParams(location.search));
var google = { script: { get run() {
  let ok = () => {}, fail = () => {};
  const call = (api, q) => fetch(API + '?api=' + api + '&q=' + encodeURIComponent(JSON.stringify(q)), { credentials: 'omit', redirect: 'follow' })
    .then(r => r.json()).then(j => j.ok ? ok(j.data) : fail({ message: j.error }))
    .catch(e => fail({ message: 'Немає зв\'язку з сервером. Перевірте інтернет і спробуйте ще раз.' }));
  const o = { withSuccessHandler(f) { ok = f; return o; }, withFailureHandler(f) { fail = f; return o; },
    apiPage(q) { call('page', q); }, apiAct(q) { call('act', q); }, apiApprove(q) { call('approve', q); }, apiCabinet(q) { call('cabinet', q); }, apiDash(q) { call('dash', q); }, apiHistory(q) { call('hist', q); },
    apiSkladPage(q) { call('skladPage', q); }, apiSkladCancel(q) { call('skladCancel', q); } };
  return o;
} } };
/** v9: POST — для великих запитів (фото). text/plain, щоб не було попереднього запиту CORS. */
function post(api, q) {
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: api, q: q }), credentials: 'omit', redirect: 'follow' })
    .then(r => r.json(), () => { throw new Error('Немає зв\'язку з сервером. Перевірте інтернет і спробуйте ще раз.'); })
    .then(j => { if (!j.ok) throw new Error(j.error); return j.data; });
}
let S = {};           // дані сторінки
let CODE = store('mlp_code');

function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k) || ''; if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }
  catch (e) { return ''; }
}
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function $(id) { return document.getElementById(id); }
function toast(msg, bad) { const t = $('toast'); t.textContent = msg; t.style.background = bad ? '#B3261E' : '#1F7A4D'; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', bad ? 6000 : 3500); }
function closeModal() { $('modal').style.display = 'none'; }
function openModal(html) { $('sheet').innerHTML = html; $('modal').style.display = 'flex'; }
function link(q) { return (window.STATIC_SELF || S.webapp || '') + '?' + q; }

function load(extra) {
  if (PARAMS.approve) return loadApprove();
  if (PARAMS.cab && CODE) return loadCabinet();   // без коду телефону — звичайний шлях: екран реєстрації
  if (PARAMS.d && CODE) return loadDash();
  if (PARAMS.h && CODE) return loadHistory();
  if ((PARAMS.s || PARAMS.sklad) && CODE) return loadSklad();
  loadPage(extra);
}
function loadPage(extra) {
  google.script.run.withSuccessHandler(d => { S = d; render(extra || {}); })
    .withFailureHandler(e => { $('app').innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; })
    .apiPage(Object.assign({}, PARAMS, { code: CODE }));
}

/** Яку сторінку показати після дії: сервер повертає її в тій самій відповіді (v3 — без другого звернення) */
function viewParams() { const v = {}; ['t', 'b'].forEach(k => { if (PARAMS[k]) v[k] = PARAMS[k]; }); return v; }
/** Для адміністратора: сервер усього (старт · черга · читання · запис · сторінка) / разом із мережею */
function timing(r, total) {
  const p = r.parts || {}; const d = (a, b) => sec(Math.max(0, (p[a] || 0) - (b ? p[b] || 0 : 0)));
  return 'сервер ' + sec(r.ms) + (p.page !== undefined ? ' (старт ' + d('who') + ' · черга ' + d('lock', 'who') + ' · читання ' + d('read', 'lock') +
    ' · запис ' + d('write', 'read') + ' · сторінка ' + d('page', 'write') + ')' : '') + ' / разом ' + sec(total);
}
function sec(ms) { return (ms / 1000).toFixed(1).replace('.', ',') + ' с'; }
function showPage(r, extra) { if (r && r.page) { S = r.page; render(extra || {}); } else load(extra); }
function setUrl() { try { const q = new URLSearchParams(PARAMS).toString(); history.replaceState(null, '', location.pathname + (q ? '?' + q : '')); } catch (e) { } }

/** v7: дія без своєї кнопки (після «Так» у підтвердженні: ↩ назад, ✖ свій запис) — плашка «Зберігаю…» внизу,
 *  поки сервер не відповів; повторне натискання в цей час нічого не робить */
let BUSY = false;
function busy(on) {
  BUSY = on; const t = $('toast');
  if (on) { clearTimeout(t._h); t.textContent = 'Зберігаю…'; t.style.background = '#2F4858'; t.style.display = 'block'; }
  else if (t.textContent === 'Зберігаю…') t.style.display = 'none';
}
function act(payload, btn, after) {
  const t0 = Date.now();
  if (!btn && BUSY) return;
  if (btn) { btn.disabled = true; btn._t = btn.textContent; btn.textContent = 'Зберігаю…'; } else busy(true);
  payload.code = CODE;
  if (payload.view === undefined) payload.view = viewParams();
  google.script.run.withSuccessHandler(r => {
    if (btn) { btn.disabled = false; btn.textContent = btn._t; } else busy(false);
    if (r && r.warn) { confirmBox(r.warn, () => { payload.force = true; act(payload, btn, after); }); return; }
    closeModal();
    let msg = r.msg || 'Готово';
    // адміністратору — час запису: сервер / разом із мережею (перевірка швидкості під час тестів)
    if (S.me && S.me.role === 'адміністратор' && r.ms !== undefined) msg += ' · ' + timing(r, Date.now() - t0);
    toast(msg);
    if (after) after(r); else showPage(r, {});
  }).withFailureHandler(e => {
    if (btn) { btn.disabled = false; btn.textContent = btn._t; } else busy(false);
    const m = String(e.message || e).replace(/^Error:\s*/, '');
    const box = $('err'); if (box && $('modal').style.display !== 'flex') box.textContent = m;
    const mb = $('merr'); if (mb && $('modal').style.display === 'flex') mb.textContent = m;
    toast(m, true);
  }).apiAct(payload);
}

function confirmBox(text, yes) {
  openModal('<div class="card"><div class="mid">' + esc(text) + '</div><div class="grid" style="margin-top:16px">' +
    '<button class="btn btn2" onclick="closeModal()">Ні</button><button class="btn" id="yesb">Так</button></div></div>');
  $('yesb').onclick = () => { closeModal(); yes(); };
}

function numInput(id, val) {
  return '<div class="num"><button type="button" onclick="bump(\'' + id + '\',-1)">−</button>' +
    '<input type="number" inputmode="numeric" pattern="[0-9]*" id="' + id + '" value="' + esc(val) + '">' +
    '<button type="button" onclick="bump(\'' + id + '\',1)">+</button></div>';
}
function bump(id, d) { const i = $(id); i.value = Math.max(0, (Number(i.value) || 0) + d); i.dispatchEvent(new Event('input')); }
function opts(list, sel, ph) { return (ph ? '<option value="">' + esc(ph) + '</option>' : '') + list.map(x => '<option' + (String(x) === String(sel) ? ' selected' : '') + '>' + esc(x) + '</option>').join(''); }
function tarePicker(id, types) {
  return '<div class="row"><select id="' + id + 't" style="flex:0 0 38%">' + opts(types) + '</select>' +
    '<input type="number" inputmode="numeric" id="' + id + 'n" placeholder="номер"></div>';
}
function tareVal(id) { const n = $(id + 'n').value; return n ? $(id + 't').value + '-' + n : ''; }

// =============================================================== RENDER
function render(extra) {
  const me = S.me;
  $('who').innerHTML = me ? whoHtml(me, S.perms, me.unknown) : '';
  if (S.error) { $('app').innerHTML = '<div class="card err">' + esc(S.error) + '</div>'; return; }
  if (!me) return renderReg();
  if (S.pending) {
    $('app').innerHTML = '<div class="card"><div class="mid">Телефон зареєстровано</div>' +
      '<p class="muted">Акаунт <b>' + esc(me.email) + '</b> чекає підтвердження тімлідом. Після підтвердження натисніть кнопку нижче.</p>' +
      '<button class="btn btn2" onclick="load()">Перевірити ще раз</button></div>';
    return;
  }
  if (S.poster) return renderPoster();
  if (S.tare && !S.batch) { $('hdrTitle').textContent = S.tare.code; return renderNew(); }
  if (S.batch) { $('hdrTitle').textContent = S.tare ? S.tare.code : ''; return renderBatch(extra); }
  renderHome();
}
/** Шапка: ім'я, роль і переходи (кабінет і звіти — тімлідам; «Мій виробіток» — усім) */
function whoHtml(me, perms, unknown) {
  const a = (q, t) => '<a class="lnk" style="color:#cfe0ea" href="' + esc(link(q)) + '">' + t + '</a>';
  const l = [];
  if (!unknown && perms) {
    if (perms.cabinet) l.push(a('cab=1', 'Кабінет ›'));
    if (perms.dashStan) l.push(a('d=stan', 'Звіти ›')); else if (perms.dashMy) l.push(a('d=my', 'Мій виробіток ›'));
  }
  return esc(me.name) + '<br>' + esc(me.role) + (unknown ? ' · ⚠ на перевірці' : '') + (l.length ? '<br>' + l.join(' · ') : '');
}
/** Головна (адреса без коду): відкрити тару вручну, якщо QR не читається; переходи за роллю */
function renderHome() {
  $('hdrTitle').textContent = '';
  const p = S.perms || {};
  const b = (q, t) => '<a class="btn btn2" style="display:block;text-align:center;text-decoration:none" href="' + esc(link(q)) + '">' + t + '</a>';
  $('app').innerHTML = '<div class="card center" style="padding:24px 16px">Відскануйте QR на тарі або на плакаті дільниці.</div>' +
    '<div class="card"><div class="mid">Відкрити тару за кодом</div><div class="muted">якщо QR не читається</div><div style="height:10px"></div>' +
    tarePicker('ht', ['КР', 'ПД', 'ТЧ', 'СК']) + '<button class="btn btn2" id="hgo">Відкрити</button></div>' +
    '<div class="card">' + (p.dashMy ? b('d=my', 'Мій виробіток') : '') + (p.dashStan ? b('d=stan', 'Стан зараз') : '') +
    (p.dashTare ? b('d=tare', 'Тара') : '') + (p.cabinet ? b('cab=1', 'Кабінет') : '') + (p.sklad ? b('sklad=1', 'Видача зі складу') : '') + '</div>' +
    '<p class="muted" style="text-align:center">' + esc(PAGE_VERSION) + '</p>';
  $('hgo').onclick = () => { const v = tareVal('ht'); if (v) location.href = link('t=' + encodeURIComponent(v)); };
}

function renderReg() {
  let pend = store('mlp_pending');
  if (!pend) { pend = Math.random().toString(36).slice(2, 7).toUpperCase() + Date.now().toString(36).slice(-4).toUpperCase(); store('mlp_pending', pend); }
  const url = (S.reg || '').replace('CODE_PLACEHOLDER', encodeURIComponent(pend));
  $('app').innerHTML = '<div class="card"><div class="mid">Цей телефон ще не зареєстровано</div>' +
    '<p class="muted">Один раз: відкрийте форму, увійдіть у свій Google-акаунт (той, з якого заповнюєте вечірній звіт), впишіть прізвище й ім\'я і надішліть. Потім поверніться сюди.</p>' +
    '<p class="muted">Код телефону: <b>' + esc(pend) + '</b></p>' +
    '<a class="btn" style="text-align:center;text-decoration:none" target="_blank" href="' + esc(url) + '">1. Відкрити форму реєстрації</a>' +
    '<button class="btn btn2" id="chk">2. Я зареєструвався</button><div class="err" id="err"></div></div>';
  $('chk').onclick = () => {
    $('chk').disabled = true;
    google.script.run.withSuccessHandler(d => {
      $('chk').disabled = false;
      if (d.me) { store('mlp_code', pend); store('mlp_pending', null); CODE = pend; S = d; toast('Телефон зареєстровано: ' + d.me.name);
        if (PARAMS.cab && !d.pending && d.perms && d.perms.cabinet) loadCabinet(); else render({}); }
      else $('err').textContent = 'Реєстрацію ще не знайдено. Надішліть форму і спробуйте ще раз за кілька секунд.';
    }).withFailureHandler(e => { $('chk').disabled = false; $('err').textContent = e.message; })
      .apiPage(Object.assign({}, PARAMS, { code: pend }));
  };
}

function renderPoster() {
  const site = (S.dict.sites.find(s => s.code === S.poster) || { name: S.poster }).name;
  $('hdrTitle').textContent = S.poster;
  $('app').innerHTML = '<div class="card"><div class="mid">Робота без партії</div><div class="muted">' + esc(site) + '</div>' +
    '<label>Вид роботи</label><select id="wk">' + opts(S.dict.works.map(w => w.name), '', '— оберіть —') + '</select>' +
    '<div id="wkx"></div><label>Коментар</label><textarea id="cm"></textarea>' +
    '<button class="btn" id="go">Записати</button><div class="err" id="err"></div></div>';
  $('wk').onchange = () => {
    const w = S.dict.works.find(x => x.name === $('wk').value);
    $('wkx').innerHTML = !w ? '' : '<label>' + (w.unit === 'год' ? 'Години' : 'Кількість, шт') + '</label>' +
      (w.unit === 'год' ? '<input type="text" inputmode="decimal" id="val" placeholder="напр. 1,5">' : numInput('val', '')) +

    comment: $('cm').value, site: S.poster, view: null }, $('go'), () => { $('wk').value = ''; $('wkx').innerHTML = ''; $('cm').value = ''; });
}

function renderNew() {
  const p = S.perms; const t = S.tare;
  if (!p.newBatch) { $('app').innerHTML = '<div class="card"><div class="big">' + esc(t.code) + '</div><div class="pill ok">вільна</div></div>'; return; }
  const def = t.type === 'ТЧ' ? 'MT' : '';
  $('app').innerHTML = '<div class="card"><div class="muted">Тара</div><div class="big">' + esc(t.code) + '</div><span class="pill ok">вільна</span>' +
    '<span class="pill">' + (t.loc === 'Ж' ? 'Жуляни' : 'Печерськ') + '</span></div>' +
    '<div class="card"><div class="mid">Нова партія</div>' +
    '<label>Що кладете</label><div class="seg">' + ['ST', 'RT', 'MT'].map(s => '<label><input type="radio" name="st" value="' + s + '"' + (s === def ? ' checked' : '') + '><span>' +

    '<div id="nf"></div><div class="err" id="err"></div></div>';
  document.querySelectorAll('input[name=st]').forEach(r => r.onchange = drawNew);
  drawNew();
}
function drawNew() {
  const r = document.querySelector('input[name=st]:checked'); const st = r ? r.value : '';
  if (!st) { $('nf').innerHTML = ''; return; }

  let h = '<div class="row"><div><label>Типорозмір</label><select id="typ">' + opts(S.dict.typ, '3115') + '</select></div>' +
    (st !== 'RT' ? '<div><label>KV</label><select id="kv">' + opts(S.dict.kv, '', '—') + '</select></div>' : '') + '</div>';

    const pair = (id, n) => '<label>' + n + '</label><div class="seg"><label><input type="radio" name="' + id + '" value="власний"><span>Власні</span></label>' +
      '<label><input type="radio" name="' + id + '" value="покупний"><span>Покупні</span></label></div>' +
      '<div id="' + id + 'Pur" style="display:none"><input type="text" id="' + id + 'Lot" placeholder="партія постачальника (якщо є)" style="margin-top:8px">' +
      '<label>Скільки покупних ' + (id === 'stator' ? 'статорів' : 'роторів') + '</label>' + numInput(id + 'Qty', qty) + '</div>';
    h += pair('stator', 'Статори') + pair('rotor', 'Ротори');
  } else h += '<label>Партія постачальника (якщо є)</label><input type="text" id="lot">';
  h += '<label>' + (st === 'MT' ? 'Кількість пар на старті' : 'Кількість на старті') + '</label>' + numInput('qty', qty) +
    '<button class="btn" id="go">Створити партію</button>' +
    (st === 'MT' ? '<p class="muted">Власні статори / ротори після створення додайте кнопкою «Видати на збирання» на сторінці їхньої партії ST / RT.</p>' : '');
  $('nf').innerHTML = h;
  ['stator', 'rotor'].forEach(id => document.querySelectorAll('input[name=' + id + ']').forEach(x => x.onchange = () => {
    $(id + 'Pur').style.display = x.value === 'покупний' && x.checked ? 'block' : 'none'; }));
  $('go').onclick = () => {
    const g = n => { const x = document.querySelector('input[name=' + n + ']:checked'); return x ? x.value : ''; };
    act({ action: 'newBatch', tare: S.tare.code, stream: st, typ: $('typ').value, kv: $('kv') ? $('kv').value : '', qty: $('qty').value,
      lot: $('lot') ? $('lot').value : '', stator: g('stator'), rotor: g('rotor'),
      statorLot: $('statorLot') ? $('statorLot').value : '', rotorLot: $('rotorLot') ? $('rotorLot').value : '',
      statorQty: $('statorQty') ? $('statorQty').value : '', rotorQty: $('rotorQty') ? $('rotorQty').value : '' }, $('go'));
  };
}

function statusPill(s) {
  const cls = { 'в роботі': 'warn', 'готово': 'ok', 'видано частково': 'ok', 'закрито': '', 'анульовано': 'bad', 'поза маршрутом': 'warn' }[s] || '';
  return '<span class="pill ' + cls + '">' + esc(s) + '</span>';
}

function renderBatch(extra) {
  const b = S.batch, i = b.info, p = S.perms;
  const stream = i['Потік'];
  const avail = b.route.filter(s => s.avail > 0 && !s.blockedBy);
  const sug = extra && extra.suggestStep && avail.find(s => s.code === extra.suggestStep);
  const pre = (sug && sug.code) || (avail[0] && avail[0].code) || '';
  // ПВ-22: крок, на якому лишились незакриті штуки і який тримає наступні
  const tails = b.route.filter(s => b.route.some(x => x.blockedBy === s.code));
  let h = '<div class="card"><div class="muted">' + ({ ST: 'Статори', RT: 'Ротори', MT: 'Двигуни' })[stream] + (S.tare ? ' · тара ' + esc(S.tare.code) : ' · ⚠ без тари') + '</div>' +
    '<div class="big">' + esc(i['Номер']) + '</div>' +
    '<span class="pill">' + esc(i['Типорозмір']) + '</span>' + (i['KV'] ? '<span class="pill">KV ' + esc(i['KV']) + '</span>' : '') +
    (i['Варіант'] ? '<span class="pill">' + esc(i['Варіант']) + '</span>' : '') + (b.comp && b.comp.mixed ? '<span class="pill warn">змішане походження</span>' : '') + statusPill(b.status) +
    (i['Змішана'] === 'так' ? '<span class="pill warn">змішана</span>' : '') + (i['Призначення'] ? '<span class="pill warn">' + esc(i['Призначення']) + '</span>' : '') +
    '<div class="muted" style="margin-top:10px">Є зараз: <b>' + b.remaining + ' шт</b> · брак: ' + b.scrapAll + (b.issued ? ' · видано: ' + b.issued : '') + '</div>' +
    '<div class="stepbar">' + b.route.map(s => '<span class="' + (s.code === pre ? 'n' : tails.indexOf(s) >= 0 ? 'w' : (s.good + s.scrap > 0 && s.avail === 0 ? 'd' : '')) + '">' + esc(s.code) + '</span>').join('') + '</div>' +
    nowHtml(b) +
    tails.map(t => { const nx = b.route.filter(x => x.blockedBy === t.code).map(x => x.code);
      return '<div class="tail">На <b>' + esc(t.code) + '</b> лишилось <b>' + t.avail + ' шт</b>. Поки їх не записано (успішні або брак) або не відокремлено, ' + esc(nx.join(', ')) + ' не відкриється.</div>'; }).join('') +
    '</div>';
  if (b.comp) {
    const row = (n, c) => '<div class="li"><div><b>' + n + '</b><br><span class="muted">прийшло ' + c.in + (c.pur && c.own + c.xfer ? ' (власні ' + (c.own + c.xfer) + ', покупні ' + c.pur + ')' : c.pur ? ' покупних' : '') +
      ' · у двигунах ' + c.used + ' · брак ' + c.scrap + (c.ret ? ' · повернуто ' + c.ret : '') + (c.waitF4 ? ' · чекають F4п ' + c.waitF4 : '') + '</span></div>' +
      '<div class="r"><span class="pill ' + (c.left ? 'warn' : '') + '">залишок ' + c.left + '</span></div></div>';
    h += '<div class="card" style="padding-top:8px"><div class="list" style="padding:0">' + row('Статори', b.comp.S) + row('Ротори', b.comp.R) + '</div></div>';
  }

  if (b.status === 'анульовано' || b.status === 'закрито') {
    h += '<div class="card muted">Партія ' + esc(b.status) + '. Записи неможливі.</div>';
  } else if (i['Призначення']) {
    h += '<div class="card muted">Партія поза маршрутом (' + esc(i['Призначення']) + '): кроки не записуються.</div>';
  } else if (p.step && avail.length) {
    h += '<div class="card"><div class="mid">Додати крок</div>' +
      '<label>Крок</label><select id="stp">' + b.route.map(s => '<option value="' + esc(s.code) + '"' + (s.avail && !s.blockedBy ? '' : ' disabled') + (s.code === pre ? ' selected' : '') + '>' +
        esc(s.code + ' · ' + s.name) + (s.avail ? (s.blockedBy ? ' — ' + s.avail + ' шт, спершу закрити ' + s.blockedBy : ' — доступно ' + s.avail) : '') + '</option>').join('') + '</select>' +
      '<label id="goodLbl">Успішних</label>' + numInput('good', '') +
      '<div id="scrapWrap"><label>Брак</label>' + numInput('scrap', 0) + '</div>' +
      '<div id="rsn" style="display:none"><label>Причина браку</label><select id="reason">' + opts(S.dict.reasons, '', '— оберіть —') + '</select></div>' +
      '<div id="xf"></div>' +
      '<label>Коментар (необов\'язково)</label><input type="text" id="cm">' +
      '<button class="btn" id="go">Записати</button><div class="err" id="err"></div></div>';
  } else if (b.status === 'готово' || b.status === 'видано частково') {
    h += '<div class="card"><div class="mid">✓ Усі кроки пройдено</div><div class="muted">' +
      (stream === 'MT' ? 'Партію двигунів завершено.' : 'Можна видавати на збирання.') + '</div></div>';
  }

  // дії
  const acts = [];
  if (p.issue && (stream === 'ST' || stream === 'RT') && (b.status === 'готово' || b.status === 'видано частково')) acts.push(['issue', '➜ Видати на збирання', '']);
  if (p.move && b.status !== 'закрито' && b.status !== 'анульовано') acts.push(['move', S.tare ? '⇄ Перекласти' : '⇄ Прив\'язати до тари', '']);
  if (b.comp && p.returnLeft && (b.comp.S.left > 0 || b.comp.R.left > 0)) acts.push(['returnLeft', '↩ Повернути залишок', '']);
  if (b.comp && p.addPurchased && b.status === 'в роботі') acts.push(['addPurchased', '+ Додати покупні', '']);
  if (p.separate && (b.stages || []).length && b.status !== 'анульовано') acts.push(['separate', '✂ Відокремити', '']);
  if (p.free && S.tare) acts.push(['free', 'Звільнити тару', '']);
  if (p.history) acts.push(['history', '🕘 Повна історія', '']);
  if (p.annul && b.status !== 'анульовано' && b.status !== 'закрито') acts.push(['annul', '✖ Анулювати', 'btnr']);
  if (acts.length) h += '<div class="card"><div class="grid">' + acts.map(a => '<button class="btn btn2 ' + a[2] + '" onclick="openAct(\'' + a[0] + '\')">' + a[1] + '</button>').join('') + '</div></div>';

  // маршрут
  h += '<details><summary>Маршрут і кількості</summary><div class="list">' + b.route.map(s =>
    '<div class="li"><div>' + esc(s.code + ' · ' + s.name) + '</div><div class="r">' + (s.good || s.scrap ? s.good + ' / <span style="color:#9B231A">' + s.scrap + '</span>' : '<span class="muted">—</span>') +
    (s.avail ? '<br><span class="muted">доступно ' + s.avail + '</span>' : '') + '</div></div>').join('') + '</div></details>';

  // історія
  h += '<details' + (extra && extra.openHist ? ' open' : '') + '><summary>Історія (' + b.history.length + ')</summary><div class="list">' + b.history.map(x => {
    let what = esc(x.type);
    if (x.type === 'крок') what = '<b>' + esc(x.step) + '</b> · ' + x.good + ' / ' + x.scrap + (x.reason ? ' · ' + esc(x.reason) : '');
    if (x.type === 'нова партія') what = 'нова партія · ' + x.qty + ' шт';
    if (x.type === 'перекладання') what = 'перекладання ' + esc(x.from || '—') + ' → ' + esc(x.to) + (x.back ? ' (назад)' : '');
    if (x.type === 'видача') what = x.batch === i['Номер'] ? 'видано ' + x.qty + ' → ' + bl(x.target) : 'отримано ' + x.qty + ' з ' + bl(x.batch);
    if (x.type === 'покупні') what = '+ ' + x.qty + ' покупних ' + (x.comp === 'ротор' ? 'роторів' : 'статорів');
    if (x.type === 'залишок') what = x.batch === i['Номер'] ? 'повернуто ' + x.qty + ' ' + esc(x.comp) + ' → ' + (x.target ? bl(x.target) : 'склад') : 'отримано ' + x.qty + ' ' + esc(x.comp) + ' з ' + bl(x.batch);
    if (x.type === 'крок' && x.step === 'F1' && b.comp) what = '<b>F1</b> · зібрано ' + x.good + (x.x1 ? ' · брак статорів ' + x.x1 : '') + (x.x2 ? ' · брак роторів ' + x.x2 : '') + (x.reason ? ' · ' + esc(x.reason) : '');
    if (x.type === 'відокремлення') what = (x.batch === i['Номер'] ? 'відокремлено ' + x.qty + ' → ' + bl(x.target) : 'додано ' + x.qty + ' з ' + bl(x.batch)) + (x.product ? ' · ' + esc(x.product) : '');
    if (x.type === 'вибуття') what = 'вибуло ' + x.qty + ' шт → <b>' + esc(x.purpose) + '</b> · ' + esc(x.product);
    const btns = (x.canCancel ? '<button class="ic" onclick="cancelRec(\'' + x.id + '\')">✖</button>' : '') +
      (x.canBack && p.move ? '<button class="ic" onclick="moveBack(\'' + x.id + '\')">↩ назад</button>' : '') +
      (x.canUndo ? '<button class="ic" onclick="undoSep(\'' + x.id + '\')">✖</button>' : '') +
      (x.canCorrect ? '<button class="ic" onclick="openCorrect(\'' + x.id + '\')">✎</button>' : '');
    return '<div class="li"><div class="' + (x.cancelled ? 'x' : '') + '">' + what + (x.corrected ? ' <span class="pill warn">виправлено</span>' : '') +
      '<br><span class="muted">' + esc(x.who) + (x.comment ? ' · ' + esc(x.comment) : '') + '</span></div><div class="r muted">' + esc(x.time) + btns + '</div></div>';
  }).join('') + '</div></details>';

  // зв'язки
  const rel = [];
  if (i['Батьківська']) rel.push('Відокремлена з ' + bl(i['Батьківська']) + ' (історія до відокремлення — там)');
  if (i['Статор']) rel.push('Статори: ' + esc(i['Статор']));
  if (i['Ротор']) rel.push('Ротори: ' + esc(i['Ротор']));
  if (i['Партія постачальника']) rel.push('Партія постачальника: ' + esc(i['Партія постачальника']));
  b.sources.forEach(s => rel.push(s.kind === 'покупні' ? 'Додано ' + s.qty + ' шт: ' + esc(s.batch) : (s.kind === 'видача' ? 'Взято ' : s.kind === 'залишок' ? 'Залишок ' : 'Додано ') + s.qty + ' шт з ' + bl(s.batch)));
  b.issues.forEach(s => rel.push(s.kind === 'залишок' ? 'Повернуто ' + s.qty + ' ' + esc(s.comp) + ' → ' + (s.batch === 'склад' ? 'склад' : bl(s.batch)) : 'Видано ' + s.qty + ' шт у ' + bl(s.batch)));
  b.children.forEach(s => rel.push('Відокремлено ' + s.qty + ' шт → ' + bl(s.batch)));
  (b.exits || []).forEach(s => rel.push('Вибуло ' + s.qty + ' шт → ' + esc(s.purpose) + ': ' + esc(s.product) + (s.comment ? ' (' + esc(s.comment) + ')' : '')));
  if (rel.length) h += '<details><summary>Зв\'язки</summary><div class="list">' + rel.map(r => '<div class="li"><div>' + r + '</div></div>').join('') + '</div></details>';

  $('app').innerHTML = h + '<div style="height:40px"></div>';
  if ($('stp')) { $('stp').onchange = stepChanged; stepChanged(); $('scrap').oninput = () => $('rsn').style.display = Number($('scrap').value) > 0 ? 'block' : 'none'; $('go').onclick = submitStep; }
}
/** Що зараз лежить у тарі: напівфабрикат і скільки (після якого кроку, який крок чекає) */
function nowHtml(b) {
  const st = b.stages || [];
  if (!st.length) return '';
  return '<div class="now"><div class="muted">Що в тарі зараз</div><div class="list" style="padding:0">' + st.map(x =>
    '<div class="li"><div><b>' + x.qty + ' шт</b> · ' + esc(x.name) + '</div><div class="r muted">' + (x.done ? 'усі кроки пройдено' : 'чекає ' + esc(x.wait)) + '</div></div>').join('') + '</div></div>';
}
function bl(no) { return '<a class="lnk" href="' + esc(link('b=' + encodeURIComponent(no))) + '">' + esc(no) + '</a>'; }

function stepChanged() {
  const s = S.batch.route.find(x => x.code === $('stp').value);
  $('good').value = s ? s.avail : ''; $('scrap').value = 0; $('rsn').style.display = 'none';
  $('scrapWrap').style.display = (s && s.code === 'F1' && S.batch.comp) ? 'none' : 'block';
  $('goodLbl').textContent = (s && s.code === 'F1' && S.batch.comp) ? 'Зібрано двигунів' : 'Успішних';
  let x = '';
  if (s && s.code === 'F1' && S.batch.comp) {
    x = '<label>Брак статорів</label>' + numInput('x1', 0) + '<label>Брак роторів</label>' + numInput('x2', 0) +
      '<p class="muted">Зібрано — успішно зібрані двигуни. Якщо бракований лише статор або лише ротор — пишіть брак тільки цієї деталі: друга лишиться в залишку.</p>';
  }
  if (s && s.extra === 'split') x = '<div class="row"><div><label>На балансування</label>' + numInput('x1', s.avail) + '</div></div><label>Одразу на R7</label>' + numInput('x2', 0);
  if (s && s.extra === 'kv') x = '<label>KV — під який гравіюють</label><select id="kvs">' + opts(S.dict.kv, S.batch.info['KV'], '— оберіть —') + '</select>';
  if (s && s.extra === 'pack') x = '<div class="row"><div><label>Ящиків</label><input type="number" inputmode="numeric" id="x1"></div><div><label>Ложементів</label><input type="number" inputmode="numeric" id="x2"></div></div>';
  if (s && s.extra.indexOf('check:') === 0) x = '<label style="display:flex;gap:10px;align-items:center;font-size:18px;color:#1D2B33"><input type="checkbox" id="chk" checked style="width:26px;height:26px"> ' + esc(s.extra.slice(6)) + '</label>';
  $('xf').innerHTML = x;
  if (s && s.code === 'F1' && S.batch.comp) {
    const upd = () => $('rsn').style.display = (Number($('x1').value) || 0) + (Number($('x2').value) || 0) > 0 ? 'block' : 'none';
    $('x1').oninput = upd; $('x2').oninput = upd;
  }
  if (s && s.extra === 'split') $('good').oninput = () => { $('x1').value = Math.max(0, (Number($('good').value) || 0) - (Number($('x2').value) || 0)); };
}
function submitStep() {
  const v = id => $(id) ? $(id).value : '';
  act({ action: 'step', batch: S.batch.info['Номер'], step: $('stp').value, good: v('good'), scrap: v('scrap'), reason: v('reason'),
    x1: v('x1'), x2: v('x2'), kv: v('kvs'), check: $('chk') ? $('chk').checked : false, comment: v('cm') }, $('go'));
}

// =============================================================== ACTIONS
function openAct(a) {
  const no = S.batch.info['Номер'];
  if (a === 'history') { location.href = link('h=' + encodeURIComponent(no)); return; }
  const head = t => '<div class="card"><div class="mid">' + t + '</div><div class="muted">' + esc(no) + ' · є ' + S.batch.remaining + ' шт</div>';
  const foot = '<div class="err" id="merr"></div><div class="grid" style="margin-top:6px"><button class="btn btn2" onclick="closeModal()">Скасувати</button><button class="btn" id="mgo">Підтвердити</button></div></div>';
  if (a === 'move') {
    openModal(head(S.tare ? 'Перекласти в іншу тару' : 'Прив\'язати до тари') + '<label>Куди (вільна тара)</label>' + tarePicker('tg', ['ПД', 'КР', 'ТЧ', 'СК']) +
      '<label>Коментар</label><input type="text" id="mcm">' + foot);
    $('mgo').onclick = () => { const tg = tareVal('tg'); moveTo(no, tg, $('mcm').value, $('mgo')); };
  }
  if (a === 'issue') {
    openModal(head('Видати на збирання') + '<label>Тара партії двигунів (MT)</label>' + tarePicker('tg', ['КР', 'ТЧ']) +
      '<label>Кількість, шт</label>' + numInput('mq', S.batch.remaining) + '<label>Коментар</label><input type="text" id="mcm">' + foot);
    $('mgo').onclick = () => act({ action: 'issue', batch: no, target: tareVal('tg'), qty: $('mq').value, comment: $('mcm').value }, $('mgo'));
  }
  if (a === 'separate') {
    // v3: що саме (напівфабрикат на якому етапі) → куди: за маршрутом у тару або вибуття з циклу (без тари)
    const st = S.batch.stages || [];
    const cap = t => t ? t.charAt(0).toUpperCase() + t.slice(1) : t;

/** Р-2а «Стан зараз» (ДШ-1): що лежить на кожному кроці, які партії стоять, що пішло в брак */
function dashStan() {
  const d = DB, R = d.routes[DF.flow] || [];
  const nm = c => (R.find(x => x[0] === c) || [c, ''])[1];
  const locOk = l => DF.loc === 'all' || String(l || '').charAt(0) === DF.loc;
  const fit = x => (DF.typ === 'all' || x.typ === DF.typ) && (DF.kv === 'all' || x.kv === DF.kv);
  const bs0 = d.batches.filter(b => b.stream === DF.flow && locOk(b.loc) && fit(b));
  const bs = DF.step ? bs0.filter(b => b.wait[DF.step]) : bs0;
  const stuck = bs.filter(b => b.stuck);
  const recOk = r => r.isStep && r.stream === DF.flow && r.p === DF.per && locOk(r.floor) && fit(r);
  const rs = d.recs.filter(r => recOk(r) && (!DF.step || r.step === DF.step));
  const lastCode = R.length ? R[R.length - 1][0] : '';
  const doneStep = DF.step || lastCode;
  const done = d.recs.filter(r => recOk(r) && r.step === doneStep).reduce((a, r) => a + r.good, 0);
  const scr = rs.reduce((a, r) => a + r.scrap, 0);
  const ctl = {}; R.forEach(x => ctl[x[0]] = x[2] === 'К');
  const chk = rs.filter(r => ctl[r.step]).reduce((a, r) => a + r.good + r.scrap, 0);
  const flagged = d.recs.filter(r => r.flagged && r.p === DF.per).length;
  const perL = DF.per === 'today' ? 'сьогодні' : 'за ' + d.prevLabel;
  const typs = [...new Set(d.batches.filter(b => b.stream === DF.flow).map(b => b.typ).concat(d.recs.filter(r => r.stream === DF.flow).map(r => r.typ)))].filter(x => x).sort();
  const kvs = [...new Set(d.batches.filter(b => b.stream === DF.flow && (DF.typ === 'all' || b.typ === DF.typ)).map(b => b.kv))].filter(x => x).sort((a, b) => a - b);
  let h = '<div class="fl">' + chips('loc', [['all', 'Усі'], ['П', 'Печерськ'], ['Ж', 'Жуляни']]) + chips('flow', [['ST', 'Статори'], ['RT', 'Ротори'], ['MT', 'Двигуни']]) +
    chips('per', [['today', 'Сьогодні']].concat(d.prevLabel ? [['prev', d.prevLabel]] : [])) + dsel('typ', 'Типорозмір', typs) + dsel('kv', 'KV', kvs) +
    (DF.step ? '<div class="chips"><button type="button" class="on" onclick="dset(\'step\',\'' + esc(DF.step) + '\')">Крок ' + esc(DF.step) + ' ✕</button></div>' : '') + '</div>';
  h += '<div class="kpis" style="margin:12px">' +
    kpi(DF.step ? 'Записано на ' + esc(DF.step) + ' ' + perL : 'Готових ' + FLOWN[DF.flow][1] + ' ' + perL, fn(done), 'шт', esc(doneStep + ' · ' + nm(doneStep))) +
    kpi('У роботі', bs.length, 'партій', fn(bs.reduce((a, b) => a + (DF.step ? b.wait[DF.step] : Math.max(0, b.rem)), 0)) + ' шт у тарі') +
    kpi('Брак ' + perL, fn(scr), 'шт', chk ? pct(scr, chk) + ' від перевірених' : '') +
    kpi('Без руху ≥ ' + d.idleDays + ' дн.', stuck.length, 'партій', stuck.length ? '<span class="pill bad" style="margin:0">потребує уваги</span>' : 'усе рухається') +
    (flagged ? kpi('Записи з невідомих акаунтів', flagged, '', 'чекають тімліда') : '') + '</div>';
  // незавершене виробництво за кроками: скільки штук чекає кожен крок; натискання — фільтр
  const rows = R.map(x => {
    const q = bs0.reduce((a, b) => a + (b.wait[x[0]] || 0), 0);
    const sk = bs0.filter(b => b.wait[x[0]] && b.stuck).length;
    return { l: '<b>' + esc(x[0]) + '</b> <span class="muted">' + esc(x[1]) + '</span>', v: q,
      t: (q ? fn(q) + ' шт' : '<span class="muted">—</span>') + (sk ? ' <span class="pill bad" style="margin:0 0 0 4px">' + sk + ' стоять</span>' : ''),
      cls: 'click' + (DF.step === x[0] ? ' on' : DF.step ? ' dim' : ''), on: "dset('step','" + esc(x[0]) + "')" };
  });
  const fin = bs0.reduce((a, b) => a + Math.max(0, b.rem - Object.keys(b.wait).reduce((s, k) => s + b.wait[k], 0)), 0);
  if (fin) rows.push({ l: '<b>✓</b> <span class="muted">пройшли маршрут, у тарі</span>', v: fin, t: fn(fin) + ' шт', c: '#1F7A4D' });
  h += dcard('Де зараз ' + FLOWN[DF.flow][1] + ' · за кроками', 'Скільки штук чекає кожен крок. Натисніть крок — решта покаже тільки його.' +
    (DF.flow === 'RT' && DF.kv !== 'all' ? ' KV ротора відомий з F4, тому партії до F4 за фільтром KV не видно.' : ''),
    bs0.length || fin ? hbars(rows) : '<p class="muted">' + (DF.loc === 'Ж' && DF.flow !== 'MT' ? 'На Жулянах ' + FLOWN[DF.flow][1] + ' не виготовляють.' : 'За цими фільтрами партій у роботі немає.') + '</p>');
  // партії
  const list = (DF.only === 'stuck' ? stuck : bs).slice().sort((a, b) => b.idle - a.idle || a.no.localeCompare(b.no));
  const shown = DF.more ? list : list.slice(0, 15);
  h += dcard('Партії в роботі' + (DF.step ? ': крок ' + esc(DF.step) : ''), bs.length + ' партій, з них без руху ' + stuck.length,
    chips('only', [['all', 'Усі'], ['stuck', 'Тільки без руху']]) + (list.length ? '<div class="tw" style="margin-top:10px"><table class="t"><tr><th>Партія</th><th>Тип · KV</th><th>Крок</th><th>Тара</th><th class="r">шт</th><th>Останній запис</th></tr>' +
      shown.map(b => '<tr><td>' + bl(b.no) + '</td><td>' + esc(b.typ) + (b.kv ? ' · ' + esc(b.kv) : '') + '</td><td>' + esc(b.step || '—') +
        (b.purpose ? ' <span class="pill warn" style="margin:0">' + esc(b.purpose) + '</span>' : '') + '</td><td>' + esc(b.tare || '⚠ без тари') + '</td><td class="r">' +
        fn(DF.step ? b.wait[DF.step] : b.rem) + '</td><td>' + esc(b.last || '—') + (b.stuck ? ' <span class="pill bad" style="margin:0">' + b.idle + ' дн.</span>' : '') + '</td></tr>').join('') +
      '</table></div>' + (list.length > 15 ? '<button type="button" class="ic" style="margin-top:8px" onclick="dset(\'more\',DF.more?\'\':\'1\')">' + (DF.more ? 'Згорнути' : 'Показати всі ' + list.length) + '</button>' : '')
      : '<p class="muted">Немає партій за цими фільтрами.</p>'));
  // брак за причинами
  const rz = {}; rs.forEach(r => { if (r.scrap) rz[r.reason || '—'] = (rz[r.reason || '—'] || 0) + r.scrap; });
  const rr = Object.keys(rz).sort((a, b) => rz[b] - rz[a]);
  h += dcard('Брак ' + perL + ' за причинами', DF.step ? 'Крок ' + esc(DF.step) : '', rr.length ? hbars(rr.map(k => ({ l: esc(k), v: rz[k], t: fn(rz[k]) + ' шт', c: '#B3261E' }))) : '<p class="muted">Браку немає.</p>');

  const fl = {}; rs.forEach(r => fl[r.floor || '—'] = (fl[r.floor || '—'] || 0) + r.good);
  const sn = c => (d.sites.find(x => x.code === c) || { name: c === '—' ? 'місце не вказано' : c }).name;
  const fk = Object.keys(fl).sort();
  h += dcard('Успішні операції ' + perL + ' за поверхами', 'Сума всіх кроків: деталь рахується стільки разів, скільки кроків пройшла',
    fk.length ? hbars(fk.map(k => ({ l: '<b>' + esc(k) + '</b> <span class="muted">' + esc(sn(k)) + '</span>', v: fl[k], t: fn(fl[k]) + ' шт' }))) : '<p class="muted">Записів немає.</p>');
  return h;
}

  if (nb.length) h += dcard('Робота без партії', '', '<div class="tw"><table class="t"><tr><th>Дата</th><th>Робота</th><th class="r">Кількість</th></tr>' +

let HB = null; let HF = 'all';

    }).apiHistory({ code: CODE, b: PARAMS.h });
}
function histMail(btn) {
  btn.disabled = true; btn.textContent = 'Надсилаю…';
  google.script.run.withSuccessHandler(r => { btn.disabled = false; btn.textContent = '✉ Надіслати таблицю на пошту'; toast(r.msg); })
    .withFailureHandler(e => { btn.disabled = false; btn.textContent = '✉ Надіслати таблицю на пошту'; toast(e.message, true); })

}
function histTree(nodes, dir) {
  if (!nodes.length) return '<p class="muted">' + (dir === 'in' ? 'Деталі з інших партій не надходили.' : 'Деталі в інші партії не йшли.') + '</p>';
  const one = n => {
    const l = n.link; const other = dir === 'in' ? l.from : l.to;
    const head = (dir === 'in' ? '← ' : '→ ') + '<b>' + l.qty + ' шт</b> ' + (dir === 'in' ? 'з ' : '') +
      (other ? bl(other) : '<b>' + esc(l.purpose || l.type) + '</b>') + ' · ' + esc(l.type) + (l.product ? ' · ' + esc(l.product) : (l.step ? ' · ' + esc(l.step) : ''));
    return '<div style="margin-left:' + ((n.level - 1) * 14) + 'px;border-left:2px solid #E3EAEF;padding:6px 0 6px 10px">' +
      '<div class="' + (l.cancelled ? 'x' : '') + '">' + head + '</div><div class="muted" style="font-size:13px">' + esc(l.time) + ' · ' + esc(l.who) +
      (n.batch ? ' · ' + esc(n.batch.status) : '') + (l.comment ? ' · ' + esc(l.comment) : '') +
      (l.cancelled ? '<br>скасовано ' + esc(l.cancelled.time) + ' · ' + esc(l.cancelled.who) + (l.cancelled.comment ? ' · ' + esc(l.cancelled.comment) : '') : '') +
      (n.repeat ? ' · див. вище' : '') + (n.more ? ' · далі не показано' : '') + '</div></div>' + n.children.map(one).join('');
  };

}
function histWhat(x) {
  const own = x.batch === HB.info.no;
  if (x.type === 'крок') {
    const g = x.corrected ? x.corrected.good : x.good, s = x.corrected ? x.corrected.scrap : x.scrap;
    return '<b>' + esc(x.step) + '</b> ' + esc(x.stepName) + ' · ' + g + ' / ' + s + (x.reason ? ' · ' + esc(x.reason) : '');
  }
  if (x.type === 'нова партія') return 'нова партія · ' + x.qty + ' шт';
  if (x.type === 'перекладання') return 'перекладання ' + esc(x.tare || '—') + ' → ' + esc(x.tareTo);
  if (x.type === 'відокремлення') return (x.from === x.batch ? 'відокремлено ' + x.qty + ' → ' + bl(x.to) : 'додано ' + x.qty + ' з ' + bl(x.from)) + (x.x2 ? ' · ' + esc(x.x2) : '');
  if (x.type === 'вибуття') return 'вибуло ' + x.qty + ' → <b>' + esc(x.x1) + '</b> · ' + esc(x.x2);
  if (x.type === 'видача') return x.from === x.batch ? 'видано ' + x.qty + ' → ' + bl(x.to) : 'отримано ' + x.qty + ' з ' + bl(x.from);
  if (x.type === 'залишок') return x.from === x.batch ? 'повернуто ' + x.qty + ' ' + esc(x.x1) + ' → ' + (x.to ? bl(x.to) : 'склад') : 'отримано залишок ' + x.qty + ' ' + esc(x.x1) + ' з ' + bl(x.from);
  if (x.type === 'покупні') return '+ ' + x.qty + ' покупних ' + (x.x1 === 'ротор' ? 'роторів' : 'статорів');
  return esc(x.type) + (x.qty ? ' · ' + x.qty : '') + (own ? '' : '');
}

    '<button class="btn btn2" onclick="histMail(this)">✉ Надіслати таблицю на пошту</button>' +
    '<p class="muted" style="margin:8px 0 0">Прийде на ' + esc(d.me.email) + ' — файл .xlsx для комп\'ютера.</p></div>';
  h += dcard('Звідки прийшли деталі', 'до ' + d.depth + ' рівнів', histTree(d.from, 'in'));
  h += dcard('Куди пішли деталі', 'до ' + d.depth + ' рівнів', histTree(d.to, 'out'));
  const rows = d.rows.filter(x => HF === 'all' || (HF === 'own' ? x.own : x.type === 'крок'));
  h += dcard('Хронологія (' + rows.length + ')', d.ancestors.length ? 'Разом із партіями-предками до моменту передачі: ' + d.ancestors.map(a => esc(a.no) + ' до ' + esc(a.until)).join(', ') +
      '. Їхні числа — за всю їхню партію, а не лише за передану частину.' : '',
    '<div class="chips" style="margin-bottom:8px">' + [['all', 'Усе'], ['own', 'Тільки ця партія'], ['steps', 'Тільки кроки']].map(x =>
      '<button type="button" class="' + (HF === x[0] ? 'on' : '') + '" onclick="HF=\'' + x[0] + '\';renderHistory()">' + x[1] + '</button>').join('') + '</div>' +
    '<div class="list" style="padding:0">' + rows.map(x =>
      '<div class="li"><div class="' + (x.cancelled ? 'x' : '') + '">' + (x.own ? '' : '<span class="pill warn" style="margin:0 6px 0 0">' + esc(x.batch) + '</span>') + histWhat(x) +
        (x.corrected ? ' <span class="pill warn" style="margin:0">було ' + x.good + ' / ' + x.scrap + '</span>' : '') +
        '<br><span class="muted">' + esc(x.who) + (x.comment ? ' · ' + esc(x.comment) : '') +
        (x.corrected ? '<br>виправив ' + esc(x.corrected.who) + ' ' + esc(x.corrected.time) + ' · ' + esc(x.corrected.comment) : '') +
        (x.cancelled ? '<br>скасував ' + esc(x.cancelled.who) + ' ' + esc(x.cancelled.time) + (x.cancelled.comment ? ' · ' + esc(x.cancelled.comment) : '') : '') +
        '</span></div><div class="r muted">' + esc(x.time.slice(0, 10)) + '<br>' + esc(x.time.slice(11)) + '</div></div>').join('') + '</div>');
  h += dcard('Підсумок за кроками', 'Хто скільки зробив на кожному кроці (з урахуванням виправлень і скасувань)',
    d.steps.length ? '<div class="tw"><table class="t"><tr><th>Партія</th><th>Крок</th><th>Хто</th><th class="r">Успішних</th><th class="r">Брак</th></tr>' +
      d.steps.map(s => '<tr><td>' + (s.own ? esc(s.batch) : '<span class="pill warn" style="margin:0">' + esc(s.batch) + '</span>') + '</td><td><b>' + esc(s.step) + '</b> <span class="muted">' +
        esc(s.stepName) + '</span></td><td>' + esc(s.who) + '</td><td class="r">' + fn(s.good) + '</td><td class="r">' + (s.scrap || '—') + '</td></tr>').join('') + '</table></div>'
      : '<p class="muted">Кроків ще немає.</p>');
  h += '<p class="muted" style="text-align:center">Дані на ' + esc(d.now) + (d.me.role === 'адміністратор' ? ' · ' + sec(d.ms) : '') + ' · <a class="lnk" href="javascript:loadHistory()">оновити</a></p><div style="height:30px"></div>';
  $('app').innerHTML = h;
}

// =============================================================== СКЛАД (v9)
// QR на дверях складу: …?s=П1. Видача / повернення, фото етикетки (розпізнає сервер), «Мої видачі».
let SKD = null;                 // дані від сервера
let SKF = { photo: '', raw: '', busy: null };   // фото поточного запису; busy — запит фото, що ще йде
function loadSklad() {
  $('hdrTitle').textContent = 'склад';
  $('app').innerHTML = '<div class="center muted">Завантаження…</div>';
  google.script.run.withSuccessHandler(d => { SKD = d; renderSklad(); })
    .withFailureHandler(e => {
      if (/не зареєстровано/.test(e.message)) return loadPage();
      $('app').innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
    }).apiSkladPage({ code: CODE, s: PARAMS.s || '' });
}
/** «1+2+5» → 8; «2,5» → 2.5; інакше NaN (сервер перевіряє так само) */
function skCalc(v) {
  const s = String(v || '').replace(/\s+/g, '').replace(/,/g, '.');
  if (!/^\d+(\.\d+)?([+\-]\d+(\.\d+)?)*$/.test(s)) return NaN;
  let sum = 0; s.match(/[+\-]?\d+(\.\d+)?/g).forEach(t => sum += Number(t));
  return Math.round(sum * 1000) / 1000;
}
function skNum(n) { return String(n).replace('.', ','); }
function renderSklad() {
  const d = SKD; const me = d.me;
  $('who').innerHTML = esc(me.name) + '<br>' + esc(me.role);
  $('hdrTitle').textContent = d.loc ? 'склад · ' + d.loc.code : 'склад';
  const locHtml = d.loc
    ? '<div class="muted">Локація: <b>' + esc(d.loc.code) + (d.loc.name && d.loc.name !== d.loc.code ? ' · ' + esc(d.loc.name) : '') + '</b></div>'
    : '<label>Локація складу</label><select id="skLoc">' + opts(d.locs.map(l => l.code + (l.name !== l.code ? ' · ' + l.name : '')), '', '— оберіть —') + '</select>';
  const posList = d.positions.map(p => p.name).concat([d.other]);
  let h = '<div class="card"><div class="mid">Видача зі складу</div>' + locHtml +
    '<label>Дія</label><div class="seg"><label><input type="radio" name="skAct" value="взяв" checked><span>Взяв</span></label>' +
    '<label><input type="radio" name="skAct" value="повернув"><span>Повернув</span></label></div>' +
    (d.photo ? '<label>Фото етикетки <span class="muted">(необов\'язково — заповнить поля саме)</span></label>' +
      '<input type="file" accept="image/*" capture="environment" id="skFile" style="display:none">' +
      '<button type="button" class="btn btn2" id="skCam" style="margin-top:0">📷 Сфотографувати етикетку</button>' +
      '<div id="skPh" class="muted" style="margin-top:8px"></div>' : '') +
    '<label>Що взяли</label><select id="skPos">' + opts(posList, '', '— оберіть —') + '</select>' +
    '<div id="skOtherBox" style="display:none"><label>Що саме</label><input type="text" id="skOther" placeholder="назва"></div>' +
    '<label>Типорозмір <span class="muted">(якщо є)</span></label><select id="skTyp">' + opts(d.typ, '', '—') + '</select>' +
    '<label>Деталі <span class="muted">(марка, розмір, артикул)</span></label><input type="text" id="skDet" placeholder="напр. 0,425 мм">' +
    '<label>Кількість</label><div class="row" style="align-items:center"><input type="text" inputmode="decimal" id="skQty" placeholder="напр. 1000 або 1+2+5" style="font-size:22px;font-weight:600">' +
    '<button type="button" class="ic" id="skPlus" style="flex:0 0 58px;font-size:26px;padding:10px 0;margin:0">+</button></div>' +
    '<div id="skSum" class="muted" style="margin-top:6px;min-height:20px"></div>' +
    '<label>Одиниця</label><select id="skUnit">' + opts(d.units, 'шт') + '</select>' +
    '<label>Партія постачальника <span class="muted">(з коробки, якщо є)</span></label><input type="text" id="skLot">' +
    '<label>Партія МЛП <span class="muted">(необов\'язково)</span></label><input type="text" id="skMlp" placeholder="напр. ST-00012" autocapitalize="characters">' +
    '<label>Коментар</label><textarea id="skCm"></textarea>' +
    '<button class="btn" id="skGo">Записати</button><div class="err" id="err"></div></div>';
  h += '<div id="skMy"></div><p class="muted" style="text-align:center">' + esc(PAGE_VERSION) + ' · ' + esc(d.version) + '</p><div style="height:20px"></div>';
  $('app').innerHTML = h;
  renderSkMy();
  $('skPos').onchange = () => {
    const v = $('skPos').value;
    $('skOtherBox').style.display = v === d.other ? 'block' : 'none';
    const p = d.positions.find(x => x.name === v); if (p && !SKF.unitTouched) $('skUnit').value = p.unit;
  };
  $('skUnit').onchange = () => SKF.unitTouched = true;
  $('skQty').oninput = skShowSum;
  $('skPlus').onclick = () => { const q = $('skQty'); if (q.value && !/[+\-]$/.test(q.value)) q.value += '+'; q.focus(); skShowSum(); };
  if (d.photo) {
    $('skCam').onclick = () => $('skFile').click();
    $('skFile').onchange = e => { const f = e.target.files && e.target.files[0]; if (f) skPhoto(f); e.target.value = ''; };
  }
  $('skGo').onclick = skSave;
}
function skShowSum() {
  const v = $('skQty').value; const n = skCalc(v); const box = $('skSum');
  const hint = SKF.hint ? '<span>на етикетці: ' + esc(SKF.hint) + '</span>' : '';
  if (!v) { box.innerHTML = hint; return; }
  if (isNaN(n)) { box.innerHTML = '<span style="color:#9B231A">лише числа і «+»</span>'; return; }
  box.innerHTML = /[+\-]/.test(v.replace(/^[+\-]/, '')) ? '<b style="color:#1D2B33;font-size:18px">= ' + skNum(n) + '</b>' + (hint ? ' · ' + hint : '') : hint;
}
/** Стиснути фото до 1600 px (JPEG) — швидше відправка, сервер і модель читають етикетку так само */
function skShrink(file) {
  return new Promise((ok, fail) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('Не вдалося відкрити фото')); };
    img.src = url;
  });
}
function skPhoto(file) {
  const ph = $('skPh');
  SKF.photo = ''; SKF.raw = ''; SKF.hint = '';
  ph.innerHTML = 'Надсилаю фото…';
  $('skCam').textContent = '📷 Перезняти етикетку';
  SKF.busy = skShrink(file).then(data => {
    ph.innerHTML = '<img src="' + data + '" style="height:64px;border-radius:8px;vertical-align:middle;margin-right:8px">Розпізнаю етикетку…';
    const loc = SKD.loc ? SKD.loc.code : ($('skLoc') ? $('skLoc').value.split(' ')[0] : '');
    return post('skladPhoto', { code: CODE, loc: loc, img: data.split(',')[1] }).then(r => {
      SKF.photo = r.photo; SKF.raw = r.raw || '';
      const img = '<img src="' + data + '" style="height:64px;border-radius:8px;vertical-align:middle;margin-right:8px">';
      if (r.fields) { skFill(r.fields); ph.innerHTML = img + '✓ Розпізнано — перевірте поля й впишіть, скільки взяли'; }
      else ph.innerHTML = img + 'Фото збережено, але розпізнати не вдалось — заповніть поля вручну' +
        (SKD.me.role === 'адміністратор' ? '<br><span style="color:#9B231A">' + esc(r.recError || '') + '</span>' : '');
    });
  }).catch(e => { ph.innerHTML = '<span style="color:#9B231A">' + esc(e.message) + '</span> — можна записати без фото'; })
    .then(() => { SKF.busy = null; });
}
/** Заповнити з етикетки лише порожні поля — що людина вже вписала, не чіпаємо */
function skFill(f) {
  const set = (id, v) => { const el = $(id); if (el && v && !el.value) el.value = v; };
  if (f.position && !$('skPos').value) { $('skPos').value = f.position; $('skPos').onchange(); }
  set('skTyp', f.typ);
  set('skDet', [f.details, f.article ? 'арт. ' + f.article : '', f.supplier].filter(x => x).join(' · ').slice(0, 120));
  set('skLot', f.lot);
  const u = { 'pcs': 'шт', 'pc': 'шт', 'шт': 'шт', 'шт.': 'шт', 'm': 'м', 'м': 'м', 'kg': 'кг', 'кг': 'кг', 'g': 'г', 'г': 'г' }[String(f.unit || '').toLowerCase()];
  if (u && !SKF.unitTouched && SKD.units.indexOf(u) >= 0) $('skUnit').value = u;
  if (f.qty_in_box) { SKF.hint = f.qty_in_box + (f.unit ? ' ' + f.unit : ''); skShowSum(); }
}
function skSave() {
  const btn = $('skGo'); if (btn.disabled) return;
  $('err').textContent = '';
  const n = skCalc($('skQty').value);
  if (!$('skQty').value || isNaN(n) || !(n > 0)) { $('err').textContent = 'Вкажіть кількість (число або 1+2+5)'; return; }
  btn.disabled = true; btn._t = btn.textContent; btn.textContent = SKF.busy ? 'Чекаю фото…' : 'Зберігаю…';
  const go = () => {
    btn.textContent = 'Зберігаю…';
    const act = (document.querySelector('input[name=skAct]:checked') || {}).value;
    const loc = SKD.loc ? SKD.loc.code : ($('skLoc').value || '').split(' ')[0];
    return post('skladSave', { code: CODE, loc: loc, act: act, pos: $('skPos').value, posOther: $('skOther').value, typ: $('skTyp').value,
      det: $('skDet').value, qty: $('skQty').value, unit: $('skUnit').value, lot: $('skLot').value, mlp: $('skMlp').value,
      comment: $('skCm').value, photo: SKF.photo, raw: SKF.raw }).then(r => {
      btn.disabled = false; btn.textContent = btn._t;
      toast(r.msg || 'Записано');
      SKD.my = r.my || SKD.my;
      SKF = { photo: '', raw: '', busy: null };
      ['skPos', 'skOther', 'skTyp', 'skDet', 'skQty', 'skLot', 'skMlp', 'skCm'].forEach(id => { if ($(id)) $(id).value = ''; });
      $('skOtherBox').style.display = 'none'; $('skSum').innerHTML = '';
      if ($('skPh')) { $('skPh').innerHTML = ''; $('skCam').textContent = '📷 Сфотографувати етикетку'; }
      $('skUnit').value = 'шт';
      renderSkMy(); window.scrollTo(0, 0);
    });
  };
  (SKF.busy || Promise.resolve()).then(go).catch(e => {
    btn.disabled = false; btn.textContent = btn._t;
    const m = String(e.message || e).replace(/^Error:\s*/, ''); $('err').textContent = m; toast(m, true);
  });
}
function renderSkMy() {
  const my = SKD.my || [];
  const box = $('skMy'); if (!box) return;
  box.innerHTML = '<details' + (my.length ? ' open' : '') + '><summary>Мої видачі за 30 днів (' + my.filter(x => !x.cancelled).length + ')</summary><div class="list">' +
    (my.length ? my.map(x => '<div class="li"><div class="' + (x.cancelled ? 'x' : '') + '">' +
      (x.act === 'повернув' ? '<span class="pill warn" style="margin:0 6px 0 0">повернув</span>' : '') +
      '<b>' + esc(x.pos) + (x.typ ? ' ' + esc(x.typ) : '') + '</b> — ' + esc(skNum(x.qty)) + ' ' + esc(x.unit) +
      '<br><span class="muted">' + esc(x.loc) + (x.det ? ' · ' + esc(x.det) : '') + (x.lot ? ' · партія ' + esc(x.lot) : '') + (x.mlp ? ' · ' + esc(x.mlp) : '') +
      (x.photo ? ' · 📷' : '') + (x.cancelled ? ' · скасовано' : '') + '</span></div>' +
      '<div class="r muted">' + esc(x.time.slice(0, 5)) + '<br>' + esc(x.time.slice(6)) +
      (x.canCancel ? '<br><button class="ic" onclick="skCancel(\'' + esc(x.id) + '\')">✖</button>' : '') + '</div></div>').join('')
      : '<p class="muted">Записів ще немає.</p>') + '</div></details>';
}
function skCancel(id) {
  confirmBox('Скасувати запис ' + id + '?', () => {
    busy(true);
    google.script.run.withSuccessHandler(r => { busy(false); toast(r.msg); SKD.my = r.my; renderSkMy(); })
      .withFailureHandler(e => { busy(false); toast(e.message, true); }).apiSkladCancel({ code: CODE, id: id });
  });
}

$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
load();
</script>
