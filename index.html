     кількістю й ящиками етикетки вдруге не надсилає (labelsSent). Етикетки — термопринтер 100 × 100 мм (Labels.gs v5): у «✉ Етикетки ще раз» немає позиції на аркуші.
     Сканер читає й штрихкоди (Code 128 / GS1-128 з етикетки ящика → картка партії): BarcodeDetector, де вміє; інакше ZXing (@zxing/library).
     v44 · 20.10.2026 — «+ Статори / ротори» у партії двигунів: третій варіант «Двигуни» — скручені двигуни з резерву, що пройшли F3
     (запит addComp, comp = двигун, Code.gs v49): кількість, коментар необов'язковий, підказка про типорозмір і KV партії.
     v43 · 20.10.2026 — склад: зав. складу виправляє (✎) і скасовує (✖) будь-який запис зі списку «Усі записи» з причиною (запит skladEdit, Sklad.gs v6);
     пошук у списку (ім'я, позиція, ID, партія); у записах видно «виправлено → ВД-…», хто й чому змінив.
     v42 · 19.10.2026 — «Нова партія» з «Почати з кроку»: тімлід додає 1–3 фото паперового листа попередніх кроків (необов'язково, без розпізнавання; запит histPhoto), на картці партії — «📄 Фото попередніх кроків» і позначка «історія не внесена». S2 до закриття S1 — правило сервера (Code.gs v46). v41 · 18.10.2026 — прибрано старий «Мій виробіток» (Р-3а, вкладки) і старі фільтри «Стан зараз» (DF, chips, dset, dsel, hbars) — етап 8. v40 · 18.10.2026 — Р-9 «Контроль» за прототипом звітів v19 (етап 7): фільтри (що, локація, поверх, хто виправив / вніс, працівник), картки (виправлень і % від записів кроків, скасувань і з них самим працівником, за працівника і з них минулою датою, хто вносить найбільше), графік у часі, за поверхами, хто виправляє / вносить, журнал «було → стало», звірка ЖЗР ↔ вечірня форма (тиждень, тільки розбіжності, > 2 % — червоним, «немає у формі / в ЖЗР», незіставлені види робіт). v39 · 18.10.2026 — Р-7 «Аналіз партій» за прототипом звітів v19 (етап 6): фільтри (вид, типорозмір, KV, версія, локація, колір, статус), картки (партій, у роботі, без руху → список, пройшли маршрут, час проходження, вихід придатних), «Пройшли маршрут» за періодами, середній час проходження, «Де партії чекають», таблиця партій із сортуванням; картка партії (шлях за кроками, «!» простій, записи, 🕘 Повна історія). У звітах номер партії веде на картку Р-7 (кому Р-7 доступний), інакше — на сторінку партії. v38 · 18.10.2026 — Р-8 «Виробіток» і Р-10 «Аналіз браку» за прототипом звітів v19 (етап 5): період і деталізація, фільтри з мультивибором і пошуком, чипи обраного, перехресний вибір (графік, легенда, рейтинги, матриця), картки, графік у часі (розріз, наростаючим, лінія % браку), рейтинги, брак за причинами, операції за поверхами, матриця з рівнями і CSV; 🔖 «Випуск для бухгалтерії»; тімлід — свій поверх за замовчуванням; бухгалтер — тільки випуск двигунів; примітка про історію до LIVE_FROM. v37 · 18.10.2026 — «оновити» у звітах рахує заново (Р-2 інакше — кеш сервера 60 с, Reports.gs v17); Кабінет зав. виробництва й адміністратора: «Підсумки для звітів» — коли пораховано, «Перерахувати зараз» (етап 4). v36 · 18.10.2026 — «Звіти»: пункт «Р-8с · Мій виробіток 👁» для тімліда, зав. виробництва, адміністратора (перегляд як працівник, Р-0_08). v35 · 18.10.2026 — Р-8с «Мій виробіток» за прототипом звітів v19 (етап 3): день / тиждень / місяць, ‹ ›, календар, «Сьогодні»; картки «Успішних операцій» і «За моїми цінами»; графік за годинами / днями з розрізом, шт / ₴ і лінією % браку; «Роботи й записи» з групуванням кроки / партії / дні; калькулятор ₴ (ціни тільки на пристрої); робота без партії; порожній період — «останній день із записами». 👁 «як працівник»: тімлід, зав. виробництва, адміністратор — будь-який працівник, тільки перегляд (С-29); 👁 у кабінеті біля людей сьогодні. Специфікація: MLP_specyfikacija, аркуш «21. Прототип» -->

<script>
const PAGE_VERSION = 'index.html v45 · 20.10.2026';
const API = 'https://script.google.com/macros/s/AKfycbx-JUajnAtVsxaLHDgwRpfzE12g4LUtlf6JnWYAQScAVZ5FCpxzGHSrA5PDESqP80KD/exec';
window.STATIC_SELF = location.origin + location.pathname;
const PARAMS = Object.fromEntries(new URLSearchParams(location.search));
var google = { script: { get run() {
  let ok = () => {}, fail = () => {};
  const call = (api, q) => fetch(API + '?api=' + api + '&q=' + encodeURIComponent(JSON.stringify(q)), { credentials: 'omit', redirect: 'follow' })
    .then(r => r.json()).then(j => j.ok ? ok(j.data) : fail({ message: j.error }))

    apiPage(q) { call('page', q); }, apiAct(q) { call('act', q); }, apiApprove(q) { call('approve', q); }, apiCabinet(q) { call('cabinet', q); }, apiDash(q) { call('dash', q); }, apiHistory(q) { call('hist', q); },
    apiSkladPage(q) { call('skladPage', q); }, apiSkladCancel(q) { call('skladCancel', q); }, apiPeek(q) { call('peek', q); } };
  return o;
} } };
/** v9: POST — для великих запитів (фото). text/plain, щоб не було попереднього запиту CORS. */
function post(api, q) {
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: api, q: q }), credentials: 'omit', redirect: 'follow' })
    .then(r => r.json(), () => { throw new Error('Немає зв\'язку з сервером. Перевірте інтернет і спробуйте ще раз.'); })
    .then(j => { if (!j.ok) throw new Error(j.error); return j.data; });
}
let S = {};           // дані сторінки
let CODE = store('mlp_code');

function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k) || ''; if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }
  catch (e) { return ''; }
}
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function $(id) { return document.getElementById(id); }
function toast(msg, bad) { const t = $('toast'); t.textContent = msg; t.style.background = bad ? '#B3261E' : '#1F7A4D'; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', bad ? 6000 : 3500); }
function closeModal() { $('modal').style.display = 'none'; }
function openModal(html) { $('sheet').innerHTML = html; $('modal').style.display = 'flex'; }
function link(q) { return (window.STATIC_SELF || S.webapp || '') + '?' + q; }

function load(extra) {
  navRender();
  if (PARAMS.approve) return loadApprove();
  if (PARAMS.r && CODE) return renderReports();   // v33: список звітів ролі (вкладка «Звіти» на телефоні)
  if (PARAMS.cab && CODE) return loadCabinet();   // без коду телефону — звичайний шлях: екран реєстрації
  if (PARAMS.d && CODE) return loadDash();
  if (PARAMS.h && CODE) return loadHistory();
  if ((PARAMS.s || PARAMS.sklad) && CODE) return loadSklad();
  loadPage(extra);
}
function loadPage(extra) {
  // v12: телефон ще без коду, але форму вже надсилали з цього браузера — перевіряємо код, що чекає (mlp_pending)
  const pend = CODE ? '' : store('mlp_pending');
  const q = Object.assign({}, PARAMS, { code: CODE || pend });
  if (!CODE) q.rg = regDiag('відкриття', pend);
  google.script.run.withSuccessHandler(d => { if (!CODE && pend && d.me) return regDone(pend, d); if (CODE && !d.me) forgetCode(); S = d; render(extra || {}); })
    .withFailureHandler(e => { $('app').innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; })
    .apiPage(q);
}

/** Яку сторінку показати після дії: сервер повертає її в тій самій відповіді (v3 — без другого звернення) */
function viewParams() { const v = {}; ['t', 'b'].forEach(k => { if (PARAMS[k]) v[k] = PARAMS[k]; }); return v; }
/** Для адміністратора: сервер усього (старт · черга · читання · запис · сторінка) / разом із мережею */
function timing(r, total) {
  const p = r.parts || {}; const d = (a, b) => sec(Math.max(0, (p[a] || 0) - (b ? p[b] || 0 : 0)));
  return 'сервер ' + sec(r.ms) + (p.page !== undefined ? ' (старт ' + d('who') + ' · черга ' + d('lock', 'who') + ' · читання ' + d('read', 'lock') +
    ' · запис ' + d('write', 'read') + ' · сторінка ' + d('page', 'write') + ')' : '') + ' / разом ' + sec(total);
}
function sec(ms) { return (ms / 1000).toFixed(1).replace('.', ',') + ' с'; }
function showPage(r, extra) { if (r && r.page) { S = r.page; render(extra || {}); } else load(extra); }
function setUrl() { try { const q = new URLSearchParams(PARAMS).toString(); history.replaceState(null, '', location.pathname + (q ? '?' + q : '')); } catch (e) { } }

/** v7: дія без своєї кнопки (після «Так» у підтвердженні: ↩ назад, ✖ свій запис) — плашка «Зберігаю…» внизу,
 *  поки сервер не відповів; повторне натискання в цей час нічого не робить */
let BUSY = false;
function busy(on) {
  BUSY = on; const t = $('toast');
  if (on) { clearTimeout(t._h); t.textContent = 'Зберігаю…'; t.style.background = '#2F4858'; t.style.display = 'block'; }
  else if (t.textContent === 'Зберігаю…') t.style.display = 'none';
}
function act(payload, btn, after) {
  const t0 = Date.now();
  if (!btn && BUSY) return;
  if (btn) { btn.disabled = true; btn._t = btn.textContent; btn.textContent = 'Зберігаю…'; } else busy(true);
  payload.code = CODE;
  if (payload.view === undefined) payload.view = viewParams();
  google.script.run.withSuccessHandler(r => {
    if (btn) { btn.disabled = false; btn.textContent = btn._t; } else busy(false);
    if (r && r.warn) { confirmBox(r.warn, () => { payload.force = true; act(payload, btn, after); }); return; }
    closeModal();
    let msg = r.msg || 'Готово';
    // адміністратору — час запису: сервер / разом із мережею (перевірка швидкості під час тестів)
    if (S.me && S.me.role === 'адміністратор' && r.ms !== undefined) msg += ' · ' + timing(r, Date.now() - t0);
    toast(msg, !!r.alert);   // v13: напр. «⚠ Етикетки не надіслано» — червоним
    if (r.showBatch) { PARAMS.b = r.showBatch; delete PARAMS.t; setUrl(); }   // v13: після останнього K2 — картка партії, а не вільна тара
    if (after) after(r); else showPage(r, {});
  }).withFailureHandler(e => {
    if (btn) { btn.disabled = false; btn.textContent = btn._t; } else busy(false);
    const m = String(e.message || e).replace(/^Error:\s*/, '');
    const box = $('err'); const inModal = $('modal').style.display === 'flex';
    if (box && !inModal) box.textContent = m;
    const mb = $('merr'); if (mb && inModal) mb.textContent = m;
    // v16: повідомлення один раз — у формі; червона смужка внизу лише коли поля для помилки немає
    if (!((box && !inModal) || (mb && inModal))) toast(m, true);
  }).apiAct(payload);
}

function confirmBox(text, yes) {
  openModal('<div class="card"><div class="mid">' + esc(text) + '</div><div class="grid" style="margin-top:16px">' +
    '<button class="btn btn2" onclick="closeModal()">Ні</button><button class="btn" id="yesb">Так</button></div></div>');
  $('yesb').onclick = () => { closeModal(); yes(); };
}

function numInput(id, val) {
  return '<div class="num"><button type="button" onclick="bump(\'' + id + '\',-1)">−</button>' +
    '<input type="number" inputmode="numeric" pattern="[0-9]*" id="' + id + '" value="' + esc(val) + '">' +
    '<button type="button" onclick="bump(\'' + id + '\',1)">+</button></div>';
}
function bump(id, d) { const i = $(id); i.value = Math.max(0, (Number(i.value) || 0) + d); i.dispatchEvent(new Event('input')); }
function opts(list, sel, ph) { return (ph ? '<option value="">' + esc(ph) + '</option>' : '') + list.map(x => '<option' + (String(x) === String(sel) ? ' selected' : '') + '>' + esc(x) + '</option>').join(''); }
/** v18: тімлід — «Хто виконав» і «Дата» (Code.gs v21: a.who, a.at). Вибір тримається в ONB, поки сторінка відкрита (дооформлення кількох кроків поспіль) */
let ONB = { who: '', date: '', time: '' };

function onbHtml() {
  if (!S.perms || !S.perms.onBehalf || !S.people) return '';
  const n = S.retroDays || 30; const now = new Date();
  if (ONB.who && !S.people.some(x => x.id === ONB.who)) ONB.who = '';
  const me = S.me ? S.me.name : 'я';
  return '<div class="onb' + (ONB.who || ONB.date ? ' on' : '') + '" id="onb">' +
    '<label>Хто виконав</label><select id="onbWho"><option value="">Я — ' + esc(me) + '</option>' +
    S.people.filter(x => !S.me || x.id !== S.me.id).map(x => '<option value="' + esc(x.id) + '"' + (x.id === ONB.who ? ' selected' : '') + '>' + esc(x.name) + (x.site ? ' · ' + esc(x.site) : '') + '</option>').join('') + '</select>' +
    '<label>Дата, якщо не сьогодні (до ' + n + ' дн. назад)</label><div class="row"><div><input type="date" id="onbDate" value="' + esc(ONB.date) + '" min="' + ymd(new Date(now.getTime() - n * 86400000)) + '" max="' + ymd(now) + '"></div>' +
    '<div style="flex:.7"><input type="time" id="onbTime" value="' + esc(ONB.time) + '"></div></div>' +
    '<div class="muted" id="onbNote" style="margin-top:6px"></div></div>';

function onbWire() {
  if (!$('onb')) return;
  const upd = () => {
    ONB = { who: $('onbWho').value, date: $('onbDate').value, time: $('onbDate').value ? $('onbTime').value : '' };
    const p = ONB.who ? S.people.find(x => x.id === ONB.who) : null;
    const today = ONB.date === ymd(new Date()) && !ONB.time;   // сьогодні без часу — те саме, що «зараз»
    $('onb').className = 'onb' + (ONB.who || (ONB.date && !today) ? ' on' : '');
    $('onbNote').innerHTML = (p ? 'Записуєте <b>за ' + esc(p.name) + '</b>' : 'Записуєте за себе') +
      (ONB.date && !today ? ' · дата <b>' + esc(ONB.date.split('-').reverse().join('.')) + (ONB.time ? ' ' + esc(ONB.time) : '') + '</b>' : ' · сьогодні') +
      (ONB.who || ONB.date ? ' · <a class="lnk" href="#" id="onbReset">скинути</a>' : '');
    if ($('onbReset')) $('onbReset').onclick = e => { e.preventDefault(); $('onbWho').value = ''; $('onbDate').value = ''; $('onbTime').value = ''; upd(); };
  };

}
function onbVal() { return $('onb') ? { who: ONB.who, at: ONB.date ? ONB.date + (ONB.time ? 'T' + ONB.time : '') : '' } : {}; }

function tarePicker(id, types) {
  return '<div class="row"><select id="' + id + 't" style="flex:0 0 38%">' + opts(types) + '</select>' +
    '<input type="number" inputmode="numeric" id="' + id + 'n" placeholder="номер"></div>';
}

// =============================================================== RENDER
function render(extra) {
  const me = S.me;
  if (me && !me.unknown && S.perms) navSave(me, S.perms);
  $('who').innerHTML = me ? whoHtml(me, S.perms, me.unknown) : '';
  if (S.error) { $('app').innerHTML = '<div class="card err">' + esc(S.error) + '</div>'; return; }
  if (!me) { document.body.classList.add('nonav'); setView('', 'Реєстрація', ''); return renderReg(); }
  if (S.pending) {

    // v17: форму надіслали з іншого браузера / після повторного сканування — код є в надісланій формі (і в листі-копії відповіді)
    '<details><summary>Форму вже надіслали з іншої вкладки?</summary><div style="padding:0 16px 16px"><p class="muted">Впишіть код телефону з надісланої форми — сторінка перевірить його.</p>' +
    '<div class="row"><input type="text" id="regCode" autocapitalize="characters" placeholder="напр. K7QXA3F9"><button class="btn btn2" id="regUse" style="flex:0 0 40%;margin:0">Перевірити</button></div>' +
    '<div class="err" id="err2"></div></div></details>';
  $('regf').onclick = () => regWatch();
  $('chk').onclick = () => regCheck(true);
  $('regUse').onclick = () => {
    const c = $('regCode').value.trim().toUpperCase().replace(/\s+/g, ''); if (!c) return;
    $('regUse').disabled = true;
    google.script.run.withSuccessHandler(d => {
      $('regUse').disabled = false;
      if (d.me) { REG.pend = c; return regDone(c, d); }
      $('err2').textContent = 'Код ' + c + ' не знайдено. Перевірте, чи форму надіслано, і спробуйте за хвилину.';
    }).withFailureHandler(e => { $('regUse').disabled = false; $('err2').textContent = e.message; })
      .apiPage(Object.assign({}, PARAMS, { code: c, rg: regDiag('свій код', c) }));
  };
}

/** v16: «Робота без партії». Один QR на всі поверхи (?nb=1) — дільниця у формі, необов'язково: за замовчуванням — дільниця працівника,
 *  «Різні / не вказувати» — робота на кількох дільницях. Старі плакати ?p=П2 підставляють свою дільницю. Останній вибір пам'ятає телефон. */

function renderNew() {

/** v21: вибір кольору партії (необов'язково). stream — ST / RT, cur — поточний */
function colorField(id, stream, cur) {

function drawNew() {
  const r = document.querySelector('input[name=st]:checked'); const st = r ? r.value : '';

  if (st === 'MT') h += compBlock('S', 'nS', true) + compBlock('R', 'nR', true) +

  else {
    if (st === 'RT') h += '<label>Походження</label><div class="seg wrap"><label><input type="radio" name="org" value="" checked><span style="font-size:15px">Наші · з R1</span></label>' +
      '<label><input type="radio" name="org" value="v1"><span style="font-size:15px">Покупні в1 · одразу на ' + esc(S.v1Start || 'F4') + '</span></label></div>';   // v27
    h += lotField('lot', 'Партія постачальника (якщо є)') + '<label>Кількість на старті</label>' + numInput('qty', qty);   // v17: + 📷 етикетки
    if (S.perms.startAt) h += '<div id="satW"><label>Почати з кроку</label><select id="sat"></select>' +   // v27: тімлід — партія з переробки тощо
      (S.perms.histPhoto ? '<div id="hpW" style="display:none">' + histField() + '</div>' : '') + '</div>';   // v42: фото паперового листа попередніх кроків
    h += '<label id="ncmL">Коментар <span class="muted">(необов\'язково)</span></label><input type="text" id="ncm">';
  }
  if (st === 'RT') h += colorField('ncl', 'RT', '');   // v21: колір роторів — необов'язково
  h += '<button class="btn" id="go">Створити партію</button>';
  $('nf').innerHTML = h;
  LOTF_reset(); HP_reset();
  if (st === 'MT') {
    const ctx = () => ({ typ: $('typ').value, kv: $('kv') ? $('kv').value : '' });
    wireComp('S', 'nS', ctx, qty); wireComp('R', 'nR', ctx, qty);
    ['typ', 'kv'].forEach(id => $(id) && ($(id).onchange = () => { compRedraw('S', 'nS'); compRedraw('R', 'nR'); }));
  } else {
    wireLot('lot', {}); histWire();   // v42
    // v27: «Почати з кроку» — маршрут обраного типорозміру; «Покупні в1» — крок задає система
    const satDraw = () => {
      const v1 = !!document.querySelector('input[name=org][value=v1]:checked');
      if ($('satW')) {
        const r = (S.routesNew || {})[st + '|' + $('typ').value] || [];
        $('satW').style.display = v1 || !r.length ? 'none' : 'block';
        $('sat').innerHTML = r.map((x, k) => '<option value="' + (k ? esc(x[0]) : '') + '">' + esc(x[0] + ' · ' + x[1]) + (k ? '' : ' — з початку') + '</option>').join('');
      }
      satHint();

    const satHint = () => {
      const need = $('sat') && $('sat').value && $('satW').style.display !== 'none';
      if ($('hpW')) $('hpW').style.display = need ? 'block' : 'none';
      $('ncmL').innerHTML = 'Коментар ' + (need ? '<span class="muted">(обов\'язково: чому не з першого кроку, напр. «з переробки»)</span>' : '<span class="muted">(необов\'язково)</span>');
    };
    $('typ').onchange = satDraw; if ($('sat')) $('sat').onchange = satHint;
    document.querySelectorAll('input[name=org]').forEach(x => x.onchange = satDraw);
    satDraw();
  }
  $('go').onclick = () => {
    const a = { action: 'newBatch', tare: S.tare.code, stream: st, typ: $('typ').value, kv: $('kv') ? $('kv').value : '' };
    if (st === 'MT') {
      if (!compSrc('nS') || !compSrc('nR')) { $('err').textContent = 'Оберіть, звідки статори і звідки ротори (або «Пізніше»)'; return; }
    }
    $('go').disabled = true;
    Promise.all([lotWait(), histWait()]).then(() => {
      $('go').disabled = false;
      if (st === 'MT') a.comps = { S: compVal('S', 'nS'), R: compVal('R', 'nR') };
      else {
        const l = lotVal('lot'); a.qty = $('qty').value; a.lot = l.lot; a.photo = l.photo; if ($('ncl')) a.color = $('ncl').value;
        const org = document.querySelector('input[name=org]:checked'); if (org && org.value) a.origin = org.value;   // v27
        if ($('sat') && !a.origin && $('sat').value) a.startAt = $('sat').value;
        if (a.startAt) { const ids = HP.filter(x => x.id).map(x => x.id); if (ids.length) a.histPhotos = ids; }   // v42
        a.comment = $('ncm').value.trim();
        if (a.startAt && !a.comment) { $('err').textContent = 'Коментар обов\'язковий: чому партія починається з ' + a.startAt; return; }
      }
      act(a, $('go'));
    });
  };
}

// ---- v17: звідки статори / ротори (форма «Нова партія» MT і «+ Статори / ротори» на картці MT): в1 · в2 · пізніше
// в1 — від постачальника: номер партії (необов'язково, + 📷 етикетки); порожньо — «в1 без номера».
// в2 — наша партія ST / RT зі списку готових (номер і тара); «без номера» — старий запас без партії.
const SRC_OPTS = [['v1', 'в1 · постачальник'], ['v2', 'в2 · наша партія'], ['later', 'Пізніше']];
const CMP = {};   // p → { k, ctx, defQty }
function compBlock(k, p, withLater) {
  const nm = k === 'S' ? 'Статори' : 'Ротори';
  return '<div style="margin-top:14px;padding:12px;border:1px solid #DCE3E8;border-radius:12px;background:#F7F9FB">' +
    '<div class="mid">' + nm + '</div><label>Звідки</label><div class="seg wrap">' +
    SRC_OPTS.filter(o => withLater || o[0] !== 'later').map(o => '<label><input type="radio" name="' + p + 'src" value="' + o[0] + '"><span style="font-size:15px">' + o[1] + '</span></label>').join('') + '</div>' +
    '<div id="' + p + 'x"></div></div>';
}
function compSrc(p) { const x = document.querySelector('input[name=' + p + 'src]:checked'); return x ? x.value : ''; }
/** Готові партії ST / RT для в2 — того самого типорозміру і KV, що й партія двигунів (сервер ще раз перевіряє при записі) */
function readyFor(k, c) {
  const s = k === 'S' ? 'ST' : 'RT';
  return (S.ready || []).filter(r => r.s === s && r.typ === String(c.typ || '') && (!c.kv || !r.kv || r.kv === String(c.kv)));
}
function compCtx(p) { const c = CMP[p].ctx(); return c.batch ? { typ: S.batch.info['Типорозмір'], kv: S.batch.info['KV'] } : c; }
/** Поля під обраним джерелом; ctx() — { typ, kv } нової партії або { batch } картки MT */
function wireComp(k, p, ctx, defQty) {
  CMP[p] = { k: k, ctx: ctx, defQty: defQty };
  document.querySelectorAll('input[name=' + p + 'src]').forEach(x => x.onchange = () => compRedraw(k, p));
}
function compRedraw(k, p) {
  const src = compSrc(p); const box = $(p + 'x'); if (!box || !CMP[p]) return;
  const st = k === 'S' ? 'ST' : 'RT';
  let h = '';
  if (src === 'v1') h = lotField(p + 'lot', 'Номер партії постачальника') + '<p class="muted" style="margin:6px 0 0">Немає номера — залиште порожнім: запишеться «в1 без номера».</p>';
  if (src === 'v2') {
    const c = compCtx(p); const list = readyFor(k, c);
    const tr = r => r.tare ? r.tare + (r.tare2 ? ' + ' + r.tare2 : '') : 'без тари';
    h = '<label>Тара або номер партії ' + st + '</label><select id="' + p + 'sel"><option value="">— без номера (старий запас) —</option>' +
      list.map(r => '<option value="' + esc(r.no) + '">' + esc(tr(r) + ' · ' + r.no + (r.kv ? ' · KV ' + r.kv : '') + ' · ' + r.qty + ' шт') + '</option>').join('') + '</select>' +
      '<div id="' + p + 'info" class="muted" style="margin-top:6px;min-height:18px">' + (list.length ? 'Лише готові партії ' + esc(st + ' ' + (c.typ || '')) + (c.kv ? ' KV ' + esc(c.kv) : '') + '.'
        : 'Готових партій ' + esc(st + ' ' + (c.typ || '')) + (c.kv ? ' KV ' + esc(c.kv) : '') + ' немає — «без номера» або «Пізніше».') + '</div>';
  }
  if (src === 'later') h = '<p class="muted" style="margin:8px 0 0">Додасте потім: «+ Статори / ротори» на картці цієї партії двигунів.</p>';
  if (src && src !== 'later') h += '<label>Скільки, шт</label>' + numInput(p + 'q', src === 'v2' ? '' : (CMP[p].defQty || ''));
  box.innerHTML = h;
  if (src === 'v1') wireLot(p + 'lot', CMP[p].ctx().batch ? { batch: CMP[p].ctx().batch } : {});
  if (src === 'v2') $(p + 'sel').onchange = () => {
    const r = (S.ready || []).find(x => x.no === $(p + 'sel').value);
    if (r) $(p + 'q').value = r.qty;
  };
}
/** Значення для сервера: в1 з номером → lot, без → v1; в2 зі списку → batch (ref = номер), без → v2 */
function compVal(k, p) {
  const src = compSrc(p); const q = $(p + 'q') ? $(p + 'q').value : '';
  if (src === 'v1') { const l = lotVal(p + 'lot'); return { src: l.lot ? 'lot' : 'v1', lot: l.lot, photo: l.photo, qty: q }; }
  if (src === 'v2') { const no = $(p + 'sel') ? $(p + 'sel').value : ''; return { src: no ? 'batch' : 'v2', ref: no, qty: q }; }
  return { src: src };
}

// ---- v17: партія постачальника + фото етикетки (розпізнавання номера партії, той самий сервіс, що й на складі)
let LOTF = {};
function LOTF_reset() { LOTF = {}; }
function lotField(id, label) {
  return '<label>' + esc(label || 'Партія постачальника') + ' <span class="muted">(необов\'язково)</span></label>' +
    '<div class="row" style="align-items:center"><input type="text" id="' + id + '" placeholder="номер з етикетки">' +
    '<button type="button" class="ic" id="' + id + 'Cam" style="flex:0 0 58px;font-size:22px;padding:10px 0;margin:0" title="Фото етикетки">📷</button></div>' +
    '<input type="file" accept="image/*" capture="environment" id="' + id + 'File" style="display:none"><div id="' + id + 'Ph" class="muted" style="margin-top:6px"></div>';
}
function wireLot(id, extra) {
  LOTF[id] = { photo: '', busy: null };
  if (!$(id + 'Cam')) return;
  $(id + 'Cam').onclick = () => $(id + 'File').click();
  $(id + 'File').onchange = e => { const f = e.target.files && e.target.files[0]; if (f) lotPhoto(id, f, extra); e.target.value = ''; };
}
function lotPhoto(id, file, extra) {
  const ph = $(id + 'Ph'); const st = LOTF[id] = { photo: '', busy: null };
  ph.innerHTML = 'Надсилаю фото…';
  st.busy = skShrink(file).then(data => {
    const img = '<img src="' + data + '" style="height:56px;border-radius:8px;vertical-align:middle;margin-right:8px">';
    ph.innerHTML = img + 'Розпізнаю номер партії…';
    return post('lotPhoto', Object.assign({ code: CODE, img: data.split(',')[1] }, extra || {})).then(r => {
      st.photo = r.photo;
      const lot = (r.fields && r.fields.lot) || '';
      if (lot && $(id) && !$(id).value) $(id).value = lot;
      if ($(id + 'Ph')) $(id + 'Ph').innerHTML = img + (lot ? '✓ Номер з етикетки: <b>' + esc(lot) + '</b> — перевірте' : 'Фото збережено, номер не розпізнано — впишіть вручну');
    });
  }).catch(e => { if ($(id + 'Ph')) $(id + 'Ph').innerHTML = '<span style="color:#9B231A">' + esc(e.message) + '</span> — можна записати без фото'; })
    .then(() => { st.busy = null; });
}
function lotVal(id) { return { lot: $(id) ? $(id).value.trim() : '', photo: (LOTF[id] || {}).photo || '' }; }
/** Дочекатися фото, що ще надсилається (щоб запис отримав посилання на нього) */
function lotWait() { return Promise.all(Object.keys(LOTF).map(k => LOTF[k].busy).filter(Boolean)).catch(() => { }); }

// ---- v42: оцифрування партії, що вже на кроці X: фото паперового листа попередніх кроків (без розпізнавання, 1–3 фото).
// Кожне фото надсилається одразу (histPhoto → id файлу), «Створити партію» чекає, поки всі дійдуть, і передає id.
const HP_MAX = 3;
let HP = [];
function HP_reset() { HP = []; }
function histField() {
  return '<label>Фото паперового листа попередніх кроків <span class="muted">(необов\'язково)</span></label>' +
    '<button type="button" class="btn btn2" id="hpCam" style="margin-top:0">📷 Додати фото</button>' +
    '<input type="file" accept="image/*" capture="environment" id="hpFile" style="display:none">' +
    '<div id="hpList" class="muted" style="margin-top:6px"></div>' +
    '<p class="muted" style="margin:6px 0 0">Ми розпізнаємо його пізніше й внесемо попередні кроки — вам їх перевірити.</p>';
}
function histDraw() {
  if (!$('hpList')) return;
  $('hpList').innerHTML = HP.map((x, k) => '<div style="display:flex;align-items:center;gap:8px;margin-top:6px">' +
    (x.img ? '<img src="' + x.img + '" style="height:56px;border-radius:8px">' : '') +
    '<span style="flex:1">' + (x.err ? '<span style="color:#9B231A">' + esc(x.err) + '</span>' : x.id ? '✓ Фото ' + (k + 1) + ' збережено' : 'Надсилаю фото ' + (k + 1) + '…') + '</span>' +
    (x.busy ? '' : '<button type="button" class="ic" data-hp="' + k + '" style="flex:0 0 44px;margin:0">✖</button>') + '</div>').join('');
  document.querySelectorAll('[data-hp]').forEach(b => b.onclick = () => { HP.splice(Number(b.dataset.hp), 1); histDraw(); });
  if ($('hpCam')) { const n = HP.filter(x => !x.err).length; $('hpCam').style.display = n >= HP_MAX ? 'none' : 'block'; $('hpCam').textContent = n ? '📷 Ще фото (до ' + HP_MAX + ')' : '📷 Додати фото'; }
}
function histWire() {
  if (!$('hpCam')) return;
  $('hpCam').onclick = () => $('hpFile').click();
  $('hpFile').onchange = e => { const f = e.target.files && e.target.files[0]; if (f) histPhoto(f); e.target.value = ''; };
}
function histPhoto(file) {
  const x = { id: '', img: '', err: '', busy: null }; HP.push(x); histDraw();
  x.busy = skShrink(file).then(data => { x.img = data; histDraw(); return post('histPhoto', { code: CODE, img: data.split(',')[1] }); })
    .then(r => { x.id = r.photo; }, e => { x.err = e.message + ' — можна створити без фото'; })
    .then(() => { x.busy = null; HP = HP.filter(y => !y.err || y === x); histDraw(); });

/** v13: двигунів у ящику за замовчуванням (BOX_QTY з «Налаштувань», за типорозміром) */
function boxPer() { const m = (S.k2 && S.k2.box) || {}; return Number(m[String(S.batch.info['Типорозмір'])] || m['*'] || 200); }
/** Те саме правило, що й на сервері (Labels.gs): повні ящики по per, в останньому — решта; ящиків вписано інакше — порівну */
function labelsPlan(good, boxes, per) {
  if (good <= 0) return [];
  if (!(boxes > 0)) boxes = per > 0 ? Math.ceil(good / per) : 1;
  if (boxes > good) boxes = good;
  const out = [];
  if (per > 0 && (boxes - 1) * per < good && boxes * per >= good) { for (let i = 0; i < boxes - 1; i++) out.push(per); out.push(good - per * (boxes - 1)); return out; }
  const base = Math.floor(good / boxes), extra = good % boxes;
  for (let i = 0; i < boxes; i++) out.push(base + (i < extra ? 1 : 0));
  return out;
}
function labelsSummary(plan) {
  const g = []; plan.forEach(q => { const l = g[g.length - 1]; if (l && l.q === q) l.n++; else g.push({ q: q, n: 1 }); });
  return g.map(x => x.n + ' × ' + x.q + ' шт').join(' + ');
}

    FL.forEach(f => {
      const steps = R.filter(x => x[3] === f);
      if (!steps.length && !(f !== 'MT' && rq(f))) return;
      rows.push({ hd: { ST: 'Лінія статорів', RT: 'Лінія роторів', MT: 'Збирання двигунів' }[f] });
      const pool = inw0.filter(b => b.stream === f);
      steps.forEach(x => rows.push(stepRow(x, pool)));
      rows.push(endRow(f));
    });
  } else {
    const locs = D.loc === 'all' ? ['П', 'Ж'] : [D.loc];
    locs.forEach(L => {
      const pool = inw0.filter(b => locOf(b) === L);
      floorsAt(L).concat(['']).filter(f => !flOn || f === D.fl).forEach(f => {
        const steps = R0.filter(x => floorOf(L, x[0], tp) === f);
        const shown = f ? steps : steps.filter(x => pool.some(b => b.wait[x[0]]));   // без поверху — тільки кроки, де щось чекає
        if (!shown.length) return;
        rows.push({ hd: (locs.length > 1 ? LOCN[L] + ' · ' : '') + (f ? f + ' поверх' : 'поверх не вказано') });
        shown.forEach(x => rows.push(stepRow(x, pool)));
      });
    });
    const ends = FL.filter(k => k === 'MT' ? soldQ : rq(k));
    if (ends.length) { rows.push({ hd: 'Готово' }); ends.forEach(k => { const e = endRow(k); e.l = e.l.replace('✓ Готово', '✓ ' + FLOWN[k][0] + ' — готово'); rows.push(e); }); }
  }
  const any = rows.some(r => !r.hd);
  h += zFold('r2_04', 'Де зараз · за кроками', '', '<div class="muted" style="margin-bottom:8px">Скільки штук чекає кожен крок. Натисніть крок — решта покаже тільки його.</div>' +
    '<div class="zctl"><span>Вид:</span>' + zChips(D.view, [['proc', 'За процесами'], ['floor', 'За поверхами']], v => { D.view = v; renderDash(); }) + '</div>' +
    (any ? zBars(rows) : '<p class="muted">' + (D.loc === 'Ж' && D.flow !== 'MT' && D.flow !== 'all' ? 'На Жулянах ' + FLOWN[D.flow][1] + ' не виготовляють.' : 'За цими фільтрами партій немає.') + '</p>'));
  // Р-2_05 Партії в роботі
  const list = (D.only === 'stuck' ? stk : inw).slice().sort((a, b) => b.idle - a.idle || a.no.localeCompare(b.no));
  const shown = D.more ? list : list.slice(0, 15);
  h += zFold('r2_05', 'Партії в роботі', inw.length, '<div class="muted">' + (D.step ? 'Крок ' + esc(D.step) + ': ' : '') + inw.length + ' ' + PLR(inw.length) + ', з них без руху ' + stk.length + '</div>' +
    zChips(D.only, [['all', 'Усі'], ['stuck', 'Тільки без руху']], v => { D.only = v; D.more = false; renderDash(); }) +
    (list.length ? '<div class="tw" style="margin-top:10px"><table class="t"><tr><th>Партія</th><th>Тип · KV</th><th>Крок</th><th>Тара</th><th class="r">шт</th><th>Остання операція</th><th></th></tr>' +
      shown.map(b => '<tr><td>' + bl(b.no) + '</td><td>' + esc(b.typ) + (b.kv ? ' · ' + esc(b.kv) : '') + (b.color ? '<br><span class="muted">' + esc(b.color) + '</span>' : '') + '</td><td>' + esc(b.step || '—') +
        (b.purpose ? ' <span class="pill warn" style="margin:0">' + esc(b.purpose) + '</span>' : '') + '</td><td>' + tl(b.tare) + (b.tare2 ? ' + ' + esc(b.tare2) : '') + '</td><td class="r">' +
        fn(D.step ? b.wait[D.step] : b.rem) + '</td><td>' + esc(b.last || '—') + '</td><td>' + (b.stuck ? xmark('Без руху ' + b.idle + ' роб. дн. (' + d.idleDays + ' і більше)') : '') + '</td></tr>').join('') + '</table></div>' +
      (list.length > 15 ? '<button type="button" class="ic" style="margin-top:8px" onclick="zA(' + zAct(() => { D.more = !D.more; renderDash(); }) + ')">' + (D.more ? 'Згорнути' : 'Показати всі ' + list.length) + '</button>' : '')
      : '<p class="muted">Немає партій за цими фільтрами.</p>'));
  // Р-2_11 Партії завершені — статори й ротори в тарі
  const dks = ['ST', 'RT'].filter(flowOk);
  if (dks.length) {
    const dAll = [].concat(...dks.map(rdyB));
    const dl = [].concat(...dks.filter(k => D.donek === 'all' || D.donek === k).map(rdyB)).sort((a, b) => a.stream.localeCompare(b.stream) || b.idle - a.idle || a.no.localeCompare(b.no));
    h += zFold('r2_11', 'Партії завершені', dAll.length, '<div class="muted">' + dAll.length + ' ' + PLR(dAll.length) + ', ' + fn(dAll.reduce((a, b) => a + b.rem, 0)) + ' шт — пройшли маршрут, чекають збирання</div>' +
      (dks.length > 1 ? zChips(D.donek, [['all', 'Усі'], ['ST', 'Статори'], ['RT', 'Ротори']], v => { D.donek = v; renderDash(); }) : '') +
      (dl.length ? '<div class="tw" style="margin-top:10px"><table class="t"><tr><th>Партія</th><th>Тип · KV</th><th>Колір</th><th>Тара</th><th class="r">шт</th><th>Завершено</th><th></th></tr>' +
        dl.map(b => '<tr><td>' + bl(b.no) + '</td><td>' + esc(b.typ) + ' · ' + esc(b.kv || '—') + '</td><td>' + esc(b.color || '—') + '</td><td>' + tl(b.tare) + (b.tare2 ? ' + ' + esc(b.tare2) : '') + '</td><td class="r">' + fn(b.rem) +
          '</td><td>' + esc(b.last || '—') + '</td><td>' + (b.stuck ? xmark('Лежить без руху ' + b.idle + ' роб. дн. (' + d.idleDays + ' і більше)') : '') + '</td></tr>').join('') + '</table></div>' : '<p class="muted">Немає.</p>'));
  }
  return h;
}

// ---- Р-5 Аналіз тари
const Z5 = { loc: '', fl: 'all', more: false, open: false };
function r5() {
  const d = DB, D = Z5;
  if (!D.loc) D.loc = (d.me && d.me.site ? d.me.site.charAt(0) : '') || 'all';
  const set = (k, v) => { D[k] = v; if (k === 'loc') D.fl = 'all'; D.more = false; renderDash(); };
  const locOk = l => D.loc === 'all' || String(l || '').charAt(0) === D.loc;
  const gs = d.groups.filter(g => locOk(g.loc));
  d.busy.forEach(b => b.fl = b.next ? floorOf(String(b.loc || '').charAt(0), b.next, b.typ) : '');
  const flOn = D.loc !== 'all' && D.fl !== 'all';
  const busy = d.busy.filter(b => locOk(b.loc) && (!flOn || b.fl === D.fl));
  const stuck = busy.filter(b => b.idle >= d.idleDays);
  const tot = gs.reduce((a, g) => [a[0] + g.busy, a[1] + g.free, a[2] + g.out], [0, 0, 0]);
  const fls = D.loc !== 'all' ? floorsAt(D.loc) : [];
  let h = zFbar('r5', D.loc === 'all' ? 'усі локації' : LOCN[D.loc] + (D.fl !== 'all' ? ' · ' + D.fl + ' пов.' : ''), D.fl !== 'all' ? 1 : 0,
    zChips(D.loc, [['all', 'Усі'], ['П', 'Печерськ'], ['Ж', 'Жуляни']], v => set('loc', v)) + (fls.length ? zChips(D.fl, [['all', 'Усі поверхи']].concat(fls.map(f => [f, f + ' поверх'])), v => set('fl', v)) : ''));
  h += '<div class="zkpis">' + zKpi('Зайнята', fn(tot[0]), 'шт', pct(tot[0], tot[0] + tot[1] + tot[2]) + ' усієї тари') + zKpi('Вільна', fn(tot[1]), 'шт', tot[2] ? 'виведено: ' + tot[2] : '') +
    zKpi('Без руху', fn(stuck.length), 'шт тари', stuck.length ? (D.open ? 'сховати список ▴' : 'показати список ▾') : 'усе рухається', 'Тара, партія в якій без руху ' + d.idleDays + ' і більше робочих днів від останньої операції (ПВ-14).',
      stuck.length ? 'kbad' : '', stuck.length ? zAct(() => { D.open = !D.open; renderDash(); }) : undefined) + '</div>';
  const row = b => '<tr><td>' + tl(b.code) + (b.pair ? '<br><span class="muted">пара: ' + esc(b.pair) + '</span>' : '') + '</td><td>' + esc(b.fl || '—') + '</td><td>' + (b.batch ? bl(b.batch) : '—') + '</td><td>' + esc(b.step) + (b.next ? ' → ' + esc(b.next) : ' ✓') +
    '</td><td class="r">' + fn(b.qty) + '</td><td>' + esc(b.since) + '</td><td class="r">' + (b.idle >= d.idleDays ? '<span class="pill bad" style="margin:0">' + b.idle + '</span>' : b.idle) + '</td></tr>';
  const head = '<tr><th>Тара</th><th>Пов.</th><th>Партія</th><th>Крок</th><th class="r">шт</th><th>Зайнята з</th><th class="r">Без руху, роб. дн.</th></tr>';
  if (D.open && stuck.length) h += '<div class="card"><div class="mid">Тара без руху</div><div class="tw" style="margin-top:8px;max-height:480px"><table class="t">' + head + stuck.map(row).join('') + '</table></div></div>';
  const TN = { 'КР': 'КР · ящик', 'ПД': 'ПД · піддон печі', 'ТЧ': 'ТЧ · тачка', 'СК': 'СК · коробка зберігання' };
  h += '<div class="card"><div class="mid">Тара за типами й локаціями</div><div class="muted"><span style="color:#2F4858">■</span> зайнята · <span style="color:#C5D0D7">■</span> вільна · <span style="color:#66767F">■</span> виведена</div>' +
    '<div class="tw" style="margin-top:10px"><table class="t"><tr><th>Тип</th><th>Локація</th><th style="width:34%">Стан</th><th class="r">Зайнято</th><th class="r">Вільно</th></tr>' + gs.map(g => {
      const n = g.busy + g.free + g.out || 1;
      return '<tr><td><b>' + esc(TN[g.type] || g.type) + '</b></td><td>' + esc(LOCN[String(g.loc).charAt(0)] || g.loc) + '</td><td><div class="sp"><i style="display:block;width:' + (g.busy / n * 100) + '%;background:#2F4858"></i>' +
        '<i style="display:block;width:' + (g.free / n * 100) + '%;background:#C5D0D7"></i>' + (g.out ? '<i style="display:block;width:' + (g.out / n * 100) + '%;background:#66767F"></i>' : '') + '</div></td>' +
        '<td class="r">' + g.busy + ' з ' + n + '</td><td class="r">' + (g.free < n * 0.2 ? '<span class="pill warn" style="margin:0">' + g.free + '</span>' : g.free) + '</td></tr>';
    }).join('') + '</table></div></div>';
  const shown = D.more ? busy : busy.slice(0, 20);
  h += zFold('r5_04', 'Зайнята тара: найдовше без руху зверху', busy.length,
    busy.length ? '<div class="tw"><table class="t">' + head + shown.map(row).join('') + '</table></div>' +
      (busy.length > 20 ? '<button type="button" class="ic" style="margin-top:8px" onclick="zA(' + zAct(() => { D.more = !D.more; renderDash(); }) + ')">' + (D.more ? 'Згорнути' : 'Показати всі ' + busy.length) + '</button>' : '')
      : '<p class="muted">Уся тара вільна.</p>');
  return h;
}

function histTree(nodes, dir) {
  if (!nodes.length) return '<p class="muted">' + (dir === 'in' ? 'Деталі з інших партій не надходили.' : 'Деталі в інші партії не йшли.') + '</p>';
  const one = n => {
    const l = n.link; const other = dir === 'in' ? l.from : l.to;
    const head = (dir === 'in' ? '← ' : '→ ') + '<b>' + l.qty + ' шт</b> ' + (dir === 'in' ? 'з ' : '') +
      (other ? bl(other) : '<b>' + esc(l.purpose || l.type) + '</b>') + ' · ' + esc(l.type) + (l.product ? ' · ' + esc(l.product) : (l.step ? ' · ' + esc(l.step) : ''));
    return '<div style="margin-left:' + ((n.level - 1) * 14) + 'px;border-left:2px solid #E3EAEF;padding:6px 0 6px 10px">' +
      '<div class="' + (l.cancelled ? 'x' : '') + '">' + head + '</div><div class="muted" style="font-size:13px">' + esc(l.time) + ' · ' + esc(l.who) +
      (n.batch ? ' · ' + esc(n.batch.status) : '') + (l.comment ? ' · ' + esc(l.comment) : '') +
      (l.cancelled ? '<br>скасовано ' + esc(l.cancelled.time) + ' · ' + esc(l.cancelled.who) + (l.cancelled.comment ? ' · ' + esc(l.cancelled.comment) : '') : '') +
      (n.repeat ? ' · див. вище' : '') + (n.more ? ' · далі не показано' : '') + '</div></div>' + n.children.map(one).join('');
  };
  return nodes.map(one).join('');
}
function histWhat(x) {
  const own = x.batch === HB.info.no;
  if (x.type === 'крок') {
    const g = x.corrected ? x.corrected.good : x.good, s = x.corrected ? x.corrected.scrap : x.scrap;
    return '<b>' + esc(x.step) + '</b> ' + esc(x.stepName) + ' · ' + g + ' / ' + s + (x.reason ? ' · ' + esc(x.reason) : '') + (x.step === 'K2' && x.x1 ? ' · ящиків ' + esc(x.x1) : '');
  }
  if (x.type === 'нова партія') return 'нова партія · ' + x.qty + ' шт' + (x.x2 && !/^MT/.test(x.batch) ? ' · старт з ' + esc(x.x2) : '');   // v27
  if (x.type === 'пропуск') return '⏭ пропущено <b>' + esc(x.step) + '</b> ' + esc(x.stepName) + ' · ' + x.qty + ' шт';   // v27

  if (x.type === 'відокремлення') return (x.from === x.batch ? 'відокремлено ' + x.qty + ' → ' + bl(x.to) : 'додано ' + x.qty + ' з ' + bl(x.from)) + (x.x2 ? ' · ' + esc(x.x2) : '');
  if (x.type === 'вибуття') return 'вибуло ' + x.qty + ' → <b>' + esc(x.x1) + '</b> · ' + esc(x.x2);
  if (x.type === 'видача') return x.from === x.batch ? 'видано ' + x.qty + ' → ' + bl(x.to) : 'отримано ' + x.qty + ' з ' + bl(x.from) + (x.x2 ? ' · ' + esc(x.x2) : '');
  if (x.type === 'залишок') return x.from === x.batch ? 'повернуто ' + x.qty + ' ' + esc(x.x1) + ' → ' + (x.to ? bl(x.to) : 'склад') : 'отримано залишок ' + x.qty + ' ' + esc(x.x1) + ' з ' + bl(x.from);

let SKD = null;                 // дані від сервера
let SKF = { photo: '', raw: '', busy: null };   // фото поточного запису; busy — запит фото, що ще йде
function loadSklad() {
  setView('', 'Робота зі складом', 'home');
  $('app').innerHTML = '<div class="center muted">Завантаження…</div>';
  google.script.run.withSuccessHandler(d => { SKD = d; renderSklad(); })
    .withFailureHandler(e => {
      if (/не зареєстровано/.test(e.message)) { forgetCode(); return loadPage(); }
      $('app').innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
    }).apiSkladPage({ code: CODE, s: PARAMS.s || '' });
}
/** «1+2+5» → 8; «2,5» → 2.5; інакше NaN (сервер перевіряє так само) */
function skCalc(v) {
  const s = String(v || '').replace(/\s+/g, '').replace(/,/g, '.');
  if (!/^\d+(\.\d+)?([+\-]\d+(\.\d+)?)*$/.test(s)) return NaN;
  let sum = 0; s.match(/[+\-]?\d+(\.\d+)?/g).forEach(t => sum += Number(t));
  return Math.round(sum * 1000) / 1000;
}
function skNum(n) { return String(n).replace('.', ','); }

  const d = SKD; const me = d.me;
  $('who').innerHTML = esc(me.name) + '<br>' + esc(me.role);
  setView(d.loc ? d.loc.code : '', 'Робота зі складом', 'home');
  const locHtml = d.loc
    ? '<div class="muted">Локація: <b>' + esc(d.loc.code) + (d.loc.name && d.loc.name !== d.loc.code ? ' · ' + esc(d.loc.name) : '') + '</b></div>'
    : '<label>Локація складу</label><select id="skLoc">' + opts(d.locs.map(l => l.code + (l.name !== l.code ? ' · ' + l.name : '')), '', '— оберіть —') + '</select>';
  const posList = d.positions.map(p => p.name).concat([d.other]);
  let h = '<div class="card"><div class="mid">Робота зі складом</div>' + locHtml +
    '<label>Дія</label><div class="seg"><label><input type="radio" name="skAct" value="взяв" checked><span>Взяв</span></label>' +
    '<label><input type="radio" name="skAct" value="поклав"><span>Поклав</span></label></div>' +
    // v17: «поклав» — і повернення з виробництва, і прихід від постачальника (наповнення складу)
    '<div id="skFromBox" style="display:none"><label>Звідки</label><div class="seg"><label><input type="radio" name="skFrom" value="з виробництва"><span>З виробництва</span></label>' +
    '<label><input type="radio" name="skFrom" value="від постачальника"><span>Від постачальника</span></label></div></div>' +
    (d.photo ? '<label>Фото етикетки <span class="muted">(необов\'язково — заповнить поля саме)</span></label>' +
      '<input type="file" accept="image/*" capture="environment" id="skFile" style="display:none">' +
      '<button type="button" class="btn btn2" id="skCam" style="margin-top:0">📷 Сфотографувати етикетку</button>' +

    '<div id="skOtherBox" style="display:none"><label>Що саме</label><input type="text" id="skOther" placeholder="назва"></div>' +
    '<label>Типорозмір <span class="muted">(якщо є)</span></label><select id="skTyp">' + opts(d.typ, '', '—') + '</select>' +

    '<label>Кількість</label><div class="row" style="align-items:center"><input type="text" inputmode="decimal" id="skQty" placeholder="напр. 1000 або 1+2+5" style="font-size:22px;font-weight:600">' +
    '<button type="button" class="ic" id="skPlus" style="flex:0 0 58px;font-size:26px;padding:10px 0;margin:0">+</button></div>' +
    '<div id="skSum" class="muted" style="margin-top:6px;min-height:20px"></div>' +
    '<label>Одиниця</label><select id="skUnit">' + opts(d.units, 'шт') + '</select>' +
    '<label>Партія постачальника <span class="muted">(з коробки, якщо є)</span></label><input type="text" id="skLot">' +
    '<label>Партія МЛП <span class="muted">(необов\'язково)</span></label><input type="text" id="skMlp" placeholder="напр. M-00012" autocapitalize="characters">' +
    '<label>Коментар</label><textarea id="skCm"></textarea>' +
    '<button class="btn" id="skGo">Записати</button><div class="err" id="err"></div></div>';
  h += '<div id="skMy"></div><p class="muted" style="text-align:center">' + esc(PAGE_VERSION) + ' · ' + esc(d.version) + '</p><div style="height:20px"></div>';
  $('app').innerHTML = h;
  renderSkMy();
  $('skPos').onchange = () => {
    const v = $('skPos').value;
    $('skOtherBox').style.display = v === d.other ? 'block' : 'none';
    const p = d.positions.find(x => x.name === v); if (p && !SKF.unitTouched) $('skUnit').value = p.unit;
  };
  $('skUnit').onchange = () => SKF.unitTouched = true;
  document.querySelectorAll('input[name=skAct]').forEach(r => r.onchange = () => {
    const put = (document.querySelector('input[name=skAct]:checked') || {}).value === 'поклав';
    $('skFromBox').style.display = put ? 'block' : 'none'; $('skPosL').textContent = put ? 'Що поклали' : 'Що взяли';
  });
  $('skQty').oninput = skShowSum;
  $('skPlus').onclick = () => { const q = $('skQty'); if (q.value && !/[+\-]$/.test(q.value)) q.value += '+'; q.focus(); skShowSum(); };
  if (d.photo) {
    $('skCam').onclick = () => $('skFile').click();
    $('skFile').onchange = e => { const f = e.target.files && e.target.files[0]; if (f) skPhoto(f); e.target.value = ''; };
  }
  $('skGo').onclick = skSave;
}
function skShowSum() {
  const v = $('skQty').value; const n = skCalc(v); const box = $('skSum');
  const hint = SKF.hint ? '<span>на етикетці: ' + esc(SKF.hint) + '</span>' : '';
  if (!v) { box.innerHTML = hint; return; }
  if (isNaN(n)) { box.innerHTML = '<span style="color:#9B231A">лише числа і «+»</span>'; return; }
  box.innerHTML = /[+\-]/.test(v.replace(/^[+\-]/, '')) ? '<b style="color:#1D2B33;font-size:18px">= ' + skNum(n) + '</b>' + (hint ? ' · ' + hint : '') : hint;
}
/** Стиснути фото до 1600 px (JPEG) — швидше відправка, сервер і модель читають етикетку так само */
function skShrink(file) {
  return new Promise((ok, fail) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('Не вдалося відкрити фото')); };
    img.src = url;
  });
}
function skPhoto(file) {
  const ph = $('skPh');
  SKF.photo = ''; SKF.raw = ''; SKF.hint = '';
  ph.innerHTML = 'Надсилаю фото…';
  $('skCam').textContent = '📷 Перезняти етикетку';
  SKF.busy = skShrink(file).then(data => {
    ph.innerHTML = '<img src="' + data + '" style="height:64px;border-radius:8px;vertical-align:middle;margin-right:8px">Розпізнаю етикетку…';
    const loc = SKD.loc ? SKD.loc.code : ($('skLoc') ? $('skLoc').value.split(' ')[0] : '');
    return post('skladPhoto', { code: CODE, loc: loc, img: data.split(',')[1] }).then(r => {
      SKF.photo = r.photo; SKF.raw = r.raw || '';
      const img = '<img src="' + data + '" style="height:64px;border-radius:8px;vertical-align:middle;margin-right:8px">';
      if (r.fields) { skFill(r.fields); ph.innerHTML = img + '✓ Розпізнано — перевірте поля й впишіть, скільки взяли'; }
      else ph.innerHTML = img + 'Фото збережено, але розпізнати не вдалось — заповніть поля вручну' +
        (SKD.me.role === 'адміністратор' ? '<br><span style="color:#9B231A">' + esc(r.recError || '') + '</span>' : '');
    });
  }).catch(e => { ph.innerHTML = '<span style="color:#9B231A">' + esc(e.message) + '</span> — можна записати без фото'; })
    .then(() => { SKF.busy = null; });
}
/** Заповнити з етикетки лише порожні поля — що людина вже вписала, не чіпаємо */
function skFill(f) {
  const set = (id, v) => { const el = $(id); if (el && v && !el.value) el.value = v; };
  if (f.position && !$('skPos').value) { $('skPos').value = f.position; $('skPos').onchange(); }
  set('skTyp', f.typ);
  set('skDet', [f.details, f.article ? 'арт. ' + f.article : '', f.supplier].filter(x => x).join(' · ').slice(0, 120));
  set('skLot', f.lot);
  const u = { 'pcs': 'шт', 'pc': 'шт', 'шт': 'шт', 'шт.': 'шт', 'm': 'м', 'м': 'м', 'kg': 'кг', 'кг': 'кг', 'g': 'г', 'г': 'г' }[String(f.unit || '').toLowerCase()];
  if (u && !SKF.unitTouched && SKD.units.indexOf(u) >= 0) $('skUnit').value = u;
  if (f.qty_in_box) { SKF.hint = f.qty_in_box + (f.unit ? ' ' + f.unit : ''); skShowSum(); }
}
function skSave() {
  const btn = $('skGo'); if (btn.disabled) return;
  $('err').textContent = '';
  const n = skCalc($('skQty').value);
  if (!$('skQty').value || isNaN(n) || !(n > 0)) { $('err').textContent = 'Вкажіть кількість (число або 1+2+5)'; return; }
  btn.disabled = true; btn._t = btn.textContent; btn.textContent = SKF.busy ? 'Чекаю фото…' : 'Зберігаю…';
  const go = () => {
    btn.textContent = 'Зберігаю…';
    const act = (document.querySelector('input[name=skAct]:checked') || {}).value;
    const from = act === 'поклав' ? (document.querySelector('input[name=skFrom]:checked') || {}).value || '' : '';
    if (act === 'поклав' && !from) throw new Error('Оберіть, звідки поклали: з виробництва чи від постачальника');
    const loc = SKD.loc ? SKD.loc.code : ($('skLoc').value || '').split(' ')[0];
    return post('skladSave', { code: CODE, loc: loc, act: act, pos: $('skPos').value, posOther: $('skOther').value, typ: $('skTyp').value,
      det: $('skDet').value, qty: $('skQty').value, unit: $('skUnit').value, lot: $('skLot').value, mlp: $('skMlp').value, from: from,
      comment: $('skCm').value, photo: SKF.photo, raw: SKF.raw }).then(r => {
      btn.disabled = false; btn.textContent = btn._t;
      toast(r.msg || 'Записано');
      SKD.my = r.my || SKD.my;
      SKF = { photo: '', raw: '', busy: null };
      ['skPos', 'skOther', 'skTyp', 'skDet', 'skQty', 'skLot', 'skMlp', 'skCm'].forEach(id => { if ($(id)) $(id).value = ''; });
      $('skOtherBox').style.display = 'none'; $('skSum').innerHTML = '';
      if ($('skPh')) { $('skPh').innerHTML = ''; $('skCam').textContent = '📷 Сфотографувати етикетку'; }
      $('skUnit').value = 'шт';
      renderSkMy(); window.scrollTo(0, 0);
    });
  };
  (SKF.busy || Promise.resolve()).then(go).catch(e => {
    btn.disabled = false; btn.textContent = btn._t;
    const m = String(e.message || e).replace(/^Error:\s*/, ''); $('err').textContent = m; toast(m, true);
  });
}
let SKQ = '';   // v43: пошук у списку записів
function renderSkMy() {
  const all = SKD.my || [];
  const box = $('skMy'); if (!box) return;
  const q = SKQ.trim().toLowerCase();
  const my = q ? all.filter(x => [x.id, x.who, x.pos, x.typ, x.det, x.lot, x.mlp, x.loc, x.comment].join(' ').toLowerCase().indexOf(q) >= 0) : all;
  const st = x => x.cancelled ? ' · <b>скасовано</b>' + (x.fixWho ? ' (' + esc(x.fixWho) + (x.reason ? ': ' + esc(x.reason) : '') + ')' : '')
    : x.fixed ? ' · <b>виправлено → ' + esc(x.ref) + '</b>' : '';
  const was = x => x.isFix ? '<br><span class="muted">✎ виправлення ' + esc(x.ref) + ' · ' + esc(x.fixWho) + (x.reason ? ': ' + esc(x.reason) : '') + '</span>' : '';
  box.innerHTML = '<details' + (all.length ? ' open' : '') + '><summary>' + (SKD.allView ? 'Усі записи' : 'Мої записи') + ' за 30 днів (' + all.filter(x => !x.cancelled && !x.fixed).length + ')</summary>' +
    (SKD.allView ? '<input type="search" id="skQ" placeholder="пошук: ім\'я, позиція, ВД-…, партія" value="' + esc(SKQ) + '" style="margin:8px 0 0">' : '') +
    '<div class="list">' +
    (my.length ? my.map(x => '<div class="li"><div><div class="' + (x.cancelled || x.fixed ? 'x' : '') + '">' +
      (x.act === 'повернув' || x.act === 'поклав' ? '<span class="pill warn" style="margin:0 6px 0 0">поклав' + (x.from ? ' · ' + esc(x.from) : '') + '</span>' : '') +
      '<b>' + esc(x.pos) + (x.typ ? ' ' + esc(x.typ) : '') + '</b> — ' + esc(skNum(x.qty)) + ' ' + esc(x.unit) +
      '<br><span class="muted">' + (x.who ? esc(x.who) + ' · ' : '') + esc(x.loc) + (x.det ? ' · ' + esc(x.det) : '') + (x.lot ? ' · партія ' + esc(x.lot) : '') + (x.mlp ? ' · ' + esc(x.mlp) : '') +
      (x.photo ? ' · 📷' : '') + '</span></div><span class="muted" style="font-size:13px">' + esc(x.id) + st(x) + '</span>' + was(x) + '</div>' +
      '<div class="r muted">' + esc(x.time.slice(0, 5)) + '<br>' + esc(x.time.slice(6)) +
      (x.canFix || x.canCancel ? '<br>' : '') +
      (x.canFix ? '<button class="ic" onclick="skFixOpen(\'' + esc(x.id) + '\')">✎</button>' : '') +
      (x.canCancel ? '<button class="ic" onclick="skCancel(\'' + esc(x.id) + '\')">✖</button>' : '') + '</div></div>').join('')
      : '<p class="muted">' + (q ? 'Нічого не знайдено.' : 'Записів ще немає.') + '</p>') + '</div></details>';
  if ($('skQ')) $('skQ').oninput = e => { SKQ = e.target.value; const pos = e.target.selectionStart; renderSkMy(); const i = $('skQ'); i.focus(); try { i.setSelectionRange(pos, pos); } catch (er) { } };
}
/** ✖: свій запис у перші хвилини — без причини; зав. складу — будь-який, з причиною (v43) */
function skCancel(id) {
  const x = (SKD.my || []).find(r => r.id === id) || {};
  if (!SKD.canFix) return confirmBox('Скасувати запис ' + id + '?', () => {
    busy(true);
    google.script.run.withSuccessHandler(r => { busy(false); toast(r.msg); SKD.my = r.my; renderSkMy(); })
      .withFailureHandler(e => { busy(false); toast(e.message, true); }).apiSkladCancel({ code: CODE, id: id });
  });
  openModal('<div class="card"><div class="mid">Скасувати запис ' + esc(id) + '?</div>' +
    '<div class="muted">' + esc(x.who || '') + ' · ' + esc(x.time || '') + ' · ' + esc(x.pos || '') + ' — ' + esc(skNum(x.qty || '')) + ' ' + esc(x.unit || '') + '</div>' +
    '<label>Причина скасування</label><textarea id="fxWhy"></textarea><div class="err" id="merr"></div>' +
    '<div class="grid" style="margin-top:16px"><button class="btn btn2" onclick="closeModal()">Ні</button><button class="btn" id="fxGo">Скасувати запис</button></div></div>');
  $('fxGo').onclick = () => skFixSend({ id: id, cancel: true, reason: $('fxWhy').value }, $('fxGo'));
}
/** v43: зав. складу — виправити запис (форма з тими самими полями; час і працівник не змінюються) */
function skFixOpen(id) {
  const x = (SKD.my || []).find(r => r.id === id); if (!x) return;
  const d = SKD;
  const posList = d.positions.map(p => p.name); if (x.posBase !== d.other && posList.indexOf(x.posBase) < 0) posList.push(x.posBase);
  posList.push(d.other);
  const locs = d.locs.map(l => l.code); if (locs.indexOf(x.loc) < 0) locs.push(x.loc);
  const units = d.units.slice(); if (x.unit && units.indexOf(x.unit) < 0) units.push(x.unit);
  const put = x.act === 'поклав' || x.act === 'повернув';
  const radio = (name, v, label, on) => '<label><input type="radio" name="' + name + '" value="' + esc(v) + '"' + (on ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
  openModal('<div class="card"><div class="mid">Виправити ' + esc(id) + '</div>' +
    '<div class="muted">' + esc(x.who || '') + ' · ' + esc(x.time) + ' — час і працівник не змінюються</div>' +
    '<label>Локація</label><select id="fxLoc">' + opts(locs, x.loc) + '</select>' +
    '<label>Дія</label><div class="seg">' + radio('fxAct', 'взяв', 'Взяв', !put) + radio('fxAct', 'поклав', 'Поклав', put) + '</div>' +
    '<div id="fxFromBox" style="display:' + (put ? 'block' : 'none') + '"><label>Звідки</label><div class="seg">' +
      radio('fxFrom', 'з виробництва', 'З виробництва', x.from === 'з виробництва') + radio('fxFrom', 'від постачальника', 'Від постачальника', x.from === 'від постачальника') + '</div></div>' +
    '<label>Позиція</label><select id="fxPos">' + opts(posList, x.posBase) + '</select>' +
    '<div id="fxOtherBox" style="display:' + (x.posBase === d.other ? 'block' : 'none') + '"><label>Що саме</label><input type="text" id="fxOther" value="' + esc(x.posOther) + '"></div>' +
    '<label>Типорозмір</label><select id="fxTyp">' + opts(d.typ, x.typ, '—') + '</select>' +
    '<label>Деталі</label><input type="text" id="fxDet" value="' + esc(x.det) + '">' +
    '<label>Кількість</label><input type="text" inputmode="decimal" id="fxQty" value="' + esc(skNum(x.qty)) + '" style="font-size:20px;font-weight:600">' +
    '<label>Одиниця</label><select id="fxUnit">' + opts(units, x.unit) + '</select>' +
    '<label>Партія постачальника</label><input type="text" id="fxLot" value="' + esc(x.lot) + '">' +
    '<label>Партія МЛП</label><input type="text" id="fxMlp" value="' + esc(x.mlp) + '" autocapitalize="characters">' +
    '<label>Коментар</label><textarea id="fxCm">' + esc(x.comment) + '</textarea>' +
    '<label>Причина виправлення</label><textarea id="fxWhy" placeholder="напр. помилка в кількості"></textarea>' +
    '<div class="err" id="merr"></div>' +
    '<div class="grid" style="margin-top:16px"><button class="btn btn2" onclick="closeModal()">Закрити</button><button class="btn" id="fxGo">Зберегти</button></div></div>');
  document.querySelectorAll('input[name=fxAct]').forEach(r => r.onchange = () => {
    $('fxFromBox').style.display = (document.querySelector('input[name=fxAct]:checked') || {}).value === 'поклав' ? 'block' : 'none';
  });
  $('fxPos').onchange = () => $('fxOtherBox').style.display = $('fxPos').value === d.other ? 'block' : 'none';
  $('fxGo').onclick = () => {
    const act = (document.querySelector('input[name=fxAct]:checked') || {}).value;
    const from = act === 'поклав' ? (document.querySelector('input[name=fxFrom]:checked') || {}).value || '' : '';
    const n = skCalc($('fxQty').value);
    if (isNaN(n) || !(n > 0)) { $('merr').textContent = 'Вкажіть кількість (число або 1+2+5)'; return; }
    if (act === 'поклав' && !from) { $('merr').textContent = 'Оберіть, звідки поклали'; return; }
    if (!$('fxWhy').value.trim()) { $('merr').textContent = 'Вкажіть причину виправлення'; return; }
    skFixSend({ id: id, loc: $('fxLoc').value, act: act, from: from, pos: $('fxPos').value, posOther: $('fxOther').value, typ: $('fxTyp').value,
      det: $('fxDet').value, qty: $('fxQty').value, unit: $('fxUnit').value, lot: $('fxLot').value, mlp: $('fxMlp').value, comment: $('fxCm').value,
      reason: $('fxWhy').value }, $('fxGo'));
  };
}
function skFixSend(q, btn) {
  if (btn.disabled) return;
  btn.disabled = true; btn._t = btn.textContent; btn.textContent = 'Зберігаю…'; $('merr').textContent = '';
  q.code = CODE;
  post('skladEdit', q).then(r => { closeModal(); toast(r.msg); SKD.my = r.my; renderSkMy(); })
    .catch(e => { btn.disabled = false; btn.textContent = btn._t; $('merr').textContent = String(e.message || e).replace(/^Error:\s*/, ''); });
}

$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
load();
</script>
