<script>

    .apiPage(q);

    ' · запис ' + d('write', 'read') + ' · сторінка ' + d('page', 'write') + ')' : '') + ' / разом ' + sec(total);
}
function sec(ms) { return (ms / 1000).toFixed(1).replace('.', ',') + ' с'; }
function showPage(r, extra) { if (r && r.page) { S = r.page; render(extra || {}); } else load(extra); }
function setUrl() { try { const q = new URLSearchParams(PARAMS).toString(); history.replaceState(null, '', location.pathname + (q ? '?' + q : '')); } catch (e) { } }

/** v7: дія без своєї кнопки (після «Так» у підтвердженні: ↩ назад, ✖ свій запис) — плашка «Зберігаю…» внизу,

let BUSY = false;
function busy(on) {

  if (on) { clearTimeout(t._h); t.textContent = 'Зберігаю…'; t.style.background = '#2F4858'; t.style.display = 'block'; }

function act(payload, btn, after) {
  const t0 = Date.now();
  if (!btn && BUSY) return;
  if (btn) { btn.disabled = true; btn._t = btn.textContent; btn.textContent = 'Зберігаю…'; } else busy(true);
  payload.code = CODE;
  if (payload.view === undefined) payload.view = viewParams();
  google.script.run.withSuccessHandler(r => {
    if (btn) { btn.disabled = false; btn.textContent = btn._t; } else busy(false);
    if (r && r.warn) { confirmBox(r.warn, () => { payload.force = true; act(payload, btn, after); }); return; }
    closeModal();
    let msg = r.msg || 'Готово';
    // адміністратору — час запису: сервер / разом із мережею (перевірка швидкості під час тестів)
    if (S.me && S.me.role === 'адміністратор' && r.ms !== undefined) msg += ' · ' + timing(r, Date.now() - t0);
    toast(msg, !!r.alert);   // v13: напр. «⚠ Етикетки не надіслано» — червоним
    if (r.showBatch) { PARAMS.b = r.showBatch; delete PARAMS.t; setUrl(); }   // v13: після останнього K2 — картка партії, а не вільна тара
    if (after) after(r); else showPage(r, {});
  }).withFailureHandler(e => {
    if (btn) { btn.disabled = false; btn.textContent = btn._t; } else busy(false);
    const m = String(e.message || e).replace(/^Error:\s*/, '');
    const box = $('err'); const inModal = $('modal').style.display === 'flex';
    if (box && !inModal) box.textContent = m;
    const mb = $('merr'); if (mb && inModal) mb.textContent = m;
    // v16: повідомлення один раз — у формі; червона смужка внизу лише коли поля для помилки немає
    if (!((box && !inModal) || (mb && inModal))) toast(m, true);
  }).apiAct(payload);
}

function confirmBox(text, yes) {

function opts(list, sel, ph) { return (ph ? '<option value="">' + esc(ph) + '</option>' : '') + list.map(x => '<option' + (String(x) === String(sel) ? ' selected' : '') + '>' + esc(x) + '</option>').join(''); }
/** v18: тімлід — «Хто виконав» і «Дата» (Code.gs v21: a.who, a.at). Вибір тримається в ONB, поки сторінка відкрита (дооформлення кількох кроків поспіль) */

/** v12: реєстрація телефону. Код телефону (mlp_pending) створюється один раз і живе в цьому браузері.
 *  Після кнопки 1 сторінка сама перевіряє реєстрацію: щойно людина повертається на вкладку, і ще 3 хв кожні 4 с.
 *  Новий код з'являється лише там, де браузер нічого не пам'ятає (інший браузер / приватна вкладка) — тому підказка «не скануйте QR знову». */
let REG = { pend: '', timer: null, until: 0, busy: false, hooked: false };
function regDiag(ev, pend, isNew) {
  return { ev: ev, pend: pend || '', isNew: !!isNew, ua: String(navigator.userAgent || '').slice(0, 200),
    ref: String(document.referrer || '').slice(0, 100), standalone: !!window.navigator.standalone, hist: history.length };
}
/** v17: код телефону, якого сервер не знає (рядок у «Телефони» видалено, таблицю скинуто), — забути, щоб пройти реєстрацію як новий телефон */
function forgetCode() { if (CODE) { store('mlp_code', null); CODE = ''; } }
function regStop() { if (REG.timer) clearInterval(REG.timer); REG.timer = null; REG.pend = ''; }
/** Реєстрацію знайдено: запам'ятати код і відкрити те, заради чого сканували QR */
function regDone(pend, d) {
  regStop();
  store('mlp_code', pend); store('mlp_pending', null); CODE = pend; S = d;
  toast('Телефон зареєстровано: ' + d.me.name);
  const go = !d.pending && ((PARAMS.cab && d.perms && d.perms.cabinet) || PARAMS.d || PARAMS.h || PARAMS.s || PARAMS.sklad);
  if (go) load(); else render({});
}
/** Тиха перевірка (без повідомлень); manual — натиснуто «2. Я зареєструвався» */
function regCheck(manual) {
  const pend = REG.pend; if (!pend || REG.busy) return;
  REG.busy = true;
  const q = Object.assign({}, PARAMS, { code: pend });
  if (manual) q.rg = regDiag('перевірка', pend);
  const btn = $('chk'); if (manual && btn) btn.disabled = true;
  google.script.run.withSuccessHandler(d => {
    REG.busy = false; if (btn) btn.disabled = false;
    if (REG.pend !== pend) return;
    if (d.me) return regDone(pend, d);
    if (manual && $('err')) $('err').innerHTML = 'Реєстрацію з кодом <b>' + esc(pend) + '</b> ще не знайдено.<br>Надіслали форму? Зачекайте кілька секунд — сторінка перевірить сама.' +
      '<br>Якщо форму надсилали з іншого браузера чи після повторного сканування QR — відкрийте її кнопкою 1 саме тут і надішліть ще раз.';
  }).withFailureHandler(e => { REG.busy = false; if (btn) btn.disabled = false; if (manual && $('err')) $('err').textContent = e.message; })
    .apiPage(q);
}
function regWatch() {
  REG.until = Date.now() + 3 * 60000;
  if (REG.timer) return;
  REG.timer = setInterval(() => {
    if (!REG.pend || Date.now() > REG.until) { clearInterval(REG.timer); REG.timer = null; return; }
    if (document.visibilityState === 'visible') regCheck(false);
  }, 4000);
}
function renderReg() {
  let pend = store('mlp_pending'), isNew = false;
  if (!pend) { pend = Math.random().toString(36).slice(2, 7).toUpperCase() + Date.now().toString(36).slice(-4).toUpperCase(); store('mlp_pending', pend); isNew = true; }
  const kept = store('mlp_pending') === pend;   // браузер не зберігає дані сторінки (приватний режим тощо)
  REG.pend = pend;
  if (!REG.hooked) {   // повернення з форми на цю вкладку — перевірити одразу
    REG.hooked = true;
    const back = () => { if (REG.pend && document.visibilityState === 'visible') { regCheck(false); regWatch(); } };
    document.addEventListener('visibilitychange', back);
    window.addEventListener('pageshow', e => { if (e.persisted) back(); });
  }
  const url = (S.reg || '').replace('CODE_PLACEHOLDER', encodeURIComponent(pend));
  $('app').innerHTML = '<div class="card"><div class="mid">Цей телефон ще не зареєстровано</div>' +
    '<p class="muted">Один раз: натисніть кнопку 1, увійдіть у свій Google-акаунт (той, з якого заповнюєте вечірній звіт), впишіть прізвище й ім\'я і надішліть. ' +
    'Потім поверніться на цю вкладку — сторінка сама побачить реєстрацію.</p>' +
    '<p class="warn" style="padding:8px 10px;border-radius:10px;font-size:14px;margin:0 0 12px">Не скануйте QR повторно, доки не з\'явиться «Телефон зареєстровано»: в іншій вкладці чи браузері буде інший код.</p>' +
    (kept ? '' : '<p class="bad" style="padding:8px 10px;border-radius:10px;font-size:14px;margin:0 0 12px">Браузер не зберігає дані сторінки (можливо, приватний режим). Відкрийте сторінку у звичайній вкладці.</p>') +
    '<p class="muted">Код телефону: <b>' + esc(pend) + '</b></p>' +
    '<a class="btn" id="regf" style="text-align:center;text-decoration:none" target="_blank" href="' + esc(url) + '">1. Відкрити форму реєстрації</a>' +
    '<button class="btn btn2" id="chk">2. Я зареєструвався</button><div class="err" id="err"></div></div>' +
    // v17: форму надіслали з іншого браузера / після повторного сканування — код є в надісланій формі (і в листі-копії відповіді)
    '<details><summary>Форму вже надіслали з іншої вкладки?</summary><div style="padding:0 16px 16px"><p class="muted">Впишіть код телефону з надісланої форми — сторінка перевірить його.</p>' +
    '<div class="row"><input type="text" id="regCode" autocapitalize="characters" placeholder="напр. K7QXA3F9"><button class="btn btn2" id="regUse" style="flex:0 0 40%;margin:0">Перевірити</button></div>' +
    '<div class="err" id="err2"></div></div></details>';
  $('regf').onclick = () => regWatch();
  $('chk').onclick = () => regCheck(true);
  $('regUse').onclick = () => {
    const c = $('regCode').value.trim().toUpperCase().replace(/\s+/g, ''); if (!c) return;
    $('regUse').disabled = true;
    google.script.run.withSuccessHandler(d => {
      $('regUse').disabled = false;
      if (d.me) { REG.pend = c; return regDone(c, d); }
      $('err2').textContent = 'Код ' + c + ' не знайдено. Перевірте, чи форму надіслано, і спробуйте за хвилину.';
    }).withFailureHandler(e => { $('regUse').disabled = false; $('err2').textContent = e.message; })
      .apiPage(Object.assign({}, PARAMS, { code: c, rg: regDiag('свій код', c) }));
  };
}

/** v16: «Робота без партії». Один QR на всі поверхи (?nb=1) — дільниця у формі, необов'язково: за замовчуванням — дільниця працівника,
 *  «Різні / не вказувати» — робота на кількох дільницях. Старі плакати ?p=П2 підставляють свою дільницю. Останній вибір пам'ятає телефон. */

    '<div id="wkx"></div>' +
    '<label>Дільниця (необов\'язково)</label><select id="site">' +
      '<option value="">' + esc(mine ? 'Моя: ' + mine : '— не вказано —') + '</option>' +
      sites.map(x => '<option value="' + esc(x.code) + '"' + (x.code === pre ? ' selected' : '') + '>' + esc(x.code + ' · ' + x.name) + '</option>').join('') +
      '<option value="-"' + (pre === '-' ? ' selected' : '') + '>Різні / не вказувати</option></select>' +
    '<label>Коментар</label><textarea id="cm"></textarea>' +

  $('site').onchange = () => store('mlp_site', $('site').value || null);

  $('wk').onchange = () => {
    const w = S.dict.works.find(x => x.name === $('wk').value);

      (w.unit === 'год' ? '<input type="text" inputmode="decimal" id="val" placeholder="напр. 1,5">' : numInput('val', '')) +

  $('go').onclick = () => act(Object.assign({ action: 'noBatch', work: $('wk').value, value: $('val') ? $('val').value : '', typ: $('typ') ? $('typ').value : '',
    comment: $('cm').value, site: $('site').value, view: null }, onbVal()), $('go'), () => { $('wk').value = ''; $('wkx').innerHTML = ''; $('cm').value = ''; });

/** v21: вибір кольору партії (необов'язково). stream — ST / RT, cur — поточний */
function colorField(id, stream, cur) {
  const list = (S.dict && S.dict.colors && S.dict.colors[stream]) || [];
  if (!list.length) return '';
  return '<label>Колір ' + (stream === 'RT' ? 'роторів' : 'статорів') + ' <span class="muted">(необов\'язково)</span></label><select id="' + id + '">' + opts(list, cur || '', '— не вказано —') + '</select>';

function drawNew() {
  const r = document.querySelector('input[name=st]:checked'); const st = r ? r.value : '';
  if (!st) { $('nf').innerHTML = ''; return; }
  const qty = st === 'ST' ? 160 : st === 'RT' ? 200 : (S.tare.type === 'ТЧ' ? 1000 : 160);
  let h = '<div class="row"><div><label>Типорозмір</label><select id="typ">' + opts(S.dict.typ, '3115') + '</select></div>' +
    (st !== 'RT' ? '<div><label>KV</label><select id="kv">' + opts(S.dict.kv, '', '—') + '</select></div>' : '') + '</div>';
  if (st === 'MT') h += compBlock('S', 'nS', true) + compBlock('R', 'nR', true) +
    '<p class="muted">Кількість пар рахується сама — за статорами й роторами, що прийшли.</p>';
  else {
    if (st === 'RT') h += '<label>Походження</label><div class="seg wrap"><label><input type="radio" name="org" value="" checked><span style="font-size:15px">Наші · з R1</span></label>' +
      '<label><input type="radio" name="org" value="v1"><span style="font-size:15px">Покупні в1 · одразу на ' + esc(S.v1Start || 'F4') + '</span></label></div>';   // v27
    h += lotField('lot', 'Партія постачальника (якщо є)') + '<label>Кількість на старті</label>' + numInput('qty', qty);   // v17: + 📷 етикетки
    if (S.perms.startAt) h += '<div id="satW"><label>Почати з кроку</label><select id="sat"></select></div>';   // v27: тімлід — партія з переробки тощо
    h += '<label id="ncmL">Коментар <span class="muted">(необов\'язково)</span></label><input type="text" id="ncm">';
  }

  h += '<button class="btn" id="go">Створити партію</button>';
  $('nf').innerHTML = h;

  if (st === 'MT') {
    const ctx = () => ({ typ: $('typ').value, kv: $('kv') ? $('kv').value : '' });
    wireComp('S', 'nS', ctx, qty); wireComp('R', 'nR', ctx, qty);
    ['typ', 'kv'].forEach(id => $(id) && ($(id).onchange = () => { compRedraw('S', 'nS'); compRedraw('R', 'nR'); }));
  } else {
    wireLot('lot', {});
    // v27: «Почати з кроку» — маршрут обраного типорозміру; «Покупні в1» — крок задає система
    const satDraw = () => {
      const v1 = !!document.querySelector('input[name=org][value=v1]:checked');
      if ($('satW')) {
        const r = (S.routesNew || {})[st + '|' + $('typ').value] || [];
        $('satW').style.display = v1 || !r.length ? 'none' : 'block';
        $('sat').innerHTML = r.map((x, k) => '<option value="' + (k ? esc(x[0]) : '') + '">' + esc(x[0] + ' · ' + x[1]) + (k ? '' : ' — з початку') + '</option>').join('');
      }
      satHint();
    };
    const satHint = () => {
      const need = $('sat') && $('sat').value && $('satW').style.display !== 'none';
      $('ncmL').innerHTML = 'Коментар ' + (need ? '<span class="muted">(обов\'язково: чому не з першого кроку, напр. «з переробки»)</span>' : '<span class="muted">(необов\'язково)</span>');
    };
    $('typ').onchange = satDraw; if ($('sat')) $('sat').onchange = satHint;
    document.querySelectorAll('input[name=org]').forEach(x => x.onchange = satDraw);
    satDraw();
  }
  $('go').onclick = () => {
    const a = { action: 'newBatch', tare: S.tare.code, stream: st, typ: $('typ').value, kv: $('kv') ? $('kv').value : '' };
    if (st === 'MT') {
      if (!compSrc('nS') || !compSrc('nR')) { $('err').textContent = 'Оберіть, звідки статори і звідки ротори (або «Пізніше»)'; return; }
    }
    $('go').disabled = true;
    lotWait().then(() => {
      $('go').disabled = false;
      if (st === 'MT') a.comps = { S: compVal('S', 'nS'), R: compVal('R', 'nR') };
      else {
        const l = lotVal('lot'); a.qty = $('qty').value; a.lot = l.lot; a.photo = l.photo; if ($('ncl')) a.color = $('ncl').value;
        const org = document.querySelector('input[name=org]:checked'); if (org && org.value) a.origin = org.value;   // v27
        if ($('sat') && !a.origin && $('sat').value) a.startAt = $('sat').value;

        if (a.startAt && !a.comment) { $('err').textContent = 'Коментар обов\'язковий: чому партія починається з ' + a.startAt; return; }
      }
      act(a, $('go'));

  };
}

// ---- v17: звідки статори / ротори (форма «Нова партія» MT і «+ Статори / ротори» на картці MT): в1 · в2 · пізніше
// в1 — від постачальника: номер партії (необов'язково, + 📷 етикетки); порожньо — «в1 без номера».
// в2 — наша партія ST / RT зі списку готових (номер і тара); «без номера» — старий запас без партії.
const SRC_OPTS = [['v1', 'в1 · постачальник'], ['v2', 'в2 · наша партія'], ['later', 'Пізніше']];
const CMP = {};   // p → { k, ctx, defQty }
function compBlock(k, p, withLater) {
  const nm = k === 'S' ? 'Статори' : 'Ротори';
  return '<div style="margin-top:14px;padding:12px;border:1px solid #DCE3E8;border-radius:12px;background:#F7F9FB">' +
    '<div class="mid">' + nm + '</div><label>Звідки</label><div class="seg wrap">' +
    SRC_OPTS.filter(o => withLater || o[0] !== 'later').map(o => '<label><input type="radio" name="' + p + 'src" value="' + o[0] + '"><span style="font-size:15px">' + o[1] + '</span></label>').join('') + '</div>' +
    '<div id="' + p + 'x"></div></div>';
}
function compSrc(p) { const x = document.querySelector('input[name=' + p + 'src]:checked'); return x ? x.value : ''; }
/** Готові партії ST / RT для в2 — того самого типорозміру і KV, що й партія двигунів (сервер ще раз перевіряє при записі) */
function readyFor(k, c) {
  const s = k === 'S' ? 'ST' : 'RT';
  return (S.ready || []).filter(r => r.s === s && r.typ === String(c.typ || '') && (!c.kv || !r.kv || r.kv === String(c.kv)));
}
function compCtx(p) { const c = CMP[p].ctx(); return c.batch ? { typ: S.batch.info['Типорозмір'], kv: S.batch.info['KV'] } : c; }
/** Поля під обраним джерелом; ctx() — { typ, kv } нової партії або { batch } картки MT */
function wireComp(k, p, ctx, defQty) {
  CMP[p] = { k: k, ctx: ctx, defQty: defQty };
  document.querySelectorAll('input[name=' + p + 'src]').forEach(x => x.onchange = () => compRedraw(k, p));
}
function compRedraw(k, p) {
  const src = compSrc(p); const box = $(p + 'x'); if (!box || !CMP[p]) return;
  const st = k === 'S' ? 'ST' : 'RT';
  let h = '';
  if (src === 'v1') h = lotField(p + 'lot', 'Номер партії постачальника') + '<p class="muted" style="margin:6px 0 0">Немає номера — залиште порожнім: запишеться «в1 без номера».</p>';
  if (src === 'v2') {
    const c = compCtx(p); const list = readyFor(k, c);
    const tr = r => r.tare ? r.tare + (r.tare2 ? ' + ' + r.tare2 : '') : 'без тари';
    h = '<label>Тара або номер партії ' + st + '</label><select id="' + p + 'sel"><option value="">— без номера (старий запас) —</option>' +
      list.map(r => '<option value="' + esc(r.no) + '">' + esc(tr(r) + ' · ' + r.no + (r.kv ? ' · KV ' + r.kv : '') + ' · ' + r.qty + ' шт') + '</option>').join('') + '</select>' +
      '<div id="' + p + 'info" class="muted" style="margin-top:6px;min-height:18px">' + (list.length ? 'Лише готові партії ' + esc(st + ' ' + (c.typ || '')) + (c.kv ? ' KV ' + esc(c.kv) : '') + '.'
        : 'Готових партій ' + esc(st + ' ' + (c.typ || '')) + (c.kv ? ' KV ' + esc(c.kv) : '') + ' немає — «без номера» або «Пізніше».') + '</div>';
  }
  if (src === 'later') h = '<p class="muted" style="margin:8px 0 0">Додасте потім: «+ Статори / ротори» на картці цієї партії двигунів.</p>';
  if (src && src !== 'later') h += '<label>Скільки, шт</label>' + numInput(p + 'q', src === 'v2' ? '' : (CMP[p].defQty || ''));
  box.innerHTML = h;
  if (src === 'v1') wireLot(p + 'lot', CMP[p].ctx().batch ? { batch: CMP[p].ctx().batch } : {});
  if (src === 'v2') $(p + 'sel').onchange = () => {
    const r = (S.ready || []).find(x => x.no === $(p + 'sel').value);
    if (r) $(p + 'q').value = r.qty;
  };
}
/** Значення для сервера: в1 з номером → lot, без → v1; в2 зі списку → batch (ref = номер), без → v2 */
function compVal(k, p) {
  const src = compSrc(p); const q = $(p + 'q') ? $(p + 'q').value : '';
  if (src === 'v1') { const l = lotVal(p + 'lot'); return { src: l.lot ? 'lot' : 'v1', lot: l.lot, photo: l.photo, qty: q }; }
  if (src === 'v2') { const no = $(p + 'sel') ? $(p + 'sel').value : ''; return { src: no ? 'batch' : 'v2', ref: no, qty: q }; }
  return { src: src };
}

// ---- v17: партія постачальника + фото етикетки (розпізнавання номера партії, той самий сервіс, що й на складі)
let LOTF = {};
function LOTF_reset() { LOTF = {}; }
function lotField(id, label) {
  return '<label>' + esc(label || 'Партія постачальника') + ' <span class="muted">(необов\'язково)</span></label>' +
    '<div class="row" style="align-items:center"><input type="text" id="' + id + '" placeholder="номер з етикетки">' +
    '<button type="button" class="ic" id="' + id + 'Cam" style="flex:0 0 58px;font-size:22px;padding:10px 0;margin:0" title="Фото етикетки">📷</button></div>' +
    '<input type="file" accept="image/*" capture="environment" id="' + id + 'File" style="display:none"><div id="' + id + 'Ph" class="muted" style="margin-top:6px"></div>';
}
function wireLot(id, extra) {
  LOTF[id] = { photo: '', busy: null };
  if (!$(id + 'Cam')) return;
  $(id + 'Cam').onclick = () => $(id + 'File').click();
  $(id + 'File').onchange = e => { const f = e.target.files && e.target.files[0]; if (f) lotPhoto(id, f, extra); e.target.value = ''; };
}
function lotPhoto(id, file, extra) {
  const ph = $(id + 'Ph'); const st = LOTF[id] = { photo: '', busy: null };
  ph.innerHTML = 'Надсилаю фото…';
  st.busy = skShrink(file).then(data => {
    const img = '<img src="' + data + '" style="height:56px;border-radius:8px;vertical-align:middle;margin-right:8px">';
    ph.innerHTML = img + 'Розпізнаю номер партії…';
    return post('lotPhoto', Object.assign({ code: CODE, img: data.split(',')[1] }, extra || {})).then(r => {
      st.photo = r.photo;
      const lot = (r.fields && r.fields.lot) || '';
      if (lot && $(id) && !$(id).value) $(id).value = lot;
      if ($(id + 'Ph')) $(id + 'Ph').innerHTML = img + (lot ? '✓ Номер з етикетки: <b>' + esc(lot) + '</b> — перевірте' : 'Фото збережено, номер не розпізнано — впишіть вручну');
    });
  }).catch(e => { if ($(id + 'Ph')) $(id + 'Ph').innerHTML = '<span style="color:#9B231A">' + esc(e.message) + '</span> — можна записати без фото'; })
    .then(() => { st.busy = null; });
}
function lotVal(id) { return { lot: $(id) ? $(id).value.trim() : '', photo: (LOTF[id] || {}).photo || '' }; }
/** Дочекатися фото, що ще надсилається (щоб запис отримав посилання на нього) */
function lotWait() { return Promise.all(Object.keys(LOTF).map(k => LOTF[k].busy).filter(Boolean)).catch(() => { }); }

function statusPill(s) {
  const cls = { 'в роботі': 'warn', 'готово': 'ok', 'видано частково': 'ok', 'закрито': '', 'анульовано': 'bad', 'поза маршрутом': 'warn' }[s] || '';
  return '<span class="pill ' + cls + '">' + esc(s) + '</span>';
}

/** v22: крок на вибір, який не знадобився: у групі (alt) все пройдено іншим кроком, а на цьому записів немає. Повертає код обраного кроку або '' */
function altSkipped(b, s) {
  if (!s.alt || s.good + s.scrap > 0 || s.avail > 0) return '';
  const used = b.route.filter(x => x.alt === s.alt && x.code !== s.code && x.good + x.scrap > 0);
  return used.length && b.route.filter(x => x.alt === s.alt).every(x => x.avail === 0) ? used.map(x => x.code).join(', ') : '';
}
/** v27: кроки, які тімлід може пропустити зараз (сервер перевіряє ще раз): є штуки, крок не заблоковано;
 *  не пропускаються R5 (split), F4 (kv), K2 (pack), F4п і в MT — F1 і все до нього */
function skippable(b) {
  const i1 = b.comp ? b.route.findIndex(x => x.code === 'F1') : -1;
  const last = b.route[b.route.length - 1] || {};   // v28: останній крок (і група на вибір наприкінці) — не пропускається
  return b.route.filter((s, k) => s.avail > 0 && !s.blockedBy && ['split', 'kv', 'pack', 'ifPurchasedRotor'].indexOf(s.extra) < 0 && k > i1 &&
    s.code !== last.code && !(last.alt && s.alt === last.alt));
}
function renderBatch(extra) {
  const b = S.batch, i = b.info, p = S.perms;
  const stream = i['Потік'];
  const avail = b.route.filter(s => s.avail > 0 && !s.blockedBy);
  const sug = extra && extra.suggestStep && avail.find(s => s.code === extra.suggestStep);
  const pre = (sug && sug.code) || (avail[0] && avail[0].code) || '';
  // ПВ-22: крок, на якому лишились незакриті штуки і який тримає наступні
  const tails = b.route.filter(s => b.route.some(x => x.blockedBy === s.code));
  const tt = (b.tares || []).length > 1 ? b.tares.map(x => x.code + (x.qty ? ' (' + x.qty + ')' : '')).join(' + ') : (S.tare ? S.tare.code : '');   // v17: пара піддонів
  let h = '<div class="card"><div class="muted">' + ({ ST: 'Статори', RT: 'Ротори', MT: 'Двигуни' })[stream] + (tt ? ' · тара ' + esc(tt) : ' · ⚠ без тари') + '</div>' +
    '<div class="big">' + esc(i['Номер']) + '</div>' +
    '<span class="pill">' + esc(i['Типорозмір']) + '</span>' + (i['KV'] ? '<span class="pill">KV ' + esc(i['KV']) + '</span>' : '') +
    (i['Варіант'] ? '<span class="pill">' + esc(i['Варіант']) + '</span>' : '') + (i['Колір'] ? '<span class="pill">🎨 ' + esc(i['Колір']) + '</span>' : '') + (b.comp && b.comp.mixed ? '<span class="pill warn">змішане походження</span>' : '') + statusPill(b.status) +
    (i['Змішана'] === 'так' ? '<span class="pill warn">змішана</span>' : '') + (i['Призначення'] ? '<span class="pill warn">' + esc(i['Призначення']) + '</span>' : '') +
    '<div class="muted" style="margin-top:10px">Є зараз: <b>' + b.remaining + ' шт</b> · брак: ' + b.scrapAll + (b.issued ? ' · видано: ' + b.issued : '') + '</div>' +
    '<div class="stepbar">' + b.route.map(s => '<span class="' + (s.code === pre ? 'n' : tails.indexOf(s) >= 0 ? 'w' : (s.skip && s.good === s.skip && !s.scrap ? 's' : s.good + s.scrap > 0 && s.avail === 0 ? 'd' : altSkipped(b, s) ? 's' : '')) + '"' + (s.skip ? ' title="пропущено ' + s.skip + ' шт"' : '') +
      (altSkipped(b, s) ? ' title="не потрібен — обрано ' + esc(altSkipped(b, s)) + '"' : '') + '>' + esc(s.code) + '</span>').join('') + '</div>' +
    nowHtml(b) +
    tails.map(t => { const nx = b.route.filter(x => x.blockedBy === t.code).map(x => x.code);
      return '<div class="tail">На <b>' + esc(t.code) + '</b> лишилось <b>' + t.avail + ' шт</b>. Поки їх не записано (успішні або брак) або не відокремлено, ' + esc(nx.join(', ')) + ' не відкриється.</div>'; }).join('') +
    '</div>';
  if (b.comp) {
    const vv = c => [c.v2 ? 'в2 ' + c.v2 : '', c.v1 ? 'в1 ' + c.v1 : ''].filter(x => x).join(' · ');   // v13: версії деталей
    const row = (n, c) => '<div class="li"><div><b>' + n + '</b><br><span class="muted">прийшло ' + c.in + (vv(c) ? ' (' + vv(c) + ')' : '') +
      ' · у двигунах ' + c.used + ' · брак ' + c.scrap + (c.ret ? ' · пішло ' + c.ret : '') + (c.waitF4 ? ' · чекають F4п ' + c.waitF4 : '') + '</span></div>' +
      '<div class="r"><span class="pill ' + (c.left ? 'warn' : '') + '">залишок ' + c.left + '</span></div></div>';
    h += '<div class="card" style="padding-top:8px"><div class="list" style="padding:0">' + row('Статори', b.comp.S) + row('Ротори', b.comp.R) + '</div></div>';
  }

  if (b.status === 'анульовано' || b.status === 'закрито') {
    h += '<div class="card muted">Партія: ' + esc(b.status) + '. Записи неможливі.</div>';
  } else if (i['Призначення']) {
    h += '<div class="card muted">Партія поза маршрутом (' + esc(i['Призначення']) + '): кроки не записуються.</div>';
  } else if (p.step && avail.length) {
    h += '<div class="card"><div class="mid">Додати крок</div>' + onbHtml() +
      '<label>Крок</label><select id="stp">' + b.route.map(s => '<option value="' + esc(s.code) + '"' + (s.avail && !s.blockedBy ? '' : ' disabled') + (s.code === pre ? ' selected' : '') + '>' +
        esc(s.code + ' · ' + s.name) + (altSkipped(b, s) ? ' — не потрібен, обрано ' + esc(altSkipped(b, s)) : s.altWith && s.altWith.length ? ' (або ' + esc(s.altWith.join(', ')) + ')' : '') + (s.avail ? (s.blockedBy ? ' — ' + s.avail + ' шт, спершу закрити ' + s.blockedBy : ' — доступно ' + s.avail) : '') + '</option>').join('') + '</select>' +
      '<label id="goodLbl">Успішних</label>' + numInput('good', '') +
      '<div id="scrapWrap"><label>Брак</label>' + numInput('scrap', 0) + '</div>' +
      '<div id="rsn" style="display:none"><label>Причина браку</label><select id="reason">' + opts(S.dict.reasons, '', '— оберіть —') + '</select></div>' +
      '<div id="xf"></div>' +
      '<label>Коментар (необов\'язково)</label><input type="text" id="cm">' +
      '<button class="btn" id="go">Записати</button><div class="err" id="err"></div></div>';
  } else if (b.status === 'готово' || b.status === 'видано частково') {
    h += '<div class="card"><div class="mid">✓ Усі кроки пройдено</div><div class="muted">' +
      (stream === 'MT' ? 'Партію двигунів завершено.' : 'Готово до збирання. Тут більше нічого записувати не треба: на збиранні цю партію оберуть з картки партії двигунів («+ Статори / ротори»).') + '</div></div>';
  }

  // дії
  const acts = [];
  if (p.move && b.status !== 'закрито' && b.status !== 'анульовано') acts.push(['move', S.tare ? '⇄ Перекласти' : '⇄ Прив\'язати до тари', '']);
  if (b.comp && p.addComp && b.status === 'в роботі') acts.push(['addComp', '+ Статори / ротори', '']);   // v13
  if (p.skip && !i['Призначення'] && skippable(b).length) acts.push(['skip', '⏭ Пропустити крок', '']);   // v27
  const hasLeft = (b.leftovers || []).length > 0;
  const isQC = S.me && S.me.role === 'зав. відділу браку';
  if (isQC && ((b.stages || []).length || hasLeft) && ['анульовано', 'закрито'].indexOf(b.status) < 0) acts.push(['separate', '✂ Взяли на відбраковку', '']);   // v17
  else if (p.separateAll && ((b.stages || []).length || hasLeft) && b.status !== 'анульовано') acts.push(['separate', '✂ Відокремити', '']);
  else if (p.separate && hasLeft && b.status === 'в роботі') acts.push(['separate', '✂ Залишок', '']);   // v13: працівник — тільки залишок деталей
  if (p.add && !i['Призначення'] && ['в роботі', 'готово', 'видано частково'].indexOf(b.status) >= 0) acts.push(['add', isQC ? '↩ Повернути з відбраковки' : '+ Додати', '']);   // v17: протилежність вибуттю; v19: зав. відділу браку

/** v13: двигунів у ящику за замовчуванням (BOX_QTY з «Налаштувань», за типорозміром) */
function boxPer() { const m = (S.k2 && S.k2.box) || {}; return Number(m[String(S.batch.info['Типорозмір'])] || m['*'] || 200); }
/** Те саме правило, що й на сервері (Labels.gs): повні ящики по per, в останньому — решта; ящиків вписано інакше — порівну */
function labelsPlan(good, boxes, per) {
  if (good <= 0) return [];
  if (!(boxes > 0)) boxes = per > 0 ? Math.ceil(good / per) : 1;
  if (boxes > good) boxes = good;
  const out = [];
  if (per > 0 && (boxes - 1) * per < good && boxes * per >= good) { for (let i = 0; i < boxes - 1; i++) out.push(per); out.push(good - per * (boxes - 1)); return out; }
  const base = Math.floor(good / boxes), extra = good % boxes;
  for (let i = 0; i < boxes; i++) out.push(base + (i < extra ? 1 : 0));
  return out;
}
function labelsSummary(plan) {
  const g = []; plan.forEach(q => { const l = g[g.length - 1]; if (l && l.q === q) l.n++; else g.push({ q: q, n: 1 }); });
  return g.map(x => x.n + ' × ' + x.q + ' шт').join(' + ');
}

    // v13: + залишок статорів / роторів у партії MT; працівник бачить тільки залишок: в іншу партію MT або «годний залишок»
    const qc = S.me.role === 'зав. відділу браку';   // v17: Василь — лише «взяли на відбраковку», з будь-якого етапу
    const lead = !!S.perms.separateAll || qc;
    const qcOk = qc || S.me.role === 'адміністратор';
    const purp = S.dict.purposes.filter(x => qcOk || x !== S.qc);   // «відділ якості» при вибутті — тільки зав. відділу браку
    const st = (lead ? (S.batch.stages || []) : []).concat(S.batch.leftovers || []);

    const qcName = x => x === S.qc ? 'Взяли на відбраковку' : cap(x);
    openModal(head(qc ? 'Взяли на відбраковку' : lead ? 'Відокремити частину' : 'Залишок деталей') +
      '<label>Що відокремлюєте</label>' + st.map((x, k) => '<label class="opt"><input type="radio" name="stg" value="' + k + '"' + (k === 0 ? ' checked' : '') + '>' +
        '<b>' + x.qty + ' шт</b> · ' + esc(x.name) + ' <span class="muted">(' + (x.left ? 'без пари або ще не в двигунах' + (x.ver ? ' · ' + esc(x.ver) : '') : x.done ? 'усі кроки пройдено' : 'чекає ' + esc(x.wait)) + ')</span></label>').join('') +
      '<label>Куди</label><div class="seg wrap" id="dstBox"></div>' +
      '<div id="sepTare"><p class="muted" id="sepTareTxt"></p>' + tarePicker('tg', ['КР', 'СК', 'ПД', 'ТЧ']) + '</div>' +
      '<p class="muted" id="sepExit" style="display:none">Деталі виходять із виробничого циклу партії. У журнал запишеться, що саме вибуло і куди. Тара не потрібна.</p>' +
      '<label id="mqL">Кількість, шт</label>' + numInput('mq', '') +
      '<label id="cmL">Причина / коментар</label><input type="text" id="mcm">' + foot);
    const g = n => { const x = document.querySelector('input[name=' + n + ']:checked'); return x ? x.value : ''; };
    let lastLeft = null;
    const drawDst = o => {
      const left = !!(o && o.left);
      const list = qc ? [[S.qc, 'Взяли на відбраковку']]
        : left ? [['tare', 'В іншу партію MT']].concat((lead ? purp : ['годний залишок']).map(x => [x, qcName(x)]))
        : [['tare', 'За маршрутом, у тару']].concat(purp.filter(x => x !== 'годний залишок').map(x => [x, qcName(x)]));
      $('dstBox').innerHTML = list.map((x, k) => '<label><input type="radio" name="dst" value="' + esc(x[0]) + '"' + (k === 0 ? ' checked' : '') + '><span style="font-size:15px">' + esc(x[1]) + '</span></label>').join('');
      $('sepTareTxt').textContent = left ? 'Тара, де лежить інша партія двигунів (MT) у роботі — того самого типорозміру і KV.'
        : 'Вільна тара → нова партія з новим номером. Зайнята тара → деталі додадуться до партії в ній (стане «змішаною»).';
      const tt = $('tgt'); if (tt) tt.innerHTML = opts(left ? ['ТЧ', 'КР'] : ['КР', 'СК', 'ПД', 'ТЧ']);
      document.querySelectorAll('input[name=dst]').forEach(r => r.onchange = upd);
      if (left && !$('mq').value) $('mq').value = o.qty;
    };
    const upd = () => {
      const o = st[Number(g('stg'))] || {};
      if (lastLeft !== !!o.left) { lastLeft = !!o.left; drawDst(o); }
      const d = g('dst');
      $('mqL').textContent = 'Кількість, шт' + (o.qty ? ' (до ' + o.qty + ')' : '');
      $('sepTare').style.display = d === 'tare' ? 'block' : 'none'; $('sepExit').style.display = d === 'tare' ? 'none' : 'block';
      $('cmL').textContent = d === 'інше' ? 'Що це і куди (обов\'язково)' : 'Причина / коментар';
    };
    document.querySelectorAll('input[name=stg]').forEach(r => r.onchange = upd); upd();
    $('mgo').onclick = () => {
      const o = st[Number(g('stg'))]; const d = g('dst');
      if (!o) { $('merr').textContent = 'Оберіть, що відокремлюєте'; return; }
      act({ action: 'separate', batch: no, stage: o.stage, wait: o.wait, qty: $('mq').value, mode: d === 'tare' ? 'tare' : 'exit',
        target: d === 'tare' ? tareVal('tg') : '', purpose: d === 'tare' ? '' : d, comment: $('mcm').value }, $('mgo'));
    };
  }
  if (a === 'color') {   // v21: тімлід і вище — колір партії
    openModal(head('🎨 Колір партії') + colorField('mcl', S.batch.info['Потік'], S.batch.info['Колір']) + '<label>Коментар (необов\'язково)</label><input type="text" id="mcm">' + foot);
    $('mgo').onclick = () => act({ action: 'setColor', batch: no, color: $('mcl').value, comment: $('mcm').value }, $('mgo'));
  }
  if (a === 'free') {
    openModal(head('Звільнити тару ' + esc(S.tare.code)) + '<label>Причина</label><select id="mr">' +
      opts(['партію фізично переклали без запису', 'тара пошкоджена', 'інше']) + '</select><label>Коментар</label><input type="text" id="mcm">' + foot);
    $('mgo').onclick = () => act({ action: 'free', tare: S.tare.code, reason: $('mr').value, comment: $('mcm').value }, $('mgo'));
  }
  if (a === 'addComp') {   // v13: «+ Статори / ротори» — наша партія ST / RT, постачальник, в1 / в2 без номера
    openModal(head('+ Статори / ротори') +
      '<label>Що</label><div class="seg"><label><input type="radio" name="cmp" value="S" checked><span>Статори</span></label>' +
      '<label><input type="radio" name="cmp" value="R"><span>Ротори</span></label></div><div id="acBox"></div>' +
      '<p class="muted">Брак однієї деталі на F1 — доберіть сюди пару і зберіть ще двигун.</p>' + foot);
    const k = () => (document.querySelector('input[name=cmp]:checked') || {}).value === 'R' ? 'R' : 'S';
    const draw = () => { LOTF_reset(); $('acBox').innerHTML = compBlock(k(), 'ac', false); wireComp(k(), 'ac', () => ({ batch: no }), ''); };
    document.querySelectorAll('input[name=cmp]').forEach(r => r.onchange = draw); draw();
    $('mgo').onclick = () => {
      if (!compSrc('ac')) { $('merr').textContent = 'Оберіть, звідки деталі'; return; }
      $('mgo').disabled = true;
      lotWait().then(() => {   // v17: фото етикетки в1 — дочекатися посилання
        $('mgo').disabled = false;
        const c = compVal(k(), 'ac');
        act({ action: 'addComp', batch: no, comp: k() === 'R' ? 'ротор' : 'статор', src: c.src, ref: c.ref, lot: c.lot, photo: c.photo, qty: c.qty }, $('mgo'));
      });
    };
  }
  if (a === 'add') {   // v17: «+ Додати» — деталі ззовні циклу (з відділу якості, R&D …) на обраний етап; коментар обов'язковий
    const R = S.batch.route; const i1 = S.batch.comp ? R.findIndex(x => x.code === 'F1') : -1;
    const stages = (S.batch.comp ? [] : [['', 'до першого кроку · ' + ({ ST: 'ядро статора', RT: 'ротортоп і вал' }[S.batch.info['Потік']] || '')]])
      .concat(R.filter((x, k) => k >= i1).map(x => [x.code, 'після ' + x.code + ' · ' + (x.product || x.name)]));
    if (S.me && S.me.role === 'зав. відділу браку') {   // v19: повернення з відбраковки — етап як востаннє брали з цієї партії
      const live = S.batch.history.filter(x => !x.cancelled && x.purpose === S.qc);
      const took = live.filter(x => x.type === 'вибуття').reduce((t, x) => t + (Number(x.qty) || 0), 0);
      const back = live.filter(x => x.type === 'додавання').reduce((t, x) => t + (Number(x.qty) || 0), 0);
      const last = live.find(x => x.type === 'вибуття' && !x.left);
      const def = last && stages.some(x => x[0] === String(last.step || '')) ? String(last.step || '') : '';
      openModal(head('↩ Повернути з відбраковки') +
        (took || back ? '<p class="muted">З цієї партії взято на відбраковку ' + took + ' шт, повернуто ' + back + ' шт.</p>' : '') +
        '<label>Що повертаєте (на якому етапі)</label><select id="adSt">' + stages.map(x => '<option value="' + esc(x[0]) + '"' + (x[0] === def ? ' selected' : '') + '>' + esc(x[1]) + '</option>').join('') + '</select>' +
        '<label>Кількість, шт</label>' + numInput('mq', '') +
        '<label>Коментар (необов\'язково)</label><input type="text" id="mcm">' + foot);
      $('mgo').onclick = () => act({ action: 'add', batch: no, stage: $('adSt').value, qty: $('mq').value, comment: $('mcm').value }, $('mgo'));
      return;
    }
    openModal(head('+ Додати') +
      '<p class="muted">Деталі, що повертаються ззовні — з відділу якості, R&D, знайдені. Із іншої партії — «✂ Відокремити» на її картці' + (S.batch.comp ? '; статори й ротори — «+ Статори / ротори»' : '') + '.</p>' +
      '<label>Що додаєте (на якому етапі)</label><select id="adSt">' + stages.map(x => '<option value="' + esc(x[0]) + '">' + esc(x[1]) + '</option>').join('') + '</select>' +
      '<label>Звідки</label><select id="adFrom">' + opts(S.dict.purposes, '', '— оберіть —') + '</select>' +
      '<label>Кількість, шт</label>' + numInput('mq', '') +
      '<label>Коментар (обов\'язково)</label><input type="text" id="mcm" placeholder="що це і чому повертається">' + foot);
    $('mgo').onclick = () => act({ action: 'add', batch: no, stage: $('adSt').value, purpose: $('adFrom').value, qty: $('mq').value, comment: $('mcm').value }, $('mgo'));
  }
  if (a === 'annul') {
    openModal(head('Анулювати партію') + '<p class="muted">Тільки якщо партію створено помилково і кроків ще немає.</p><label>Причина</label><input type="text" id="mcm">' + foot);
    $('mgo').onclick = () => act({ action: 'annul', batch: no, comment: $('mcm').value }, $('mgo'));
  }
}
/** v13: «✉ Етикетки ще раз» для запису K2 — з потрібної позиції на аркуші наліпок (1–21) */

  const text = x && x.type === 'видача' ? 'Скасувати видачу ' + partsWhat(x) + ' ' + x.batch + ' → ' + x.target + '? Деталі повернуться в ' + x.batch + '.'
    : x && PARTS.indexOf(x.type) >= 0 ? 'Скасувати запис: + ' + partsWhat(x) + ' ' + partsVer(x) + ' у ' + x.batch + '?'
    : 'Скасувати свій запис ' + id + '?';

/** v14 (T-46): записи, якими статори / ротори приходять у партію MT */
const PARTS = ['видача', 'покупні', 'власні'];
function partsKey(x) { return x.type === 'видача' ? (String(x.batch).indexOf('ST') === 0 ? 'S' : 'R') : (x.comp === 'ротор' ? 'R' : 'S'); }
function plural(n, one, few, many) { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many; }
function partsWhat(x, n) { n = n === undefined ? x.qty : n; return n + (partsKey(x) === 'S' ? ' статор' : ' ротор') + plural(n, '', 'и', 'ів'); }
function partsVer(x) { return x.type === 'власні' ? 'в2 без номера' : x.comment ? 'в1 · партія постачальника ' + x.comment : 'в1 без номера'; }
/** v14 (T-46): ✎ тімліда — нова кількість (більше або менше) або «Скасувати запис», з причиною */
function openCorrectParts(id) {
  const x = S.batch.history.find(h => h.id === id);
  const issue = x.type === 'видача'; const mt = issue ? x.target : x.batch;
  const nm = partsKey(x) === 'S' ? 'статорів' : 'роторів';
  const head = issue ? 'Видача ' + nm + ' ' + x.batch + ' → ' + x.target : (partsKey(x) === 'S' ? 'Статори ' : 'Ротори ') + partsVer(x) + ' у ' + x.batch;
  openModal('<div class="card"><div class="mid">Виправити кількість</div><div class="muted">' + esc(head) + '<br>' + esc(x.who) + ' · ' + esc(x.time) +
    ' · зараз ' + x.qty + ' шт' + (x.corrected && x.was !== '' ? ' (спершу записали ' + x.was + ')' : '') + '</div>' +
    '<label>Скільки насправді, шт</label>' + numInput('pq', x.qty) +
    '<p class="muted">' + (issue ? 'Більше — різницю буде взято з ' + esc(x.batch) + ', якщо там є. Менше — різниця повернеться в ' + esc(x.batch) + '. '
      : 'Більше або менше — як було насправді. ') + 'Зменшити можна лише на стільки ' + nm + ', скільки в ' + esc(mt) + ' ще не зібрано.</p>' +
    '<label>Причина (обов\'язково)</label><input type="text" id="mcm" placeholder="напр. фізично взяли 20, а записали 30">' +
    '<div class="err" id="merr"></div><div class="grid" style="margin-top:6px"><button class="btn btn2 btnr" id="cdel">Скасувати запис</button><button class="btn" id="mgo">Зберегти</button></div>' +
    '<button class="btn btn2" onclick="closeModal()">Закрити</button></div>');
  $('mgo').onclick = () => act({ action: 'correct', ref: id, qty: $('pq').value, comment: $('mcm').value }, $('mgo'), r => showPage(r, { openHist: 1 }));
  $('cdel').onclick = () => act({ action: 'correct', ref: id, cancel: true, comment: $('mcm').value }, $('cdel'), r => showPage(r, { openHist: 1 }));
}

// =============================================================== ДАШБОРДИ: «Стан зараз» (Р-2а), «Тара» (Р-5), «Мій виробіток» (Р-3а)
let DB = null;
const DF = { loc: '', flow: 'ST', typ: 'all', kv: 'all', step: '', per: 'today', only: 'all', more: '', fl: 'all' };   // v17: fl — поверх; loc '' — ще не обрано (за замовчуванням — локація тімліда)
/** v17: поверх кроку code у локації loc для типорозміру typ (аркуш «Поверхи»); '' — не вказано */
function floorOf(loc, code, typ) { const m = DB && DB.floors && DB.floors[loc] && DB.floors[loc][code]; return m ? (m[String(typ || '')] || m['*'] || '') : ''; }
function floorsAt(loc) { const m = (DB && DB.floors && DB.floors[loc]) || {}; const o = {}; Object.keys(m).forEach(c => Object.keys(m[c]).forEach(t => o[m[c][t]] = 1)); return Object.keys(o).sort(); }
function floorChips() {
  if (DF.loc === 'all' || !floorsAt(DF.loc).length) return '';
  return chips('fl', [['all', 'Усі поверхи']].concat(floorsAt(DF.loc).map(f => [f, f + ' поверх'])));
}
const FLOWN = { ST: ['Статори', 'статорів'], RT: ['Ротори', 'роторів'], MT: ['Двигуни', 'двигунів'], all: ['Усі', 'деталей і двигунів'] };   // v25: all — усі потоки
const LOCN = { 'П': 'Печерськ', 'Ж': 'Жуляни' };
function fn(n) { return Math.round(Number(n) || 0).toLocaleString('uk-UA'); }
function pct(a, b) { return b ? (a / b * 100).toFixed(1).replace('.', ',') + ' %' : ''; }
function loadDash() {

    .withFailureHandler(e => {

      $('app').innerHTML = '<div class="card err">' + esc(e.message) + '</div>' +
        '<a class="btn btn2" style="display:block;text-align:center;text-decoration:none;margin:12px;width:auto" href="' + esc(link('')) + '">На головну</a>';
    }).apiDash({ code: CODE, d: PARAMS.d, per: PARAMS.per || 'w' });
}
function dset(k, v) {
  DF[k] = (k === 'step' && DF.step === v) ? '' : v;
  if (k === 'flow') { DF.step = ''; DF.kv = 'all'; DF.typ = 'all'; }

}
function hbars(rows) {

  }).join('') + '</div>';

/** Р-2а «Стан зараз» (ДШ-1): що лежить на кожному кроці, які партії стоять, що пішло в брак */
function dashStan() {
  const d = DB;
  // v25: «Усі» — кроки всіх трьох маршрутів підряд (5-й елемент — потік); v20: маршрут типорозміру
  const FL = DF.flow === 'all' ? ['ST', 'RT', 'MT'] : [DF.flow];
  const R0 = [].concat(...FL.map(f => ((DF.typ !== 'all' && d.routesT && d.routesT[f + '|' + DF.typ]) || d.routes[f] || []).map(x => x.slice(0, 4).concat([f]))));
  const flowOk = x => DF.flow === 'all' || x.stream === DF.flow;
  const nm = c => (R0.find(x => x[0] === c) || [c, ''])[1];
  const locOk = l => DF.loc === 'all' || String(l || '').charAt(0) === DF.loc;
  const fit = x => (DF.typ === 'all' || x.typ === DF.typ) && (DF.kv === 'all' || x.kv === DF.kv);
  // v17: поверх — за кроком (аркуш «Поверхи»), у локації тари партії / запису
  const flOn = DF.loc !== 'all' && DF.fl !== 'all';
  const tp = DF.typ === 'all' ? '' : DF.typ;
  const R = flOn ? R0.filter(x => floorOf(DF.loc, x[0], tp) === DF.fl) : R0;
  const bWaitFl = b => Object.keys(b.wait).some(c => floorOf(String(b.loc || '').charAt(0), c, b.typ) === DF.fl);
  const bs0 = d.batches.filter(b => flowOk(b) && locOk(b.loc) && fit(b) && (!flOn || bWaitFl(b)));
  const bs = DF.step ? bs0.filter(b => b.wait[DF.step]) : bs0;
  const stuck = bs.filter(b => b.stuck);
  const recLoc = r => String(r.floor || '').charAt(0) || 'П';
  const recOk = r => r.isStep && flowOk(r) && r.p === DF.per && (DF.loc === 'all' || recLoc(r) === DF.loc) && fit(r) && (!flOn || floorOf(recLoc(r), r.step, r.typ) === DF.fl);
  const rs = d.recs.filter(r => recOk(r) && (!DF.step || r.step === DF.step));
  const lastCode = R.length ? R[R.length - 1][0] : '';
  const doneStep = DF.step || lastCode;
  // v20: «Готових» — останній крок маршруту типорозміру запису (ST 3115 — S13, 4320 — S9.3)

  const done = d.recs.filter(r => recOk(r) && (DF.step ? r.step === DF.step : finOf(r).indexOf(r.step) >= 0)).reduce((a, r) => a + r.good, 0);
  const finAll = [...new Set(d.recs.filter(r => flowOk(r) && (DF.typ === 'all' || r.typ === DF.typ)).map(finOf).flat())];
  const doneBy = f => d.recs.filter(r => recOk(r) && r.stream === f && finOf(r).indexOf(r.step) >= 0).reduce((a, r) => a + r.good, 0);   // v25
  const scr = rs.reduce((a, r) => a + r.scrap, 0);
  const ctl = {}; R.forEach(x => ctl[x[0]] = x[2] === 'К');
  const chk = rs.filter(r => ctl[r.step]).reduce((a, r) => a + r.good + r.scrap, 0);
  const flagged = d.recs.filter(r => r.flagged && r.p === DF.per).length;
  const perL = DF.per === 'today' ? 'сьогодні' : 'за ' + d.prevLabel;
  const typs = [...new Set(d.batches.filter(flowOk).map(b => b.typ).concat(d.recs.filter(flowOk).map(r => r.typ)))].filter(x => x).sort();
  const kvs = [...new Set(d.batches.filter(b => flowOk(b) && (DF.typ === 'all' || b.typ === DF.typ)).map(b => b.kv))].filter(x => x).sort((a, b) => a - b);
  let h = '<div class="fl">' + chips('loc', [['all', 'Усі'], ['П', 'Печерськ'], ['Ж', 'Жуляни']]) + floorChips() + chips('flow', [['all', 'Усі'], ['ST', 'Статори'], ['RT', 'Ротори'], ['MT', 'Двигуни']]) +
    chips('per', [['today', 'Сьогодні']].concat(d.prevLabel ? [['prev', d.prevLabel]] : [])) + dsel('typ', 'Типорозмір', typs) + dsel('kv', 'KV', kvs) +
    (DF.step ? '<div class="chips"><button type="button" class="on" onclick="dset(\'step\',\'' + esc(DF.step) + '\')">Крок ' + esc(DF.step) + ' ✕</button></div>' : '') + '</div>';
  h += '<div class="kpis" style="margin:12px">' +
    (DF.flow === 'all' && !DF.step   // v25: усі потоки — готові окремо, бо статори, ротори й двигуни не додаються
      ? kpi('Готових ' + perL, fn(doneBy('MT')), 'двигунів', 'статорів ' + fn(doneBy('ST')) + ' · роторів ' + fn(doneBy('RT')))
      : kpi(DF.step ? 'Записано на ' + esc(DF.step) + ' ' + perL : 'Готових ' + FLOWN[DF.flow][1] + ' ' + perL, fn(done), 'шт', esc(DF.step || !finAll.length ? doneStep + ' · ' + nm(doneStep) : finAll.length === 1 ? finAll[0] + ' · ' + nm(finAll[0]) : 'останній крок маршруту: ' + finAll.join(', ')))) +
    kpi('У роботі', bs.length, 'партій', fn(bs.reduce((a, b) => a + (DF.step ? b.wait[DF.step] : Math.max(0, b.rem)), 0)) + ' шт у тарі') +
    kpi('Брак ' + perL, fn(scr), 'шт', chk ? pct(scr, chk) + ' від перевірених' : '') +

    (flagged ? kpi('Записи з невідомих акаунтів', flagged, '', 'чекають тімліда') : '') +

  h += readyCard(d, perL, doneBy('MT'), recOk);   // v26: блок «Готово»

  if (fin) rows.push({ l: '<b>✓</b> <span class="muted">пройшли маршрут, у тарі</span>', v: fin, t: fn(fin) + ' шт', c: '#1F7A4D' });
  h += dcard('Де зараз ' + FLOWN[DF.flow][1] + ' · за кроками', 'Скільки штук чекає кожен крок. Натисніть крок — решта покаже тільки його.' +
    (DF.flow === 'RT' && DF.kv !== 'all' ? ' KV ротора відомий з F4, тому партії до F4 за фільтром KV не видно.' : ''),
    bs0.length || fin ? hbars(rows) : '<p class="muted">' + (DF.loc === 'Ж' && DF.flow !== 'MT' && DF.flow !== 'all' ? 'На Жулянах ' + FLOWN[DF.flow][1] + ' не виготовляють.' : 'За цими фільтрами партій у роботі немає.') + '</p>');
  // партії
  const list = (DF.only === 'stuck' ? stuck : bs).slice().sort((a, b) => b.idle - a.idle || a.no.localeCompare(b.no));
  const shown = DF.more ? list : list.slice(0, 15);
  h += dcard('Партії в роботі' + (DF.step ? ': крок ' + esc(DF.step) : ''), bs.length + ' партій, з них без руху ' + stuck.length,
    chips('only', [['all', 'Усі'], ['stuck', 'Тільки без руху']]) + (list.length ? '<div class="tw" style="margin-top:10px"><table class="t"><tr><th>Партія</th><th>Тип · KV</th><th>Крок</th><th>Тара</th><th class="r">шт</th><th>Останній запис</th></tr>' +
      shown.map(b => '<tr><td>' + bl(b.no) + '</td><td>' + esc(b.typ) + (b.kv ? ' · ' + esc(b.kv) : '') + '</td><td>' + esc(b.step || '—') +
        (b.purpose ? ' <span class="pill warn" style="margin:0">' + esc(b.purpose) + '</span>' : '') + '</td><td>' + esc(b.tare ? b.tare + (b.tare2 ? ' + ' + b.tare2 : '') : '⚠ без тари') + '</td><td class="r">' +
        fn(DF.step ? b.wait[DF.step] : b.rem) + '</td><td>' + esc(b.last || '—') + (b.stuck ? ' <span class="pill bad" style="margin:0">' + b.idle + ' дн.</span>' : '') + '</td></tr>').join('') +
      '</table></div>' + (list.length > 15 ? '<button type="button" class="ic" style="margin-top:8px" onclick="dset(\'more\',DF.more?\'\':\'1\')">' + (DF.more ? 'Згорнути' : 'Показати всі ' + list.length) + '</button>' : '')
      : '<p class="muted">Немає партій за цими фільтрами.</p>'));
  // брак за причинами
  const rz = {}; rs.forEach(r => { if (r.scrap) rz[r.reason || '—'] = (rz[r.reason || '—'] || 0) + r.scrap; });
  const rr = Object.keys(rz).sort((a, b) => rz[b] - rz[a]);
  h += dcard('Брак ' + perL + ' за причинами', DF.step ? 'Крок ' + esc(DF.step) : '', rr.length ? hbars(rr.map(k => ({ l: esc(k), v: rz[k], t: fn(rz[k]) + ' шт', c: '#B3261E' }))) : '<p class="muted">Браку немає.</p>');
  // успішні операції за поверхами (v17: поверх — за кроком, аркуш «Поверхи»; локація — з запису)
  // v23: усі потоки (ротори й двигуни — 3 поверх), обрані період і локація; поверх і типорозмір-фільтри тут не діють
  const rsAll = d.recs.filter(r => r.isStep && r.p === DF.per && (DF.loc === 'all' || recLoc(r) === DF.loc));
  const fl = {}; rsAll.forEach(r => { const f = floorOf(recLoc(r), r.step, r.typ); const k = f ? recLoc(r) + f : '—'; fl[k] = (fl[k] || 0) + r.good; });
  const sn = c => (d.sites.find(x => x.code === c) || { name: c === '—' ? 'поверх не вказано' : (LOCN[c.charAt(0)] || c.charAt(0)) + ', ' + c.slice(1) + ' поверх' }).name;
  const fk = Object.keys(fl).sort();
  h += dcard('Успішні операції ' + perL + ' за поверхами', 'Усі потоки — статори, ротори, двигуни. Сума всіх кроків: деталь рахується стільки разів, скільки кроків пройшла',
    fk.length ? hbars(fk.map(k => ({ l: '<b>' + esc(k) + '</b> <span class="muted">' + esc(sn(k)) + '</span>', v: fl[k], t: fn(fl[k]) + ' шт' }))) : '<p class="muted">Записів немає.</p>');
  return h;
}

/** v26: блок «Готово» у «Стан зараз». Статори / ротори — партії ST / RT, що пройшли маршрут і ще мають штуки в тарі
 *  (зникають, коли їх беруть у партію MT); у збиранні — залишок деталей у партіях MT, ще не зібраний (F1);
 *  двигуни — пройшли K2 за обраний день (передачі на склад у МЛП поки немає, тому залишок готових двигунів не показуємо).
 *  Фільтри: локація (тара партії), типорозмір, KV, потік; поверх і крок тут не діють. */
function readyCard(d, perL, motorsDone, recOk) {
  const locOk = l => DF.loc === 'all' || String(l || '').charAt(0) === DF.loc;
  const fit = x => (DF.typ === 'all' || x.typ === DF.typ) && (DF.kv === 'all' || x.kv === DF.kv);
  const showS = DF.flow === 'all' || DF.flow === 'ST', showR = DF.flow === 'all' || DF.flow === 'RT', showM = DF.flow === 'all' || DF.flow === 'MT';
  const rdy = d.batches.filter(b => (b.stream === 'ST' || b.stream === 'RT') && (b.status === 'готово' || b.status === 'видано частково') && b.rem > 0 &&
    locOk(b.loc) && fit(b) && (b.stream === 'ST' ? showS : showR));
  const sum = s => { const x = rdy.filter(b => b.stream === s); return { n: x.length, q: x.reduce((a, b) => a + b.rem, 0) }; };
  const S0 = sum('ST'), R0 = sum('RT');
  const asm = d.batches.filter(b => b.stream === 'MT' && b.cl && b.status === 'в роботі' && locOk(b.loc) && fit(b));
  const aS = asm.reduce((a, b) => a + b.cl.S, 0), aR = asm.reduce((a, b) => a + b.cl.R, 0);
  const line = (l, v, sub) => '<div class="li"><div><b>' + l + '</b>' + (sub ? '<br><span class="muted">' + sub + '</span>' : '') + '</div><div class="r"><b>' + v + '</b></div></div>';
  let body = '<div class="list" style="padding:0">' +
    (showS ? line('Статори готові до збирання', fn(S0.q) + ' шт', S0.n + ' ' + plural(S0.n, 'партія', 'партії', 'партій') + ' у тарі') : '') +
    (showR ? line('Ротори готові до збирання', fn(R0.q) + ' шт', R0.n + ' ' + plural(R0.n, 'партія', 'партії', 'партій') + ' у тарі · KV вигравіювано (F4)') : '') +
    (showM && (aS || aR) ? line('У збиранні', fn(aS) + ' / ' + fn(aR) + ' шт', 'статори / ротори вже в партіях двигунів, ще не зібрані (F1) · партій MT: ' + asm.filter(b => b.cl.S || b.cl.R).length) : '') +
    (showM ? line('Двигуни готові ' + perL, fn(motorsDone) + ' шт', 'пройшли K2 · передачі на склад у МЛП ще немає') : '') + '</div>';
  // за типорозміром і KV: статори, ротори і скільки пар можна зібрати з наших
  if (rdy.length && DF.flow === 'all') {
    const g = {};
    rdy.forEach(b => { const k = b.typ + '|' + (b.kv || '—'); const x = g[k] = g[k] || { ST: [0, 0], RT: [0, 0] }; x[b.stream][0]++; x[b.stream][1] += b.rem; });
    const ks = Object.keys(g).sort((a, b) => a.split('|')[0].localeCompare(b.split('|')[0]) || (Number(a.split('|')[1]) || 0) - (Number(b.split('|')[1]) || 0));
    const c = x => x[1] ? fn(x[1]) + ' <span class="muted">(' + x[0] + ')</span>' : '<span class="muted">—</span>';
    body += '<div class="tw" style="margin-top:12px"><table class="t"><tr><th>Тип · KV</th><th class="r">Статори</th><th class="r">Ротори</th><th class="r">Пар з наших</th></tr>' +
      ks.map(k => { const [t, kv] = k.split('|'); const x = g[k];
        return '<tr><td>' + esc(t) + ' · ' + esc(kv) + '</td><td class="r">' + c(x.ST) + '</td><td class="r">' + c(x.RT) + '</td><td class="r">' + fn(Math.min(x.ST[1], x.RT[1])) + '</td></tr>'; }).join('') +
      '</table></div><p class="muted" style="margin:6px 0 0">шт (партій). «Пар з наших» — без покупних (в1) статорів і роторів.</p>';
  }
  if (rdy.length) {
    const ls = rdy.slice().sort((a, b) => a.stream.localeCompare(b.stream) || b.idle - a.idle || a.no.localeCompare(b.no));
    body += '<details style="margin-top:10px"><summary>Партії (' + ls.length + ')</summary><div class="tw"><table class="t"><tr><th>Партія</th><th>Тип · KV</th><th>Тара</th><th class="r">шт</th><th>Останній запис</th></tr>' +
      ls.map(b => '<tr><td>' + bl(b.no) + '</td><td>' + esc(b.typ) + (b.kv ? ' · ' + esc(b.kv) : '') + (b.color ? ' · ' + esc(b.color) : '') + '</td><td>' +
        esc(b.tare ? b.tare + (b.tare2 ? ' + ' + b.tare2 : '') : '⚠ без тари') + '</td><td class="r">' + fn(b.rem) + '</td><td>' + esc(b.last || '—') +
        (b.stuck ? ' <span class="pill bad" style="margin:0">' + b.idle + ' дн.</span>' : '') + '</td></tr>').join('') + '</table></div></details>';
  }
  return dcard('Готово', 'Статори й ротори зникають звідси, коли їх беруть у партію двигунів («+ Статори / ротори» на картці MT).', body);
}

/** Р-5 «Тара» (ДШ-6): чи вистачає тари і яка тара зависла */
function dashTare() {
  const d = DB;
  const locOk = l => DF.loc === 'all' || String(l || '').charAt(0) === DF.loc;
  const gs = d.groups.filter(g => locOk(g.loc));
  // v17: поверх тари — за наступним кроком партії в ній (аркуш «Поверхи»)
  d.busy.forEach(b => b.fl = b.next ? floorOf(String(b.loc || '').charAt(0), b.next, b.typ) : '');
  const flOn = DF.loc !== 'all' && DF.fl !== 'all';
  const busy = d.busy.filter(b => locOk(b.loc) && (!flOn || b.fl === DF.fl));
  const shown = DF.more ? busy : busy.slice(0, 20);
  let h = '<div class="fl">' + chips('loc', [['all', 'Усі'], ['П', 'Печерськ'], ['Ж', 'Жуляни']]) + floorChips() + '</div>';
  const tot = gs.reduce((a, g) => [a[0] + g.busy, a[1] + g.free, a[2] + g.out], [0, 0, 0]);
  h += '<div class="kpis" style="margin:12px">' + kpi('Зайнята', fn(tot[0]), 'шт', pct(tot[0], tot[0] + tot[1] + tot[2]) + ' усієї тари') +
    kpi('Вільна', fn(tot[1]), 'шт', tot[2] ? 'виведено: ' + tot[2] : '') +
    kpi('Без руху ≥ ' + d.idleDays + ' дн.', busy.filter(b => b.idle >= d.idleDays).length, 'шт тари', 'партія в ній не рухається') + '</div>';
  h += dcard('Тара за типами й локаціями', '<span style="color:#2F4858">■</span> зайнята · <span style="color:#C5D0D7">■</span> вільна · <span style="color:#66767F">■</span> виведена',
    '<div class="tw"><table class="t"><tr><th>Тип</th><th>Локація</th><th style="width:34%">Стан</th><th class="r">Зайнято</th><th class="r">Вільно</th></tr>' + gs.map(g => {
      const n = g.busy + g.free + g.out || 1;
      return '<tr><td><b>' + esc(g.type) + '</b></td><td>' + esc(LOCN[g.loc] || g.loc) + '</td><td><div class="sp"><i style="display:block;width:' + (g.busy / n * 100) + '%;background:#2F4858"></i>' +
        '<i style="display:block;width:' + (g.free / n * 100) + '%;background:#C5D0D7"></i>' + (g.out ? '<i style="display:block;width:' + (g.out / n * 100) + '%;background:#66767F"></i>' : '') + '</div></td>' +
        '<td class="r">' + g.busy + ' з ' + n + '</td><td class="r">' + (g.free < n * 0.2 ? '<span class="pill warn" style="margin:0">' + g.free + '</span>' : g.free) + '</td></tr>';
    }).join('') + '</table></div>');
  h += dcard('Зайнята тара: найдовше без руху зверху', busy.length + ' шт',
    busy.length ? '<div class="tw"><table class="t"><tr><th>Тара</th><th>Пов.</th><th>Партія</th><th>Крок</th><th class="r">шт</th><th>Зайнята з</th><th class="r">Без руху</th></tr>' +
      shown.map(b => '<tr><td><a class="lnk" href="' + esc(link('t=' + encodeURIComponent(b.code))) + '">' + esc(b.code) + '</a>' + (b.pair ? '<br><span class="muted">пара: ' + esc(b.pair) + '</span>' : '') + '</td><td>' + esc(b.fl || '—') + '</td><td>' + (b.batch ? bl(b.batch) : '—') + '</td><td>' + esc(b.step) + (b.next ? ' → ' + esc(b.next) : '') +
        '</td><td class="r">' + fn(b.qty) + '</td><td>' + esc(b.since) + '</td><td class="r">' + (b.idle >= d.idleDays ? '<span class="pill bad" style="margin:0">' + b.idle + ' дн.</span>' : b.idle + ' дн.') + '</td></tr>').join('') +
      '</table></div>' + (busy.length > 20 ? '<button type="button" class="ic" style="margin-top:8px" onclick="dset(\'more\',DF.more?\'\':\'1\')">' + (DF.more ? 'Згорнути' : 'Показати всі ' + busy.length) + '</button>' : '')
      : '<p class="muted">Уся тара вільна.</p>');
  return h;
}

/** Р-3а «Мій виробіток» (ДШ-5): свої записи за тиждень або місяць */
function setPer(v) { PARAMS.per = v; setUrl(); loadDash(); }
function dashMy() {
  const d = DB;
  const rows = d.rows, nb = d.noBatch;
  const good = rows.reduce((a, r) => a + r.good, 0), scr = rows.reduce((a, r) => a + r.scrap, 0);
  const nbat = new Set(rows.map(r => r.batch)).size;
  let h = '<div class="fl"><div class="chips">' + [['w', 'Тиждень'], ['m', 'Місяць']].map(x =>
    '<button type="button" class="' + (d.per === x[0] ? 'on' : '') + '" onclick="setPer(\'' + x[0] + '\')">' + x[1] + '</button>').join('') + '</div>' +
    '<span class="muted" style="align-self:center">з ' + esc(d.from) + '</span></div>';
  h += '<div class="kpis" style="margin:12px">' + kpi('Успішних операцій', fn(good), 'шт', 'у ' + nbat + ' партіях') + kpi('Брак', fn(scr), 'шт', '') + '</div>';
  // за днями
  const byDay = {}; rows.forEach(r => byDay[r.date] = (byDay[r.date] || 0) + r.good);
  const mx = Math.max(1, ...d.days.map(x => byDay[x] || 0));
  const dense = d.days.length > 10;
  h += dcard('За днями', 'Успішні операції, шт', '<div class="cols">' + d.days.map(x => '<div style="height:' + ((byDay[x] || 0) / mx * 100) + '%">' +
      (!dense && byDay[x] ? '<span>' + fn(byDay[x]) + '</span>' : '') + '</div>').join('') + '</div>' +
    '<div class="xl">' + d.days.map((x, i) => '<span>' + (!dense || i % 5 === 0 ? esc(x) : '') + '</span>').join('') + '</div>');
  // за роботами
  const bs = {}; rows.forEach(r => { const k = r.step; bs[k] = bs[k] || { n: r.name, g: 0, s: 0, ctl: r.ctl }; bs[k].g += r.good; bs[k].s += r.scrap; });
  const ks = Object.keys(bs).sort((a, b) => bs[b].g - bs[a].g);
  h += dcard('За роботами', ks.some(k => bs[k].ctl) ? 'Контроль (тест, перевірка): у ЗП рахуються перевірені — успішні + брак (З-05)' : '',
    ks.length ? hbars(ks.map(k => ({ l: '<b>' + esc(k) + '</b> <span class="muted">' + esc(bs[k].n) + '</span>', v: bs[k].g,
      t: fn(bs[k].g) + ' шт' + (bs[k].ctl && bs[k].s ? ' <span class="muted">· перевірено ' + fn(bs[k].g + bs[k].s) + '</span>' : '') }))) : '<p class="muted">Записів кроків немає.</p>');
  // за партіями
  const shown = DF.more ? rows : rows.slice(0, 20);
  if (rows.length) h += dcard('За партіями', rows.length + ' записів',
    '<div class="tw"><table class="t"><tr><th>Дата</th><th>Партія</th><th>Крок</th><th class="r">Успішних</th><th class="r">Брак</th></tr>' +
    shown.map(r => '<tr><td>' + esc(r.date) + ' <span class="muted">' + esc(r.time) + '</span></td><td>' + bl(r.batch) + '</td><td>' + esc(r.step) + '</td><td class="r">' + fn(r.good) +
      '</td><td class="r">' + (r.scrap || '—') + '</td></tr>').join('') + '</table></div>' +
    (rows.length > 20 ? '<button type="button" class="ic" style="margin-top:8px" onclick="dset(\'more\',DF.more?\'\':\'1\')">' + (DF.more ? 'Згорнути' : 'Показати всі ' + rows.length) + '</button>' : ''));
  if (nb.length) h += dcard('Робота без партії', '', '<div class="tw"><table class="t"><tr><th>Дата</th><th>Робота</th><th class="r">Кількість</th></tr>' +
    nb.map(r => '<tr><td>' + esc(r.date) + '</td><td>' + esc(r.work) + (r.comment ? '<br><span class="muted">' + esc(r.comment) + '</span>' : '') + '</td><td class="r">' +
      (r.hours ? String(r.hours).replace('.', ',') + ' год' : fn(r.qty) + ' шт') + '</td></tr>').join('') + '</table></div>');
  return h;
}

// =============================================================== ІСТОРІЯ ПАРТІЇ (Р-7, тімлід і вище)
let HB = null; let HF = 'all';

  $('hdrTitle').textContent = 'історія';

    }).apiHistory({ code: CODE, b: PARAMS.h });
}
function histMail(btn) {
  btn.disabled = true; btn.textContent = 'Надсилаю…';
  google.script.run.withSuccessHandler(r => { btn.disabled = false; btn.textContent = '✉ Надіслати таблицю на пошту'; toast(r.msg); })
    .withFailureHandler(e => { btn.disabled = false; btn.textContent = '✉ Надіслати таблицю на пошту'; toast(e.message, true); })
    .apiHistory({ code: CODE, b: PARAMS.h, email: true });
}
function histTree(nodes, dir) {
  if (!nodes.length) return '<p class="muted">' + (dir === 'in' ? 'Деталі з інших партій не надходили.' : 'Деталі в інші партії не йшли.') + '</p>';
  const one = n => {
    const l = n.link; const other = dir === 'in' ? l.from : l.to;
    const head = (dir === 'in' ? '← ' : '→ ') + '<b>' + l.qty + ' шт</b> ' + (dir === 'in' ? 'з ' : '') +
      (other ? bl(other) : '<b>' + esc(l.purpose || l.type) + '</b>') + ' · ' + esc(l.type) + (l.product ? ' · ' + esc(l.product) : (l.step ? ' · ' + esc(l.step) : ''));
    return '<div style="margin-left:' + ((n.level - 1) * 14) + 'px;border-left:2px solid #E3EAEF;padding:6px 0 6px 10px">' +
      '<div class="' + (l.cancelled ? 'x' : '') + '">' + head + '</div><div class="muted" style="font-size:13px">' + esc(l.time) + ' · ' + esc(l.who) +
      (n.batch ? ' · ' + esc(n.batch.status) : '') + (l.comment ? ' · ' + esc(l.comment) : '') +
      (l.cancelled ? '<br>скасовано ' + esc(l.cancelled.time) + ' · ' + esc(l.cancelled.who) + (l.cancelled.comment ? ' · ' + esc(l.cancelled.comment) : '') : '') +
      (n.repeat ? ' · див. вище' : '') + (n.more ? ' · далі не показано' : '') + '</div></div>' + n.children.map(one).join('');
  };
  return nodes.map(one).join('');
}
function histWhat(x) {
  const own = x.batch === HB.info.no;
  if (x.type === 'крок') {
    const g = x.corrected ? x.corrected.good : x.good, s = x.corrected ? x.corrected.scrap : x.scrap;
    return '<b>' + esc(x.step) + '</b> ' + esc(x.stepName) + ' · ' + g + ' / ' + s + (x.reason ? ' · ' + esc(x.reason) : '') + (x.step === 'K2' && x.x1 ? ' · ящиків ' + esc(x.x1) : '');
  }
  if (x.type === 'нова партія') return 'нова партія · ' + x.qty + ' шт' + (x.x2 && !/^MT/.test(x.batch) ? ' · старт з ' + esc(x.x2) : '');   // v27
  if (x.type === 'пропуск') return '⏭ пропущено <b>' + esc(x.step) + '</b> ' + esc(x.stepName) + ' · ' + x.qty + ' шт';   // v27
  if (x.type === 'перекладання') return 'перекладання ' + esc(x.tare || '—') + ' → ' + esc(x.tareTo);
  if (x.type === 'відокремлення') return (x.from === x.batch ? 'відокремлено ' + x.qty + ' → ' + bl(x.to) : 'додано ' + x.qty + ' з ' + bl(x.from)) + (x.x2 ? ' · ' + esc(x.x2) : '');
  if (x.type === 'вибуття') return 'вибуло ' + x.qty + ' → <b>' + esc(x.x1) + '</b> · ' + esc(x.x2);
  if (x.type === 'видача') return x.from === x.batch ? 'видано ' + x.qty + ' → ' + bl(x.to) : 'отримано ' + x.qty + ' з ' + bl(x.from) + (x.x2 ? ' · ' + esc(x.x2) : '');
  if (x.type === 'залишок') return x.from === x.batch ? 'повернуто ' + x.qty + ' ' + esc(x.x1) + ' → ' + (x.to ? bl(x.to) : 'склад') : 'отримано залишок ' + x.qty + ' ' + esc(x.x1) + ' з ' + bl(x.from);
  if (x.type === 'покупні' || x.type === 'власні') return '+ ' + esc(partsWhat({ type: x.type, comp: x.x1, qty: x.qty })) + ' ' + esc(partsVer(x));
  return esc(x.type) + (x.qty ? ' · ' + x.qty : '') + (own ? '' : '');
}

    '<div class="chips" style="margin-bottom:8px">' + [['all', 'Усе'], ['own', 'Тільки ця партія'], ['steps', 'Тільки кроки']].map(x =>

      '<div class="li"><div class="' + (x.cancelled ? 'x' : '') + '">' + (x.own ? '' : '<span class="pill warn" style="margin:0 6px 0 0">' + esc(x.batch) + '</span>') + histWhat(x) +

        esc(s.stepName) + '</span></td><td>' + esc(s.who) + '</td><td class="r">' + fn(s.good) + '</td><td class="r">' + (s.scrap || '—') + '</td></tr>').join('') + '</table></div>'

// =============================================================== СКЛАД (v9)
// QR на дверях складу: …?s=П1. Видача / повернення, фото етикетки (розпізнає сервер), «Мої видачі».
let SKD = null;                 // дані від сервера
let SKF = { photo: '', raw: '', busy: null };   // фото поточного запису; busy — запит фото, що ще йде
function loadSklad() {
  $('hdrTitle').textContent = 'склад';
  $('app').innerHTML = '<div class="center muted">Завантаження…</div>';
  google.script.run.withSuccessHandler(d => { SKD = d; renderSklad(); })
    .withFailureHandler(e => {
      if (/не зареєстровано/.test(e.message)) { forgetCode(); return loadPage(); }
      $('app').innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
    }).apiSkladPage({ code: CODE, s: PARAMS.s || '' });
}
/** «1+2+5» → 8; «2,5» → 2.5; інакше NaN (сервер перевіряє так само) */
function skCalc(v) {
  const s = String(v || '').replace(/\s+/g, '').replace(/,/g, '.');
  if (!/^\d+(\.\d+)?([+\-]\d+(\.\d+)?)*$/.test(s)) return NaN;
  let sum = 0; s.match(/[+\-]?\d+(\.\d+)?/g).forEach(t => sum += Number(t));
  return Math.round(sum * 1000) / 1000;
}
function skNum(n) { return String(n).replace('.', ','); }
function renderSklad() {
  const d = SKD; const me = d.me;
  $('who').innerHTML = esc(me.name) + '<br>' + esc(me.role);
  $('hdrTitle').textContent = d.loc ? 'склад · ' + d.loc.code : 'склад';
  const locHtml = d.loc
    ? '<div class="muted">Локація: <b>' + esc(d.loc.code) + (d.loc.name && d.loc.name !== d.loc.code ? ' · ' + esc(d.loc.name) : '') + '</b></div>'
    : '<label>Локація складу</label><select id="skLoc">' + opts(d.locs.map(l => l.code + (l.name !== l.code ? ' · ' + l.name : '')), '', '— оберіть —') + '</select>';
  const posList = d.positions.map(p => p.name).concat([d.other]);
  let h = '<div class="card"><div class="mid">Робота зі складом</div>' + locHtml +
    '<label>Дія</label><div class="seg"><label><input type="radio" name="skAct" value="взяв" checked><span>Взяв</span></label>' +
    '<label><input type="radio" name="skAct" value="поклав"><span>Поклав</span></label></div>' +
    // v17: «поклав» — і повернення з виробництва, і прихід від постачальника (наповнення складу)
    '<div id="skFromBox" style="display:none"><label>Звідки</label><div class="seg"><label><input type="radio" name="skFrom" value="з виробництва"><span>З виробництва</span></label>' +
    '<label><input type="radio" name="skFrom" value="від постачальника"><span>Від постачальника</span></label></div></div>' +
    (d.photo ? '<label>Фото етикетки <span class="muted">(необов\'язково — заповнить поля саме)</span></label>' +
      '<input type="file" accept="image/*" capture="environment" id="skFile" style="display:none">' +
      '<button type="button" class="btn btn2" id="skCam" style="margin-top:0">📷 Сфотографувати етикетку</button>' +
      '<div id="skPh" class="muted" style="margin-top:8px"></div>' : '') +
    '<label id="skPosL">Що взяли</label><select id="skPos">' + opts(posList, '', '— оберіть —') + '</select>' +
    '<div id="skOtherBox" style="display:none"><label>Що саме</label><input type="text" id="skOther" placeholder="назва"></div>' +
    '<label>Типорозмір <span class="muted">(якщо є)</span></label><select id="skTyp">' + opts(d.typ, '', '—') + '</select>' +
    '<label>Деталі <span class="muted">(марка, розмір, артикул)</span></label><input type="text" id="skDet" placeholder="напр. 0,425 мм">' +
    '<label>Кількість</label><div class="row" style="align-items:center"><input type="text" inputmode="decimal" id="skQty" placeholder="напр. 1000 або 1+2+5" style="font-size:22px;font-weight:600">' +
    '<button type="button" class="ic" id="skPlus" style="flex:0 0 58px;font-size:26px;padding:10px 0;margin:0">+</button></div>' +
    '<div id="skSum" class="muted" style="margin-top:6px;min-height:20px"></div>' +
    '<label>Одиниця</label><select id="skUnit">' + opts(d.units, 'шт') + '</select>' +
    '<label>Партія постачальника <span class="muted">(з коробки, якщо є)</span></label><input type="text" id="skLot">' +
    '<label>Партія МЛП <span class="muted">(необов\'язково)</span></label><input type="text" id="skMlp" placeholder="напр. ST-00012" autocapitalize="characters">' +
    '<label>Коментар</label><textarea id="skCm"></textarea>' +
    '<button class="btn" id="skGo">Записати</button><div class="err" id="err"></div></div>';
  h += '<div id="skMy"></div><p class="muted" style="text-align:center">' + esc(PAGE_VERSION) + ' · ' + esc(d.version) + '</p><div style="height:20px"></div>';
  $('app').innerHTML = h;
  renderSkMy();
  $('skPos').onchange = () => {
    const v = $('skPos').value;
    $('skOtherBox').style.display = v === d.other ? 'block' : 'none';
    const p = d.positions.find(x => x.name === v); if (p && !SKF.unitTouched) $('skUnit').value = p.unit;
  };
  $('skUnit').onchange = () => SKF.unitTouched = true;
  document.querySelectorAll('input[name=skAct]').forEach(r => r.onchange = () => {
    const put = (document.querySelector('input[name=skAct]:checked') || {}).value === 'поклав';
    $('skFromBox').style.display = put ? 'block' : 'none'; $('skPosL').textContent = put ? 'Що поклали' : 'Що взяли';
  });
  $('skQty').oninput = skShowSum;
  $('skPlus').onclick = () => { const q = $('skQty'); if (q.value && !/[+\-]$/.test(q.value)) q.value += '+'; q.focus(); skShowSum(); };
  if (d.photo) {
    $('skCam').onclick = () => $('skFile').click();
    $('skFile').onchange = e => { const f = e.target.files && e.target.files[0]; if (f) skPhoto(f); e.target.value = ''; };
  }
  $('skGo').onclick = skSave;
}
function skShowSum() {
  const v = $('skQty').value; const n = skCalc(v); const box = $('skSum');
  const hint = SKF.hint ? '<span>на етикетці: ' + esc(SKF.hint) + '</span>' : '';
  if (!v) { box.innerHTML = hint; return; }
  if (isNaN(n)) { box.innerHTML = '<span style="color:#9B231A">лише числа і «+»</span>'; return; }
  box.innerHTML = /[+\-]/.test(v.replace(/^[+\-]/, '')) ? '<b style="color:#1D2B33;font-size:18px">= ' + skNum(n) + '</b>' + (hint ? ' · ' + hint : '') : hint;
}
/** Стиснути фото до 1600 px (JPEG) — швидше відправка, сервер і модель читають етикетку так само */
function skShrink(file) {
  return new Promise((ok, fail) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('Не вдалося відкрити фото')); };
    img.src = url;
  });
}
function skPhoto(file) {
  const ph = $('skPh');
  SKF.photo = ''; SKF.raw = ''; SKF.hint = '';
  ph.innerHTML = 'Надсилаю фото…';
  $('skCam').textContent = '📷 Перезняти етикетку';
  SKF.busy = skShrink(file).then(data => {
    ph.innerHTML = '<img src="' + data + '" style="height:64px;border-radius:8px;vertical-align:middle;margin-right:8px">Розпізнаю етикетку…';
    const loc = SKD.loc ? SKD.loc.code : ($('skLoc') ? $('skLoc').value.split(' ')[0] : '');
    return post('skladPhoto', { code: CODE, loc: loc, img: data.split(',')[1] }).then(r => {
      SKF.photo = r.photo; SKF.raw = r.raw || '';
      const img = '<img src="' + data + '" style="height:64px;border-radius:8px;vertical-align:middle;margin-right:8px">';
      if (r.fields) { skFill(r.fields); ph.innerHTML = img + '✓ Розпізнано — перевірте поля й впишіть, скільки взяли'; }
      else ph.innerHTML = img + 'Фото збережено, але розпізнати не вдалось — заповніть поля вручну' +
        (SKD.me.role === 'адміністратор' ? '<br><span style="color:#9B231A">' + esc(r.recError || '') + '</span>' : '');
    });
  }).catch(e => { ph.innerHTML = '<span style="color:#9B231A">' + esc(e.message) + '</span> — можна записати без фото'; })
    .then(() => { SKF.busy = null; });
}
/** Заповнити з етикетки лише порожні поля — що людина вже вписала, не чіпаємо */
function skFill(f) {
  const set = (id, v) => { const el = $(id); if (el && v && !el.value) el.value = v; };
  if (f.position && !$('skPos').value) { $('skPos').value = f.position; $('skPos').onchange(); }
  set('skTyp', f.typ);
  set('skDet', [f.details, f.article ? 'арт. ' + f.article : '', f.supplier].filter(x => x).join(' · ').slice(0, 120));
  set('skLot', f.lot);
  const u = { 'pcs': 'шт', 'pc': 'шт', 'шт': 'шт', 'шт.': 'шт', 'm': 'м', 'м': 'м', 'kg': 'кг', 'кг': 'кг', 'g': 'г', 'г': 'г' }[String(f.unit || '').toLowerCase()];
  if (u && !SKF.unitTouched && SKD.units.indexOf(u) >= 0) $('skUnit').value = u;
  if (f.qty_in_box) { SKF.hint = f.qty_in_box + (f.unit ? ' ' + f.unit : ''); skShowSum(); }
}
function skSave() {
  const btn = $('skGo'); if (btn.disabled) return;
  $('err').textContent = '';
  const n = skCalc($('skQty').value);
  if (!$('skQty').value || isNaN(n) || !(n > 0)) { $('err').textContent = 'Вкажіть кількість (число або 1+2+5)'; return; }
  btn.disabled = true; btn._t = btn.textContent; btn.textContent = SKF.busy ? 'Чекаю фото…' : 'Зберігаю…';
  const go = () => {
    btn.textContent = 'Зберігаю…';
    const act = (document.querySelector('input[name=skAct]:checked') || {}).value;
    const from = act === 'поклав' ? (document.querySelector('input[name=skFrom]:checked') || {}).value || '' : '';
    if (act === 'поклав' && !from) throw new Error('Оберіть, звідки поклали: з виробництва чи від постачальника');
    const loc = SKD.loc ? SKD.loc.code : ($('skLoc').value || '').split(' ')[0];
    return post('skladSave', { code: CODE, loc: loc, act: act, pos: $('skPos').value, posOther: $('skOther').value, typ: $('skTyp').value,
      det: $('skDet').value, qty: $('skQty').value, unit: $('skUnit').value, lot: $('skLot').value, mlp: $('skMlp').value, from: from,
      comment: $('skCm').value, photo: SKF.photo, raw: SKF.raw }).then(r => {
      btn.disabled = false; btn.textContent = btn._t;
      toast(r.msg || 'Записано');
      SKD.my = r.my || SKD.my;
      SKF = { photo: '', raw: '', busy: null };
      ['skPos', 'skOther', 'skTyp', 'skDet', 'skQty', 'skLot', 'skMlp', 'skCm'].forEach(id => { if ($(id)) $(id).value = ''; });
      $('skOtherBox').style.display = 'none'; $('skSum').innerHTML = '';
      if ($('skPh')) { $('skPh').innerHTML = ''; $('skCam').textContent = '📷 Сфотографувати етикетку'; }
      $('skUnit').value = 'шт';
      renderSkMy(); window.scrollTo(0, 0);
    });
  };
  (SKF.busy || Promise.resolve()).then(go).catch(e => {
    btn.disabled = false; btn.textContent = btn._t;
    const m = String(e.message || e).replace(/^Error:\s*/, ''); $('err').textContent = m; toast(m, true);
  });
}
function renderSkMy() {
  const my = SKD.my || [];
  const box = $('skMy'); if (!box) return;
  box.innerHTML = '<details' + (my.length ? ' open' : '') + '><summary>' + (SKD.allView ? 'Усі записи' : 'Мої записи') + ' за 30 днів (' + my.filter(x => !x.cancelled).length + ')</summary><div class="list">' +
    (my.length ? my.map(x => '<div class="li"><div class="' + (x.cancelled ? 'x' : '') + '">' +
      (x.act === 'повернув' || x.act === 'поклав' ? '<span class="pill warn" style="margin:0 6px 0 0">поклав' + (x.from ? ' · ' + esc(x.from) : '') + '</span>' : '') +
      '<b>' + esc(x.pos) + (x.typ ? ' ' + esc(x.typ) : '') + '</b> — ' + esc(skNum(x.qty)) + ' ' + esc(x.unit) +
      '<br><span class="muted">' + (x.who ? esc(x.who) + ' · ' : '') + esc(x.loc) + (x.det ? ' · ' + esc(x.det) : '') + (x.lot ? ' · партія ' + esc(x.lot) : '') + (x.mlp ? ' · ' + esc(x.mlp) : '') +
      (x.photo ? ' · 📷' : '') + (x.cancelled ? ' · скасовано' : '') + '</span></div>' +
      '<div class="r muted">' + esc(x.time.slice(0, 5)) + '<br>' + esc(x.time.slice(6)) +
      (x.canCancel ? '<br><button class="ic" onclick="skCancel(\'' + esc(x.id) + '\')">✖</button>' : '') + '</div></div>').join('')
      : '<p class="muted">Записів ще немає.</p>') + '</div></details>';
}
function skCancel(id) {
  confirmBox('Скасувати запис ' + id + '?', () => {
    busy(true);
    google.script.run.withSuccessHandler(r => { busy(false); toast(r.msg); SKD.my = r.my; renderSkMy(); })
      .withFailureHandler(e => { busy(false); toast(e.message, true); }).apiSkladCancel({ code: CODE, id: id });
  });
}

$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
