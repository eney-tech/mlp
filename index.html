<body>
<header class="hdr">
  <a href="./" class="hbtn home" title="Головна" aria-label="Головна"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h4.5v-5.5h4v5.5h4.5V10"/></svg></a>
  <button class="hbtn" id="backBtn" title="Назад" aria-label="Назад" onclick="goBack()"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="ttl"><small id="hdrCode"></small><span id="hdrTitle">МЛП</span></div><div class="who" id="who"></div>
</header>
<div class="wrap"><nav class="side" id="side"></nav><div id="app"><div class="center muted">Завантаження…</div></div></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="scan" id="scan"><div class="vw"><video id="scv" playsinline muted></video><div class="fr"></div></div><div class="tx" id="sctx">Наведіть камеру на QR тари, піддона або плаката</div>
  <div class="bt"><button onclick="scanPhoto()">📷 Фото замість відео</button><button onclick="scanStop()">Закрити</button></div><input type="file" id="scf" accept="image/*" capture="environment" style="display:none" onchange="scanFile(this)"></div>
<div class="tip" id="tip"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const PAGE_VERSION = 'index.html v37 · 18.10.2026';
const API = 'https://script.google.com/macros/s/AKfycbx-JUajnAtVsxaLHDgwRpfzE12g4LUtlf6JnWYAQScAVZ5FCpxzGHSrA5PDESqP80KD/exec';
window.STATIC_SELF = location.origin + location.pathname;
const PARAMS = Object.fromEntries(new URLSearchParams(location.search));
var google = { script: { get run() {
  let ok = () => {}, fail = () => {};
  const call = (api, q) => fetch(API + '?api=' + api + '&q=' + encodeURIComponent(JSON.stringify(q)), { credentials: 'omit', redirect: 'follow' })
    .then(r => r.json()).then(j => j.ok ? ok(j.data) : fail({ message: j.error }))
    .catch(e => fail({ message: 'Немає зв\'язку з сервером. Перевірте інтернет і спробуйте ще раз.' }));
  const o = { withSuccessHandler(f) { ok = f; return o; }, withFailureHandler(f) { fail = f; return o; },
    apiPage(q) { call('page', q); }, apiAct(q) { call('act', q); }, apiApprove(q) { call('approve', q); }, apiCabinet(q) { call('cabinet', q); }, apiDash(q) { call('dash', q); }, apiHistory(q) { call('hist', q); },
    apiSkladPage(q) { call('skladPage', q); }, apiSkladCancel(q) { call('skladCancel', q); }, apiPeek(q) { call('peek', q); } };
  return o;
} } };
/** v9: POST — для великих запитів (фото). text/plain, щоб не було попереднього запиту CORS. */
function post(api, q) {
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: api, q: q }), credentials: 'omit', redirect: 'follow' })
    .then(r => r.json(), () => { throw new Error('Немає зв\'язку з сервером. Перевірте інтернет і спробуйте ще раз.'); })
    .then(j => { if (!j.ok) throw new Error(j.error); return j.data; });
}
let S = {};           // дані сторінки
let CODE = store('mlp_code');

function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k) || ''; if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }
  catch (e) { return ''; }
}
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function $(id) { return document.getElementById(id); }
function toast(msg, bad) { const t = $('toast'); t.textContent = msg; t.style.background = bad ? '#B3261E' : '#1F7A4D'; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', bad ? 6000 : 3500); }
function closeModal() { $('modal').style.display = 'none'; }
function openModal(html) { $('sheet').innerHTML = html; $('modal').style.display = 'flex'; }
function link(q) { return (window.STATIC_SELF || S.webapp || '') + '?' + q; }

function load(extra) {
  navRender();
  if (PARAMS.approve) return loadApprove();
  if (PARAMS.r && CODE) return renderReports();   // v33: список звітів ролі (вкладка «Звіти» на телефоні)
  if (PARAMS.cab && CODE) return loadCabinet();   // без коду телефону — звичайний шлях: екран реєстрації
  if (PARAMS.d && CODE) return loadDash();
  if (PARAMS.h && CODE) return loadHistory();
  if ((PARAMS.s || PARAMS.sklad) && CODE) return loadSklad();
  loadPage(extra);
}
function loadPage(extra) {
  // v12: телефон ще без коду, але форму вже надсилали з цього браузера — перевіряємо код, що чекає (mlp_pending)
  const pend = CODE ? '' : store('mlp_pending');
  const q = Object.assign({}, PARAMS, { code: CODE || pend });
  if (!CODE) q.rg = regDiag('відкриття', pend);
  google.script.run.withSuccessHandler(d => { if (!CODE && pend && d.me) return regDone(pend, d); if (CODE && !d.me) forgetCode(); S = d; render(extra || {}); })
    .withFailureHandler(e => { $('app').innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; })
    .apiPage(q);
}

/** Яку сторінку показати після дії: сервер повертає її в тій самій відповіді (v3 — без другого звернення) */
function viewParams() { const v = {}; ['t', 'b'].forEach(k => { if (PARAMS[k]) v[k] = PARAMS[k]; }); return v; }
/** Для адміністратора: сервер усього (старт · черга · читання · запис · сторінка) / разом із мережею */
function timing(r, total) {
  const p = r.parts || {}; const d = (a, b) => sec(Math.max(0, (p[a] || 0) - (b ? p[b] || 0 : 0)));
  return 'сервер ' + sec(r.ms) + (p.page !== undefined ? ' (старт ' + d('who') + ' · черга ' + d('lock', 'who') + ' · читання ' + d('read', 'lock') +
    ' · запис ' + d('write', 'read') + ' · сторінка ' + d('page', 'write') + ')' : '') + ' / разом ' + sec(total);
}
function sec(ms) { return (ms / 1000).toFixed(1).replace('.', ',') + ' с'; }
function showPage(r, extra) { if (r && r.page) { S = r.page; render(extra || {}); } else load(extra); }
function setUrl() { try { const q = new URLSearchParams(PARAMS).toString(); history.replaceState(null, '', location.pathname + (q ? '?' + q : '')); } catch (e) { } }

/** v7: дія без своєї кнопки (після «Так» у підтвердженні: ↩ назад, ✖ свій запис) — плашка «Зберігаю…» внизу,
 *  поки сервер не відповів; повторне натискання в цей час нічого не робить */
let BUSY = false;
function busy(on) {
  BUSY = on; const t = $('toast');
  if (on) { clearTimeout(t._h); t.textContent = 'Зберігаю…'; t.style.background = '#2F4858'; t.style.display = 'block'; }
  else if (t.textContent === 'Зберігаю…') t.style.display = 'none';
}
function act(payload, btn, after) {
  const t0 = Date.now();
  if (!btn && BUSY) return;
  if (btn) { btn.disabled = true; btn._t = btn.textContent; btn.textContent = 'Зберігаю…'; } else busy(true);
  payload.code = CODE;
  if (payload.view === undefined) payload.view = viewParams();
  google.script.run.withSuccessHandler(r => {
    if (btn) { btn.disabled = false; btn.textContent = btn._t; } else busy(false);
    if (r && r.warn) { confirmBox(r.warn, () => { payload.force = true; act(payload, btn, after); }); return; }
    closeModal();
    let msg = r.msg || 'Готово';
    // адміністратору — час запису: сервер / разом із мережею (перевірка швидкості під час тестів)
    if (S.me && S.me.role === 'адміністратор' && r.ms !== undefined) msg += ' · ' + timing(r, Date.now() - t0);
    toast(msg, !!r.alert);   // v13: напр. «⚠ Етикетки не надіслано» — червоним
    if (r.showBatch) { PARAMS.b = r.showBatch; delete PARAMS.t; setUrl(); }   // v13: після останнього K2 — картка партії, а не вільна тара
    if (after) after(r); else showPage(r, {});
  }).withFailureHandler(e => {
    if (btn) { btn.disabled = false; btn.textContent = btn._t; } else busy(false);
    const m = String(e.message || e).replace(/^Error:\s*/, '');
    const box = $('err'); const inModal = $('modal').style.display === 'flex';
    if (box && !inModal) box.textContent = m;
    const mb = $('merr'); if (mb && inModal) mb.textContent = m;
    // v16: повідомлення один раз — у формі; червона смужка внизу лише коли поля для помилки немає
    if (!((box && !inModal) || (mb && inModal))) toast(m, true);
  }).apiAct(payload);
}

function confirmBox(text, yes) {
  openModal('<div class="card"><div class="mid">' + esc(text) + '</div><div class="grid" style="margin-top:16px">' +
    '<button class="btn btn2" onclick="closeModal()">Ні</button><button class="btn" id="yesb">Так</button></div></div>');
  $('yesb').onclick = () => { closeModal(); yes(); };
}

function numInput(id, val) {
  return '<div class="num"><button type="button" onclick="bump(\'' + id + '\',-1)">−</button>' +
    '<input type="number" inputmode="numeric" pattern="[0-9]*" id="' + id + '" value="' + esc(val) + '">' +
    '<button type="button" onclick="bump(\'' + id + '\',1)">+</button></div>';
}
function bump(id, d) { const i = $(id); i.value = Math.max(0, (Number(i.value) || 0) + d); i.dispatchEvent(new Event('input')); }
function opts(list, sel, ph) { return (ph ? '<option value="">' + esc(ph) + '</option>' : '') + list.map(x => '<option' + (String(x) === String(sel) ? ' selected' : '') + '>' + esc(x) + '</option>').join(''); }
/** v18: тімлід — «Хто виконав» і «Дата» (Code.gs v21: a.who, a.at). Вибір тримається в ONB, поки сторінка відкрита (дооформлення кількох кроків поспіль) */
let ONB = { who: '', date: '', time: '' };
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function onbHtml() {
  if (!S.perms || !S.perms.onBehalf || !S.people) return '';
  const n = S.retroDays || 30; const now = new Date();
  if (ONB.who && !S.people.some(x => x.id === ONB.who)) ONB.who = '';
  const me = S.me ? S.me.name : 'я';
  return '<div class="onb' + (ONB.who || ONB.date ? ' on' : '') + '" id="onb">' +
    '<label>Хто виконав</label><select id="onbWho"><option value="">Я — ' + esc(me) + '</option>' +
    S.people.filter(x => !S.me || x.id !== S.me.id).map(x => '<option value="' + esc(x.id) + '"' + (x.id === ONB.who ? ' selected' : '') + '>' + esc(x.name) + (x.site ? ' · ' + esc(x.site) : '') + '</option>').join('') + '</select>' +
    '<label>Дата, якщо не сьогодні (до ' + n + ' дн. назад)</label><div class="row"><div><input type="date" id="onbDate" value="' + esc(ONB.date) + '" min="' + ymd(new Date(now.getTime() - n * 86400000)) + '" max="' + ymd(now) + '"></div>' +
    '<div style="flex:.7"><input type="time" id="onbTime" value="' + esc(ONB.time) + '"></div></div>' +
    '<div class="muted" id="onbNote" style="margin-top:6px"></div></div>';
}
function onbWire() {
  if (!$('onb')) return;
  const upd = () => {
    ONB = { who: $('onbWho').value, date: $('onbDate').value, time: $('onbDate').value ? $('onbTime').value : '' };
    const p = ONB.who ? S.people.find(x => x.id === ONB.who) : null;
    const today = ONB.date === ymd(new Date()) && !ONB.time;   // сьогодні без часу — те саме, що «зараз»
    $('onb').className = 'onb' + (ONB.who || (ONB.date && !today) ? ' on' : '');
    $('onbNote').innerHTML = (p ? 'Записуєте <b>за ' + esc(p.name) + '</b>' : 'Записуєте за себе') +
      (ONB.date && !today ? ' · дата <b>' + esc(ONB.date.split('-').reverse().join('.')) + (ONB.time ? ' ' + esc(ONB.time) : '') + '</b>' : ' · сьогодні') +
      (ONB.who || ONB.date ? ' · <a class="lnk" href="#" id="onbReset">скинути</a>' : '');
    if ($('onbReset')) $('onbReset').onclick = e => { e.preventDefault(); $('onbWho').value = ''; $('onbDate').value = ''; $('onbTime').value = ''; upd(); };
  };
  ['onbWho', 'onbDate', 'onbTime'].forEach(id => $(id).onchange = upd);
  upd();
}
function onbVal() { return $('onb') ? { who: ONB.who, at: ONB.date ? ONB.date + (ONB.time ? 'T' + ONB.time : '') : '' } : {}; }

function tarePicker(id, types) {
  return '<div class="row"><select id="' + id + 't" style="flex:0 0 38%">' + opts(types) + '</select>' +
    '<input type="number" inputmode="numeric" id="' + id + 'n" placeholder="номер"></div>';
}
function tareVal(id) { const n = $(id + 'n').value; return n ? $(id + 't').value + '-' + n : ''; }

// =============================================================== RENDER
function render(extra) {
  const me = S.me;
  if (me && !me.unknown && S.perms) navSave(me, S.perms);
  $('who').innerHTML = me ? whoHtml(me, S.perms, me.unknown) : '';
  if (S.error) { $('app').innerHTML = '<div class="card err">' + esc(S.error) + '</div>'; return; }
  if (!me) { document.body.classList.add('nonav'); setView('', 'Реєстрація', ''); return renderReg(); }
  if (S.pending) {
    document.body.classList.add('nonav');
    $('app').innerHTML = '<div class="card"><div class="mid">Телефон зареєстровано</div>' +
      '<p class="muted">Акаунт <b>' + esc(me.email) + '</b> чекає підтвердження тімлідом. Після підтвердження натисніть кнопку нижче.</p>' +
      '<button class="btn btn2" onclick="load()">Перевірити ще раз</button></div>';
    return;
  }
  if (S.poster) return renderPoster();
  if (S.tare && !S.batch) { setView('', S.tare.code, 'home'); return renderNew(); }
  if (S.batch) { setView(S.tare ? S.tare.code : '', S.batch.info && S.batch.info['Номер'] ? S.batch.info['Номер'] : (S.tare ? S.tare.code : 'Партія'), 'home'); return renderBatch(extra); }
  renderHome();
}
/** Шапка (ПК): ім'я і роль. v33: переходи — у меню (ліве на ПК, нижнє на телефоні), не в шапці */
function whoHtml(me, perms, unknown) {
  return esc(me.name) + '<br>' + esc(me.role) + (unknown ? ' · ⚠ на перевірці' : '');
}
// =============================================================== v33: ОБОЛОНКА — меню, шапка, Головна, сканер QR, довідка
/** Роль і права для меню. Сторінки кабінету, звітів і складу не викликають apiPage, тож меню бере роль з пристрою (останнє відоме) */
let NAV = (() => { try { return JSON.parse(store('mlp_nav') || '{}') || {}; } catch (e) { return {}; } })();
const NAV_KEYS = ['step', 'separate', 'noBatch', 'sklad', 'dashStan', 'dashTare', 'dashMy', 'history', 'cabinet'];
function navSave(me, perms) {
  const n = { role: me.role, name: me.name, perms: NAV.perms || {} };
  if (perms) { n.perms = {}; NAV_KEYS.forEach(k => n.perms[k] = !!perms[k]); }
  else if (NAV.role !== me.role) n.perms = {};   // роль змінилась, а прав ще не знаємо — меню до наступного відкриття головної мінімальне
  NAV = n; store('mlp_nav', JSON.stringify(n)); navRender();
}
const DASHT = { stan: ['Р-2', 'Стан зараз'], tare: ['Р-5', 'Аналіз тари'], my: ['Р-8с', 'Мій виробіток'] };
/** Звіти ролі для меню (Р-0_07). «Мій виробіток» у меню — працівнику (окрема вкладка) і зав. відділу браку (рішення 18.10) */
function navReports() {
  const p = NAV.perms || {}, r = [];
  if (p.dashStan) r.push(['d=stan', 'stan']);
  if (p.dashTare) r.push(['d=tare', 'tare']);
  if (p.dashMy && NAV.role === 'зав. відділу браку') r.push(['d=my', 'my']);
  if (p.dashMy && ['тімлід', 'зав. виробництва', 'адміністратор'].indexOf(NAV.role) >= 0) r.push(['d=my', 'my', ' 👁']);   // v36: перегляд як працівник (Р-0_08)
  return r;
}
let VIEW = '';
/** Назва в шапці (код звіту — дрібно над назвою) і активний пункт меню */
function setView(code, title, view) {
  $('hdrCode').textContent = code || ''; $('hdrTitle').textContent = title || 'МЛП';
  document.title = (title ? title + ' · ' : '') + 'МЛП';
  VIEW = view; navRender();
}
function goBack() {
  const same = document.referrer && document.referrer.indexOf(location.origin + location.pathname) === 0;
  if (same && history.length > 1) history.back(); else location.href = link('');
}
const NIC = {
  home: '<svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h4.5v-5.5h4v5.5h4.5V10"/></svg>',
  work: '<svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.6 17.2a1.5 1.5 0 0 0 2.1 2.1l5.7-5.7a4 4 0 0 0 5.2-5.4l-2.4 2.4-2.2-.6-.6-2.2z"/><path d="M15 15l4.5 4.5M17.5 13.5l3 3-1.5 1.5-3-3"/></svg>',
  rep: '<svg viewBox="0 0 24 24"><path d="M4 20h16"/><rect x="5.5" y="11" width="3" height="7"/><rect x="10.5" y="6" width="3" height="12"/><rect x="15.5" y="13" width="3" height="5"/></svg>',
  sklad: '<svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5v11H3z"/><path d="M7 20v-7h10v7"/></svg>',
  cab: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>'
};
/** Р-0_18 нижнє меню телефона і Р-0_07 ліве меню ПК — за роллю */
function navRender() {
  const side = $('side'), tb = $('tabbar'); if (!side || !tb) return;
  const worker = NAV.role === 'працівник', reps = navReports(), p = NAV.perms || {};
  const curD = PARAMS.d || '';
  const a = (href, inner, on) => '<a href="' + esc(link(href)) + '" class="' + (on ? 'on' : '') + '">' + inner + '</a>';
  let h = a('', '<span>⌂</span>Головна', VIEW === 'home') + a('cab=1', '<span>☰</span>Кабінет', VIEW === 'cab');
  if (worker && p.dashMy) h += '<div class="sec">Звіти</div>' + a('d=my', '<span class="code">Р-8с</span>Мій виробіток', curD === 'my');
  else if (reps.length) h += '<div class="sec">Звіти</div>' + reps.map(x => a(x[0], '<span class="code">' + DASHT[x[1]][0] + '</span>' + DASHT[x[1]][1] + (x[2] || ''), curD === x[1])).join('');
  side.innerHTML = h;
  const tabs = [['', NIC.home, 'Головна', VIEW === 'home']];
  if (worker && p.dashMy) tabs.push(['d=my', NIC.work, 'Мій виробіток', VIEW === 'my']);
  else if (reps.length) tabs.push(['r=1', NIC.rep, 'Звіти', VIEW === 'rep']);
  else if (p.sklad && !p.step) tabs.push(['sklad=1', NIC.sklad, 'Склад', false]);   // зав. складу — звітів немає
  tabs.push(['cab=1', NIC.cab, 'Кабінет', VIEW === 'cab']);
  tb.innerHTML = tabs.map(x => '<a href="' + esc(link(x[0])) + '" class="' + (x[3] ? 'on' : '') + '"><span class="i">' + x[1] + '</span>' + x[2] + '</a>').join('');
  $('backBtn').classList.toggle('hid', VIEW === 'home' && !location.search.replace(/^\?$/, ''));
}
/** v33: список звітів ролі (вкладка «Звіти» на телефоні) */
function renderReports() {
  document.body.classList.remove('nonav');
  setView('', 'Звіти', 'rep');
  const reps = navReports();
  $('app').innerHTML = (reps.length ? '<div class="tiles">' + reps.map(x => '<a class="tile" href="' + esc(link(x[0])) + '"><div class="tn">' + esc(DASHT[x[1]][0] + ' · ' + DASHT[x[1]][1] + (x[2] || '')) + '</div></a>').join('') + '</div>'
    : '<div class="card muted">Звітів для вашої ролі ще немає.</div>') + '<p class="muted" style="text-align:center">' + esc(PAGE_VERSION) + '</p>';
}

/** Головна (Р-0_05): тільки те, чого немає в меню — сканер QR, відкрити тару або партію, робота без партії, склад, довідка */
function renderHome() {
  document.body.classList.remove('nonav');
  setView('', 'Головна', 'home');
  const p = S.perms || {};
  const prod = !!(p.step || p.separate);   // v11: зав. складу — без виробництва; v17: зав. відділу браку — лише тара й партії
  let h = '';

// ---- Р-0_19 сканер QR: камера (BarcodeDetector, де є; інакше jsQR), запасний варіант — фото
const SC = { stream: null, timer: 0, det: null, busy: false };
function loadJsQR() { return window.jsQR ? Promise.resolve() : new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; sc.onload = ok; sc.onerror = () => no(new Error('Не вдалося завантажити розпізнавання QR — перевірте інтернет або зробіть фото')); document.head.appendChild(sc); }); }
function scanStart() {
  $('scan').classList.add('on'); $('sctx').textContent = 'Наведіть камеру на QR тари, піддона або плаката';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('sctx').textContent = 'Камера недоступна в цьому браузері — натисніть «Фото замість відео».'; return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }).then(st => {
    SC.stream = st; const v = $('scv'); v.srcObject = st; v.play();
    SC.det = null; if ('BarcodeDetector' in window) { try { SC.det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { SC.det = null; } }
    (SC.det ? Promise.resolve() : loadJsQR()).then(() => { SC.timer = setInterval(scanTick, 250); }).catch(e => $('sctx').textContent = e.message);
  }).catch(() => { $('sctx').textContent = 'Немає доступу до камери. Дозвольте камеру в браузері або натисніть «Фото замість відео».'; });
}
function scanTick() {
  const v = $('scv'); if (SC.busy || !v.videoWidth) return; SC.busy = true;
  const done = t => { SC.busy = false; if (t) { scanStop(); scanGo(t); } };
  if (SC.det) { SC.det.detect(v).then(r => done(r[0] && r[0].rawValue)).catch(() => done(null)); return; }
  const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; const x = c.getContext('2d'); x.drawImage(v, 0, 0);
  const q = window.jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height); done(q && q.data);
}
function scanStop() { clearInterval(SC.timer); if (SC.stream) SC.stream.getTracks().forEach(t => t.stop()); SC.stream = null; $('scan').classList.remove('on'); }
function scanPhoto() { $('scf').click(); }
function scanFile(inp) {
  const f = inp.files && inp.files[0]; if (!f) return; inp.value = '';
  const img = new Image(); img.onload = () => loadJsQR().then(() => {
    const k = Math.min(1, 1200 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height); const q = window.jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height);
    if (q && q.data) { scanStop(); scanGo(q.data); } else $('sctx').textContent = 'QR на фото не знайдено. Спробуйте ближче й рівніше.';
  }).catch(e => $('sctx').textContent = e.message);

}
/** QR МЛП — посилання на цю сторінку (?t=, ?b=, ?h=, ?s=, ?nb=1, ?d=my, ?cab=1, ?p=) — відкриваємо як є; «голий» код — тара або партія */
function scanGo(text) {
  const t = String(text || '').trim();
  try {
    const u = new URL(t);
    if (/(^|\.)eney\.tech$|github\.io$/.test(u.hostname) || u.origin === location.origin) { location.href = link(u.search.replace(/^\?/, '')); return; }
    if (/script\.google\.com$/.test(u.hostname) && u.search) { location.href = link(u.search.replace(/^\?/, '')); return; }
    toast('Це не QR МЛП: ' + t.slice(0, 60), true); return;
  } catch (e) { }
  const up = t.toUpperCase().replace(/\s+/g, '');
  if (/^[SRMСРМ][TТ]?-?\d+$/.test(up)) { location.href = link('b=' + encodeURIComponent(up)); return; }
  if (/^[А-ЯІЇЄҐA-Z]{2}-?\d+$/.test(up)) { location.href = link('t=' + encodeURIComponent(up)); return; }
  toast('QR прочитано, але це не код тари чи партії: ' + t.slice(0, 60), true);
}

const info = t => '<span class="info" data-tip="' + esc(t) + '" tabindex="0" role="button" aria-label="Пояснення">?</span>';
function infoShow(el) {
  const tip = $('tip'); tip.textContent = el.dataset.tip; tip.style.display = 'block'; tip._info = el;
  const r = el.getBoundingClientRect(); tip.style.maxWidth = Math.min(280, window.innerWidth - 24) + 'px';
  tip.style.left = Math.max(12, Math.min(r.left - 10, window.innerWidth - tip.offsetWidth - 12)) + 'px';
  const bot = window.innerHeight - 70; tip.style.top = (r.bottom + 6 + tip.offsetHeight > bot ? r.top - tip.offsetHeight - 6 : r.bottom + 6) + 'px';
}
function infoHide() { const tip = $('tip'); if (tip && tip._info) { tip.style.display = 'none'; tip._info = null; } }
document.addEventListener('click', e => { const el = e.target.closest && e.target.closest('.info'); if (el) { e.stopPropagation(); e.preventDefault(); if ($('tip')._info === el) infoHide(); else infoShow(el); } else infoHide(); }, true);
document.addEventListener('pointerover', e => { if (e.pointerType !== 'mouse') return; const el = e.target.closest && e.target.closest('.info'); if (el) infoShow(el); });
document.addEventListener('pointerout', e => { if (e.pointerType !== 'mouse') return; const el = e.target.closest && e.target.closest('.info'); if (el) infoHide(); });
document.addEventListener('scroll', infoHide, true);

/** v12: реєстрація телефону. Код телефону (mlp_pending) створюється один раз і живе в цьому браузері.
 *  Після кнопки 1 сторінка сама перевіряє реєстрацію: щойно людина повертається на вкладку, і ще 3 хв кожні 4 с.
 *  Новий код з'являється лише там, де браузер нічого не пам'ятає (інший браузер / приватна вкладка) — тому підказка «не скануйте QR знову». */
let REG = { pend: '', timer: null, until: 0, busy: false, hooked: false };
function regDiag(ev, pend, isNew) {
  return { ev: ev, pend: pend || '', isNew: !!isNew, ua: String(navigator.userAgent || '').slice(0, 200),
    ref: String(document.referrer || '').slice(0, 100), standalone: !!window.navigator.standalone, hist: history.length };
}
/** v17: код телефону, якого сервер не знає (рядок у «Телефони» видалено, таблицю скинуто), — забути, щоб пройти реєстрацію як новий телефон */
function forgetCode() { if (CODE) { store('mlp_code', null); CODE = ''; } }
function regStop() { if (REG.timer) clearInterval(REG.timer); REG.timer = null; REG.pend = ''; }
/** Реєстрацію знайдено: запам'ятати код і відкрити те, заради чого сканували QR */
function regDone(pend, d) {
  regStop();
  store('mlp_code', pend); store('mlp_pending', null); CODE = pend; S = d;
  toast('Телефон зареєстровано: ' + d.me.name);
  const go = !d.pending && ((PARAMS.cab && d.perms && d.perms.cabinet) || PARAMS.d || PARAMS.h || PARAMS.s || PARAMS.sklad);
  if (go) load(); else render({});
}
/** Тиха перевірка (без повідомлень); manual — натиснуто «2. Я зареєструвався» */
function regCheck(manual) {
  const pend = REG.pend; if (!pend || REG.busy) return;
  REG.busy = true;
  const q = Object.assign({}, PARAMS, { code: pend });
  if (manual) q.rg = regDiag('перевірка', pend);
  const btn = $('chk'); if (manual && btn) btn.disabled = true;
  google.script.run.withSuccessHandler(d => {
    REG.busy = false; if (btn) btn.disabled = false;
    if (REG.pend !== pend) return;
    if (d.me) return regDone(pend, d);
    if (manual && $('err')) $('err').innerHTML = 'Реєстрацію з кодом <b>' + esc(pend) + '</b> ще не знайдено.<br>Надіслали форму? Зачекайте кілька секунд — сторінка перевірить сама.' +
      '<br>Якщо форму надсилали з іншого браузера чи після повторного сканування QR — відкрийте її кнопкою 1 саме тут і надішліть ще раз.';
  }).withFailureHandler(e => { REG.busy = false; if (btn) btn.disabled = false; if (manual && $('err')) $('err').textContent = e.message; })
    .apiPage(q);
}
function regWatch() {
  REG.until = Date.now() + 3 * 60000;
  if (REG.timer) return;
  REG.timer = setInterval(() => {
    if (!REG.pend || Date.now() > REG.until) { clearInterval(REG.timer); REG.timer = null; return; }
    if (document.visibilityState === 'visible') regCheck(false);
  }, 4000);
}
function renderReg() {
  let pend = store('mlp_pending'), isNew = false;
  if (!pend) { pend = Math.random().toString(36).slice(2, 7).toUpperCase() + Date.now().toString(36).slice(-4).toUpperCase(); store('mlp_pending', pend); isNew = true; }
  const kept = store('mlp_pending') === pend;   // браузер не зберігає дані сторінки (приватний режим тощо)
  REG.pend = pend;
  if (!REG.hooked) {   // повернення з форми на цю вкладку — перевірити одразу
    REG.hooked = true;
    const back = () => { if (REG.pend && document.visibilityState === 'visible') { regCheck(false); regWatch(); } };
    document.addEventListener('visibilitychange', back);
    window.addEventListener('pageshow', e => { if (e.persisted) back(); });
  }
  const url = (S.reg || '').replace('CODE_PLACEHOLDER', encodeURIComponent(pend));
  $('app').innerHTML = '<div class="card"><div class="mid">Цей телефон ще не зареєстровано</div>' +
    '<p class="muted">Один раз: натисніть кнопку 1, увійдіть у свій Google-акаунт (той, з якого заповнюєте вечірній звіт), впишіть прізвище й ім\'я і надішліть. ' +
    'Потім поверніться на цю вкладку — сторінка сама побачить реєстрацію.</p>' +
    '<p class="warn" style="padding:8px 10px;border-radius:10px;font-size:14px;margin:0 0 12px">Не скануйте QR повторно, доки не з\'явиться «Телефон зареєстровано»: в іншій вкладці чи браузері буде інший код.</p>' +
    (kept ? '' : '<p class="bad" style="padding:8px 10px;border-radius:10px;font-size:14px;margin:0 0 12px">Браузер не зберігає дані сторінки (можливо, приватний режим). Відкрийте сторінку у звичайній вкладці.</p>') +
    '<p class="muted">Код телефону: <b>' + esc(pend) + '</b></p>' +
    '<a class="btn" id="regf" style="text-align:center;text-decoration:none" target="_blank" href="' + esc(url) + '">1. Відкрити форму реєстрації</a>' +
    '<button class="btn btn2" id="chk">2. Я зареєструвався</button><div class="err" id="err"></div></div>' +
    // v17: форму надіслали з іншого браузера / після повторного сканування — код є в надісланій формі (і в листі-копії відповіді)
    '<details><summary>Форму вже надіслали з іншої вкладки?</summary><div style="padding:0 16px 16px"><p class="muted">Впишіть код телефону з надісланої форми — сторінка перевірить його.</p>' +
    '<div class="row"><input type="text" id="regCode" autocapitalize="characters" placeholder="напр. K7QXA3F9"><button class="btn btn2" id="regUse" style="flex:0 0 40%;margin:0">Перевірити</button></div>' +
    '<div class="err" id="err2"></div></div></details>';
  $('regf').onclick = () => regWatch();
  $('chk').onclick = () => regCheck(true);
  $('regUse').onclick = () => {
    const c = $('regCode').value.trim().toUpperCase().replace(/\s+/g, ''); if (!c) return;
    $('regUse').disabled = true;
    google.script.run.withSuccessHandler(d => {
      $('regUse').disabled = false;
      if (d.me) { REG.pend = c; return regDone(c, d); }
      $('err2').textContent = 'Код ' + c + ' не знайдено. Перевірте, чи форму надіслано, і спробуйте за хвилину.';
    }).withFailureHandler(e => { $('regUse').disabled = false; $('err2').textContent = e.message; })
      .apiPage(Object.assign({}, PARAMS, { code: c, rg: regDiag('свій код', c) }));
  };
}

      const g = Number($('good').value) || 0;

      const plan = labelsPlan(g, Number($('x1').value) || 0, per);
      $('k2plan').innerHTML = plan.length ? 'Етикетки: <b>' + esc(labelsSummary(plan)) + '</b> — PDF прийде на ' + esc(S.me.email) + (S.k2 && S.k2.copy ? ' і на адресу для друку' : '') +

    $('good').oninput = () => { delete $('x1').dataset.touched; recalc(); };
    $('x1').oninput = () => { $('x1').dataset.touched = '1'; recalc(); };
    recalc();
  }

/** v13: двигунів у ящику за замовчуванням (BOX_QTY з «Налаштувань», за типорозміром) */
function boxPer() { const m = (S.k2 && S.k2.box) || {}; return Number(m[String(S.batch.info['Типорозмір'])] || m['*'] || 200); }
/** Те саме правило, що й на сервері (Labels.gs): повні ящики по per, в останньому — решта; ящиків вписано інакше — порівну */
function labelsPlan(good, boxes, per) {
  if (good <= 0) return [];
  if (!(boxes > 0)) boxes = per > 0 ? Math.ceil(good / per) : 1;
  if (boxes > good) boxes = good;
  const out = [];
  if (per > 0 && (boxes - 1) * per < good && boxes * per >= good) { for (let i = 0; i < boxes - 1; i++) out.push(per); out.push(good - per * (boxes - 1)); return out; }
  const base = Math.floor(good / boxes), extra = good % boxes;
  for (let i = 0; i < boxes; i++) out.push(base + (i < extra ? 1 : 0));
  return out;
}
function labelsSummary(plan) {
  const g = []; plan.forEach(q => { const l = g[g.length - 1]; if (l && l.q === q) l.n++; else g.push({ q: q, n: 1 }); });
  return g.map(x => x.n + ' × ' + x.q + ' шт').join(' + ');
}

/** дані графіка Р-8с_09: кошики — години (день) або дні (тиждень / місяць), серії — розріз, лінія % браку */
function z8chart(d, prices) {
  const price = r => zNum(prices[r.step + '|' + r.typ]);
  const val = r => Z8.cunit === 'uah' ? zPayQ(r) * price(r) : r.good;
  const bucket = r => d.mode === 'd' ? r.tm.slice(0, 2) : r.d;
  const cats = [];
  if (d.mode === 'd') { const hs = d.recs.map(r => Number(r.tm.slice(0, 2))); const h0 = Math.min(8, ...hs), h1 = Math.max(17, ...hs); for (let x = h0; x <= h1; x++) cats.push(String(x).padStart(2, '0')); }
  else for (let x = d.from; x <= d.to && x <= d.today; x = zAdd(x, 1)) if (zDow(x) < 5 || d.recs.some(r => r.d === x)) cats.push(x);
  const nm = c => (d.names || {})[c] || '';
  const DM = { batch: { f: r => r.batch, l: k => k }, tk: { f: r => r.typ + ' · ' + (r.kv || '—'), l: k => k }, step: { f: r => r.step, l: k => k + ' · ' + nm(k) } };
  let keys = ['__all'], kf = () => '__all';
  if (Z8.csplit !== 'none') {
    const dm = DM[Z8.csplit], tot = {}; d.recs.forEach(r => { const k = dm.f(r); tot[k] = (tot[k] || 0) + val(r); });
    keys = Object.keys(tot).sort((a, b) => tot[b] - tot[a]);
    if (Z8.csplit === 'step') { const ord = c => { const i = (d.order || []).indexOf(c); return i < 0 ? 999 : i; }; keys.sort((a, b) => ord(a) - ord(b)); }
    if (keys.length > 7) { const top = new Set(keys.slice(0, 7)); keys = keys.slice(0, 7).concat('__oth'); kf = r => top.has(dm.f(r)) ? dm.f(r) : '__oth'; } else kf = dm.f;
  }
  const series = keys.map((k, i) => ({ k: k, l: k === '__all' ? (Z8.cunit === 'uah' ? 'Сума, ₴' : 'Успішних, шт') : k === '__oth' ? 'Інші' : DM[Z8.csplit].l(k), c: k === '__all' ? ZPAL[0] : k === '__oth' ? '#9AA8B0' : ZPAL[i % 8], v: {} }));
  const si = {}; series.forEach(x => si[x.k] = x);
  d.recs.forEach(r => { const x = si[kf(r)], c = bucket(r); x.v[c] = (x.v[c] || 0) + val(r); });
  let line = null;
  if (Z8.cline) { const g = {}, t = {}; d.recs.forEach(r => { const c = bucket(r); g[c] = (g[c] || 0) + r.scrap; t[c] = (t[c] || 0) + r.good + r.scrap; }); const v = {}; Object.keys(t).forEach(c => { if (t[c]) v[c] = g[c] / t[c] * 100; }); line = { v: v, l: '% браку' }; }
  return { cats: cats, series: series, line: line, catLabel: (c, l) => d.mode === 'd' ? c + ':00' : (l ? ZDOWN[zDow(c)] + ' ' : '') + zDm(c), fmt: Z8.cunit === 'uah' ? ((v, ax) => fn(v) + (ax ? '' : ' ₴')) : fn };
}

let ZDRAW = [];

/** «1+2+5» → 8; «2,5» → 2.5; інакше NaN (сервер перевіряє так само) */
function skCalc(v) {

  if (!/^\d+(\.\d+)?([+\-]\d+(\.\d+)?)*$/.test(s)) return NaN;
  let sum = 0; s.match(/[+\-]?\d+(\.\d+)?/g).forEach(t => sum += Number(t));
  return Math.round(sum * 1000) / 1000;
}

/** Стиснути фото до 1600 px (JPEG) — швидше відправка, сервер і модель читають етикетку так само */
function skShrink(file) {
  return new Promise((ok, fail) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('Не вдалося відкрити фото')); };
    img.src = url;
  });
}

  SKF.busy = skShrink(file).then(data => {
    ph.innerHTML = '<img src="' + data + '" style="height:64px;border-radius:8px;vertical-align:middle;margin-right:8px">Розпізнаю етикетку…';
    const loc = SKD.loc ? SKD.loc.code : ($('skLoc') ? $('skLoc').value.split(' ')[0] : '');
    return post('skladPhoto', { code: CODE, loc: loc, img: data.split(',')[1] }).then(r => {
      SKF.photo = r.photo; SKF.raw = r.raw || '';
      const img = '<img src="' + data + '" style="height:64px;border-radius:8px;vertical-align:middle;margin-right:8px">';
      if (r.fields) { skFill(r.fields); ph.innerHTML = img + '✓ Розпізнано — перевірте поля й впишіть, скільки взяли'; }
      else ph.innerHTML = img + 'Фото збережено, але розпізнати не вдалось — заповніть поля вручну' +
        (SKD.me.role === 'адміністратор' ? '<br><span style="color:#9B231A">' + esc(r.recError || '') + '</span>' : '');
    });
  }).catch(e => { ph.innerHTML = '<span style="color:#9B231A">' + esc(e.message) + '</span> — можна записати без фото'; })
    .then(() => { SKF.busy = null; });
}
/** Заповнити з етикетки лише порожні поля — що людина вже вписала, не чіпаємо */
function skFill(f) {
  const set = (id, v) => { const el = $(id); if (el && v && !el.value) el.value = v; };
  if (f.position && !$('skPos').value) { $('skPos').value = f.position; $('skPos').onchange(); }
  set('skTyp', f.typ);
  set('skDet', [f.details, f.article ? 'арт. ' + f.article : '', f.supplier].filter(x => x).join(' · ').slice(0, 120));
  set('skLot', f.lot);
  const u = { 'pcs': 'шт', 'pc': 'шт', 'шт': 'шт', 'шт.': 'шт', 'm': 'м', 'м': 'м', 'kg': 'кг', 'кг': 'кг', 'g': 'г', 'г': 'г' }[String(f.unit || '').toLowerCase()];
  if (u && !SKF.unitTouched && SKD.units.indexOf(u) >= 0) $('skUnit').value = u;
  if (f.qty_in_box) { SKF.hint = f.qty_in_box + (f.unit ? ' ' + f.unit : ''); skShowSum(); }
}
function skSave() {
  const btn = $('skGo'); if (btn.disabled) return;
  $('err').textContent = '';
  const n = skCalc($('skQty').value);
  if (!$('skQty').value || isNaN(n) || !(n > 0)) { $('err').textContent = 'Вкажіть кількість (число або 1+2+5)'; return; }
  btn.disabled = true; btn._t = btn.textContent; btn.textContent = SKF.busy ? 'Чекаю фото…' : 'Зберігаю…';
  const go = () => {
    btn.textContent = 'Зберігаю…';
    const act = (document.querySelector('input[name=skAct]:checked') || {}).value;
    const from = act === 'поклав' ? (document.querySelector('input[name=skFrom]:checked') || {}).value || '' : '';
    if (act === 'поклав' && !from) throw new Error('Оберіть, звідки поклали: з виробництва чи від постачальника');
    const loc = SKD.loc ? SKD.loc.code : ($('skLoc').value || '').split(' ')[0];
    return post('skladSave', { code: CODE, loc: loc, act: act, pos: $('skPos').value, posOther: $('skOther').value, typ: $('skTyp').value,
      det: $('skDet').value, qty: $('skQty').value, unit: $('skUnit').value, lot: $('skLot').value, mlp: $('skMlp').value, from: from,
      comment: $('skCm').value, photo: SKF.photo, raw: SKF.raw }).then(r => {
      btn.disabled = false; btn.textContent = btn._t;
      toast(r.msg || 'Записано');
      SKD.my = r.my || SKD.my;
      SKF = { photo: '', raw: '', busy: null };
      ['skPos', 'skOther', 'skTyp', 'skDet', 'skQty', 'skLot', 'skMlp', 'skCm'].forEach(id => { if ($(id)) $(id).value = ''; });
      $('skOtherBox').style.display = 'none'; $('skSum').innerHTML = '';
      if ($('skPh')) { $('skPh').innerHTML = ''; $('skCam').textContent = '📷 Сфотографувати етикетку'; }
      $('skUnit').value = 'шт';
      renderSkMy(); window.scrollTo(0, 0);
    });
  };
  (SKF.busy || Promise.resolve()).then(go).catch(e => {
    btn.disabled = false; btn.textContent = btn._t;
    const m = String(e.message || e).replace(/^Error:\s*/, ''); $('err').textContent = m; toast(m, true);
  });
}
function renderSkMy() {
  const my = SKD.my || [];
  const box = $('skMy'); if (!box) return;
  box.innerHTML = '<details' + (my.length ? ' open' : '') + '><summary>' + (SKD.allView ? 'Усі записи' : 'Мої записи') + ' за 30 днів (' + my.filter(x => !x.cancelled).length + ')</summary><div class="list">' +
    (my.length ? my.map(x => '<div class="li"><div class="' + (x.cancelled ? 'x' : '') + '">' +
      (x.act === 'повернув' || x.act === 'поклав' ? '<span class="pill warn" style="margin:0 6px 0 0">поклав' + (x.from ? ' · ' + esc(x.from) : '') + '</span>' : '') +
      '<b>' + esc(x.pos) + (x.typ ? ' ' + esc(x.typ) : '') + '</b> — ' + esc(skNum(x.qty)) + ' ' + esc(x.unit) +
      '<br><span class="muted">' + (x.who ? esc(x.who) + ' · ' : '') + esc(x.loc) + (x.det ? ' · ' + esc(x.det) : '') + (x.lot ? ' · партія ' + esc(x.lot) : '') + (x.mlp ? ' · ' + esc(x.mlp) : '') +
      (x.photo ? ' · 📷' : '') + (x.cancelled ? ' · скасовано' : '') + '</span></div>' +
      '<div class="r muted">' + esc(x.time.slice(0, 5)) + '<br>' + esc(x.time.slice(6)) +
      (x.canCancel ? '<br><button class="ic" onclick="skCancel(\'' + esc(x.id) + '\')">✖</button>' : '') + '</div></div>').join('')
      : '<p class="muted">Записів ще немає.</p>') + '</div></details>';
}
function skCancel(id) {
  confirmBox('Скасувати запис ' + id + '?', () => {
    busy(true);
    google.script.run.withSuccessHandler(r => { busy(false); toast(r.msg); SKD.my = r.my; renderSkMy(); })
      .withFailureHandler(e => { busy(false); toast(e.message, true); }).apiSkladCancel({ code: CODE, id: id });
  });
}

$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
load();
</script>
</body>
